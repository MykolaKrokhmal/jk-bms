globals:
  # Physical block cache (spec section 3.5) storage -- parallel arrays,
  # not a global of jk_poll_scheduler::BlockState, for the same reason
  # jk_write_tx's own slot storage is split (see batterylifepo4.yaml's
  # own "Generic write transaction manager" comment): ESPHome's globals
  # codegen instantiates every `globals:` entry before this package's own
  # `includes:`-provided types are #included.
  - id: g_rp_last_attempt_ms
    type: uint32_t[103]
  - id: g_rp_last_success_ms
    type: uint32_t[103]
  - id: g_rp_error_count
    type: uint16_t[103]
  - id: g_rp_timeout_count
    type: uint16_t[103]
  - id: g_rp_transport_state
    type: uint8_t[103]
  - id: g_rp_revision
    type: uint32_t[103]
  # Stage 4 (typed-petting-puzzle plan §5 Phase 4): raw-payload cache, one
  # big-endian uint32_t per block, populated on EVERY successful decode
  # (right after the length check passes, before the per-block decode
  # switch) regardless of block type -- the read-modify-write write path
  # needs a FRESH raw physical-register snapshot to merge a packed field's
  # own bits into, and this is that snapshot's one shared source, keyed by
  # g_rp_last_success_ms/g_rp_revision (same index) for freshness/staleness
  # checks. Only meaningful for blocks with payload_bytes<=4 (every RW-
  # eligible block in this project is <=32 bits); wider blocks (UART hex
  # arrays, the bespoke cell-telemetry block) still populate it harmlessly
  # with their own first 4 bytes, simply never consulted for RMW.
  - id: g_rp_last_raw_word
    type: uint32_t[103]
  # -1 = no read currently outstanding; otherwise the block index whose
  # response the next completed create_read_command callback belongs to.
  # A callback for any OTHER index (a late/stale response arriving after
  # its own read already timed out and the scheduler moved on) still
  # decodes and publishes its own block's fields -- a late-but-correct
  # update is harmless and even beneficial -- but must NOT clear pending
  # state that now belongs to a DIFFERENT, currently in-flight read.
  - id: g_rp_pending_index
    type: int
    restore_value: false
    initial_value: "-1"
  - id: g_rp_pending_started_ms
    type: uint32_t
    restore_value: false
    initial_value: "0"
  # One counter over EVERY block's successful read, published as the third
  # field of read_plan_success. ESPHome's SSE server keeps one deferred event
  # per entity while a socket is backed up, so successes of other blocks can
  # be coalesced away in transit; a jump in this counter lets the browser see
  # that at once and re-read /settings/read-freshness. Diagnostic only: it
  # changes no read, no cadence and no Modbus traffic.
  - id: g_rp_success_seq
    type: uint32_t
    restore_value: false
    initial_value: "0"

interval:
  - interval: 20ms
    startup_delay: 3s
    then:
      - lambda: |-
          // Clustered read servicer (docs/project/RS485_CLUSTERED_READ_MIGRATION_PLAN.md,
          // M5). One Modbus read in flight at a time: a cluster (A1..S3, from the
          // generated table), the isolated setup-passcode status read, or -- only for
          // clusters latched to their fallback -- one legacy per-register block.
          // Scheduling, fallback latch and the RMW gate live in the desktop-tested
          // jk_cluster_runtime_core.h; this lambda only issues reads and publishes.
          const uint32_t now = millis();
          auto &rt = jk_cluster_runtime::g_runtime;
          if (!rt.begun()) rt.begin(now);

          const int timed_out = rt.check_timeout(now);
          if (timed_out >= 0) {
            ESP_LOGW("jk_clusters", "Read timeout for cluster %s (address 0x%04X)", jk_read_clusters::kClusters[timed_out].id, unsigned(jk_read_clusters::kClusters[timed_out].start));
          } else if (timed_out == jk_cluster_runtime::Runtime::kPasscodeRead) {
            ESP_LOGW("jk_clusters", "Setup-passcode status read timed out");
          } else if (timed_out == jk_cluster_runtime::Runtime::kBespokeRead) {
            ESP_LOGW("jk_clusters", "Fallback bespoke read timed out");
          }
          if (id(g_rp_pending_index) >= 0 && now - id(g_rp_pending_started_ms) > 3000U) {
            const int idx = id(g_rp_pending_index);
            id(g_rp_timeout_count)[idx] = uint16_t(id(g_rp_timeout_count)[idx] + 1);
            id(g_rp_transport_state)[idx] = jk_poll_scheduler::IDLE;
            id(g_rp_pending_index) = -1;
            ESP_LOGW("jk_poll_scheduler", "Fallback read timeout for block %u (address 0x%04X)", unsigned(idx), unsigned(jk_read_plan::kBlocks[idx].address));
          }
          if (rt.busy() || id(g_rp_pending_index) >= 0) return;

          // A write transaction in flight (jk_write_tx's 6 generic slots, the
          // CellCount topology driver, or the setup-passcode write with its 0x1470
          // readback) owns the bus: no read of any kind this tick.
          bool write_in_flight = id(g_cellcount_tx_pending) || id(g_topology_recovery_pending) || id(g_passcode_tx_pending);
          if (!write_in_flight) {
            for (uint8_t i = 0; i < 6; i++) {
              if (id(g_wtx_in_use)[i] && jk_write_tx::is_pending(id(g_wtx_status)[i])) { write_in_flight = true; break; }
            }
          }
          if (write_in_flight) return;

          // Active Settings lease: the browser's (bounded, expiring) Settings hint.
          const bool lease = id(g_active_group_hint) >= 0 && now < id(g_active_group_hint_expires_ms);
