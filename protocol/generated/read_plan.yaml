globals:
  # Physical block cache (spec section 3.5) storage -- parallel arrays,
  # not a global of jk_poll_scheduler::BlockState, for the same reason
  # jk_write_tx's own slot storage is split (see batterylifepo4.yaml's
  # own "Generic write transaction manager" comment): ESPHome's globals
  # codegen instantiates every `globals:` entry before this package's own
  # `includes:`-provided types are #included.
  - id: g_rp_last_attempt_ms
    type: uint32_t[103]
  - id: g_rp_last_success_ms
    type: uint32_t[103]
  - id: g_rp_error_count
    type: uint16_t[103]
  - id: g_rp_timeout_count
    type: uint16_t[103]
  - id: g_rp_transport_state
    type: uint8_t[103]
  - id: g_rp_revision
    type: uint32_t[103]
  # Stage 4 (typed-petting-puzzle plan §5 Phase 4): raw-payload cache, one
  # big-endian uint32_t per block, populated on EVERY successful decode
  # (right after the length check passes, before the per-block decode
  # switch) regardless of block type -- the read-modify-write write path
  # needs a FRESH raw physical-register snapshot to merge a packed field's
  # own bits into, and this is that snapshot's one shared source, keyed by
  # g_rp_last_success_ms/g_rp_revision (same index) for freshness/staleness
  # checks. Only meaningful for blocks with payload_bytes<=4 (every RW-
  # eligible block in this project is <=32 bits); wider blocks (UART hex
  # arrays, the bespoke cell-telemetry block) still populate it harmlessly
  # with their own first 4 bytes, simply never consulted for RMW.
  - id: g_rp_last_raw_word
    type: uint32_t[103]
  # -1 = no read currently outstanding; otherwise the block index whose
  # response the next completed create_read_command callback belongs to.
  # A callback for any OTHER index (a late/stale response arriving after
  # its own read already timed out and the scheduler moved on) still
  # decodes and publishes its own block's fields -- a late-but-correct
  # update is harmless and even beneficial -- but must NOT clear pending
  # state that now belongs to a DIFFERENT, currently in-flight read.
  - id: g_rp_pending_index
    type: int
    restore_value: false
    initial_value: "-1"
  - id: g_rp_pending_started_ms
    type: uint32_t
    restore_value: false
    initial_value: "0"

interval:
  - interval: 200ms
    startup_delay: 3s
    then:
      - lambda: |-
          const uint32_t now = millis();

          // A read is already outstanding -- only check it for timeout; never issue
          // a second one (single Modbus transaction in flight at a time).
          if (id(g_rp_pending_index) >= 0) {
            if (now - id(g_rp_pending_started_ms) > 3000U) {
              const int idx = id(g_rp_pending_index);
              id(g_rp_timeout_count)[idx] = uint16_t(id(g_rp_timeout_count)[idx] + 1);
              id(g_rp_transport_state)[idx] = jk_poll_scheduler::IDLE;
              id(g_rp_pending_index) = -1;
              ESP_LOGW("jk_poll_scheduler", "Read timeout for block %u (address 0x%04X)", unsigned(idx), unsigned(jk_read_plan::kBlocks[idx].address));
            }
            return;
          }

          // Tier 1: any write transaction in flight (jk_write_tx's 6 generic slots,
          // or the CellCount topology driver's own bespoke transaction/recovery-probe
          // state) suppresses every background read this tick.
          bool write_in_flight = id(g_cellcount_tx_pending) || id(g_topology_recovery_pending);
          if (!write_in_flight) {
            for (uint8_t i = 0; i < 6; i++) {
              if (id(g_wtx_in_use)[i] && jk_write_tx::is_pending(id(g_wtx_status)[i])) { write_in_flight = true; break; }
            }
          }
          if (write_in_flight) return;

          // Tier 2: active-settings-group hint. Real consumption (Stage 1 hardware
          // acceptance corrective pass) -- resolve_active_group_block_index() scans
          // jk_read_plan::kBlocks for one whose generated ui_group matches the
          // browser's hint; see that function's own comment in
          // jk_poll_scheduler_core.h. Every real block's ui_group is -1 today (per-
          // field ui_group population is Stage 2's own deliverable, not yet done),
          // so this always resolves to NO_BLOCK against production data -- real,
          // wired, and unit-tested, but a documented no-op until Stage 2 supplies
          // ui_group data, not a missing feature.
          const bool group_hint_active = id(g_active_group_hint) >= 0 && now < id(g_active_group_hint_expires_ms);
          const int active_group_block_index = jk_poll_scheduler::resolve_active_group_block_index(
              jk_read_plan::kBlocks, id(g_active_group_hint), group_hint_active);

          std::array<jk_poll_scheduler::BlockState, jk_read_plan::kBlockCount> states;
          for (size_t i = 0; i < jk_read_plan::kBlockCount; i++) {
            states[i].last_attempt_ms = id(g_rp_last_attempt_ms)[i];
            states[i].last_success_ms = id(g_rp_last_success_ms)[i];
            states[i].error_count = id(g_rp_error_count)[i];
            states[i].timeout_count = id(g_rp_timeout_count)[i];
            states[i].transport_state = id(g_rp_transport_state)[i];
            states[i].revision = id(g_rp_revision)[i];
          }
          uint32_t cadence_ms[jk_read_plan::kBlockCount];
          for (size_t i = 0; i < jk_read_plan::kBlockCount; i++) cadence_ms[i] = jk_read_plan::kBlocks[i].cadence_ms;

          const int chosen = jk_poll_scheduler::pick_next_block(states, cadence_ms, false, active_group_block_index, now);
          if (chosen < 0) return;

          jk_poll_scheduler::mark_issued(states[chosen], now);
          id(g_rp_last_attempt_ms)[chosen] = states[chosen].last_attempt_ms;
          id(g_rp_transport_state)[chosen] = states[chosen].transport_state;
          id(g_rp_pending_index) = chosen;
          id(g_rp_pending_started_ms) = now;

          const auto &block = jk_read_plan::kBlocks[chosen];
          auto command = esphome::modbus_controller::ModbusCommandItem::create_read_command(
              id(bms0), esphome::modbus::EntityType::HOLDING, block.address, block.register_count,
              [chosen](auto, uint16_t, const auto &data) {
                const uint8_t payload_bytes = jk_read_plan::kBlocks[chosen].payload_bytes;
                const bool strict_length = jk_read_plan::kBlocks[chosen].strict_length;
                // Length validation (2026-09-19 hardening pass, user-directed;
                // per-block strict_length carve-out added 2026-09-20 after
                // hardware acceptance found the exact check wrongly applied to
                // the one CLUSTERED_GAP_AWARE block -- see jk_poll_scheduler_core.h's
                // own Block::strict_length comment). strict_length blocks (every
                // ORDINARY_ONE_REGISTER/ASCII_CONTIGUOUS block, individually
                // audited 2026-09-18/19): a fixed-register_count FC03 read has a
                // deterministic response size, so short OR long is a real anomaly.
                // Non-strict blocks (0x1290 only, as of this generation): floor
                // check only -- payload_bytes is this block's own decoder's read
                // length, not a hardware-proven exact response size.
                const bool length_ok = strict_length ? (data.size() == payload_bytes) : (data.size() >= payload_bytes);
                if (!length_ok) {
                  ESP_LOGW("jk_poll_scheduler", "Response length mismatch for block %u (address 0x%04X): %u/%u bytes",
                           unsigned(chosen), unsigned(jk_read_plan::kBlocks[chosen].address), unsigned(data.size()), unsigned(payload_bytes));
                  id(g_rp_error_count)[chosen] = uint16_t(id(g_rp_error_count)[chosen] + 1);
                  id(g_rp_transport_state)[chosen] = jk_poll_scheduler::IDLE;
                  if (id(g_rp_pending_index) == chosen) id(g_rp_pending_index) = -1;
                  return;
                }
                const uint8_t *raw = data.data();
                // Stage 4 raw-payload cache -- see g_rp_last_raw_word's own globals:
                // comment. Populated for every block (cheap, branch-free), consulted
                // only by the write path's RMW merge step, which additionally checks
                // g_rp_last_success_ms/g_rp_revision (updated a few lines below, same
                // tick) for freshness before ever trusting this value.
                id(g_rp_last_raw_word)[chosen] = jk_poll_scheduler::read_be(raw, payload_bytes > 4 ? 4 : payload_bytes);
