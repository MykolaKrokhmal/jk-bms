# Note:
# If you have only 8 cells - comment out "cell voltage 9-16" and "cell 9-16 wire resistance".
# Also adjust values in "cell voltage/wire resistance 8" and "cell voltage/wire resistance 16".
# See details in the comments for these parameters.
# Also you can comment out "cell 9-16 wire resistance" if you don't need this info.
#
#
# Setup: adjust parameters in substitutions section
#
#
# Some configuration details:
#
# JK Modbus protocol is not the same as standard Modbus RTU
# Key difference is response on reading more than one value in one request.
# Example:
# We want to read "Smart sleep" and "Cell UVP" values, their register addresses are 0x1000 and 0x1004.
# Each parameter has length of 4 bytes or 2 registers.
# To read these parameters in one request we send command `01 03 10 00 00 02 <CRC>`
#
# Standard Modbus response: `01 03 0C XX XX XX XX 00 00 00 00 YY YY YY YY <CRC>`
# where XXXXXXXX - "Smart sleep" value and YYYYYYYY - "Cell UVP". So, there's a gap between values.
#
# JK BMS response: `01 03 08 XX XX XX XX YY YY YY YY <CRC>. See - there is no gap between values.
#
# Why it's matters: We want as few requests as possible to reduce communication and processing time.
# Good news: modbus_controller component will do this automatically for us if it detect adjacent entities
# by their address and size and makes ranges that are read in one request.
# Not so good news: because of JK Modbus specifics we have to do some tweaks.
# 1. Explicitly define two settings for a sensor:
#     register_count: 4
#     response_size: 4
# By defining register_count with value double of the actual size (**in registers**) of the sensor we cover gaps in the parameters addresses.
# And by defining response_size to be the actual size (**in bytes**) of the sensor we cover absence of the gaps in the response.
#
# Described optimization applies only to the entities without custom commands and only for the entities of the same type!
# To tackle the second limitation we define binary_sensors as templates and update their values based on the regular sensors,
# while setting `disabled_by_default: true` in the regular sensor definition.

substitutions:
  name: jk-bms
  friendly_name: "JK BMS"
  # User-visible name from the JK mobile application. The JK-PB RS485 map
  # exposes the hardware model at 0x1400, but not the editable BLE name.
  bms_display_name: "LiFePO4-1S16P-00"
  device_description: "Monitor a JK-BMS (JK-PB series) via Modbus"
  # Immutable revision used by the evidence snapshot and Stage 1 catalog.
  external_components_source: github://syssi/esphome-jk-bms@08f25eb4941b03b6ee0b6c38660aeadfc4ef7cd1
  tx_pin: GPIO22
  rx_pin: GPIO21
  flow_control_pin: GPIO17
  device_addr: "1"    # NOTE: On change also update the first byte in `switch` custom_command and write_lambda
  modbus_controller_update_interval: "15s"
  bms_control_params_skip_updates: "20"   # 20 - update every 20th update cycle

esphome:
  name: ${name}
  friendly_name: ${friendly_name}
  comment: ${device_description}
  project:
    name: "syssi.esphome-jk-bms"
    version: 3.0.0
  # Pure, hardware-independent state machine for the generic RW-register
  # write -> ACK -> forced-readback transaction manager (every RW register
  # EXCEPT CellCount, which keeps its own bespoke topology-aware driver
  # below). Desktop-testable — see test/jk_write_tx/test_jk_write_tx_core.cpp.
  includes:
    - components/jk_write_tx/jk_write_tx_core.h
  on_boot:
    priority: -100
    then:
      - lambda: |-
          // Single combined endpoint (not one per metric) so the UI does one
          // fetch instead of nine. The buffer is a ring — hist_index is the
          // *next write* slot, so readout starts one past it (oldest sample
          // first) and wraps, giving the client points already in
          // chronological order without it needing to know about the ring.
          //
          // AsyncCallbackWebHandler (ESPAsyncWebServer's Arduino-only
          // shortcut) doesn't exist in ESPHome's ESP-IDF web_server_idf
          // shim — this device builds with esp32: framework: type: esp-idf.
          // Subclassing AsyncWebHandler directly, exactly the way ESPHome's
          // own AsyncEventSource (the /events SSE handler) does it, is the
          // pattern that's actually available here.
          class HistoryHandler : public AsyncWebHandler {
           public:
            bool canHandle(AsyncWebServerRequest *request) const override {
              if (request->method() != HTTP_GET) return false;
              char url_buf[AsyncWebServerRequest::URL_BUF_SIZE];
              return request->url_to(url_buf) == "/history.json";
            }
            void handleRequest(AsyncWebServerRequest *request) override {
              auto append_series = [](std::string &out, const char *key, float *buf) {
                out += "\"";
                out += key;
                out += "\":[";
                const int count = id(hist_count);
                const int start = count < 60 ? 0 : id(hist_index);
                char num[16];
                for (int i = 0; i < count; i++) {
                  const int idx = (start + i) % 60;
                  if (i > 0) out += ",";
                  if (isnan(buf[idx])) {
                    out += "null";
                  } else {
                    snprintf(num, sizeof(num), "%.3f", buf[idx]);
                    out += num;
                  }
                }
                out += "]";
              };
              std::string json;
              json.reserve(4096);
              json += "{\"interval_s\":30,";
              append_series(json, "voltage", id(hist_voltage));
              json += ",";
              append_series(json, "current", id(hist_current));
              json += ",";
              append_series(json, "power", id(hist_power));
              json += ",";
              append_series(json, "balance", id(hist_balance));
              json += ",";
              append_series(json, "mosfet_temp", id(hist_mosfet_temp));
              json += ",";
              append_series(json, "temp1", id(hist_temp1));
              json += ",";
              append_series(json, "temp2", id(hist_temp2));
              json += ",";
              append_series(json, "temp4", id(hist_temp4));
              json += ",";
              append_series(json, "temp5", id(hist_temp5));
              json += "}";
              request->send(200, "application/json", json.c_str());
            }
          };
          id(web_server_base_id)->add_handler(new HistoryHandler());

          // Real 60-hour Charge Cycle history, replacing the old synthetic
          // reference-profile curve. 6-hour windows (360 x 60s samples),
          // offset 0 = most recent, addressed by URL PATH SEGMENT
          // (/charge_history.json/<offset>) rather than a query string:
          // the AsyncWebServerRequest shim this device actually builds
          // against (web_server_idf.h, verified for HistoryHandler above)
          // only confirms url_to()/method()/send() — no getParam()-style
          // query API — so path-segment matching via plain string equality
          // (the one operation already proven to compile here) is what's
          // actually available, not a guessed convenience.
          class ChargeHistoryHandler : public AsyncWebHandler {
           public:
            // A local class (defined inside this on_boot lambda) may not
            // have static DATA members ([class.local]p1 — GCC only
            // accepts it under -fpermissive, which this build doesn't
            // enable, hence a real "shall not have static data member"
            // compile error). An enum sidesteps this entirely: an
            // enumerator isn't a data member, has no address/linkage
            // question, and implicitly converts to int everywhere these
            // were already used as plain values (array bounds, index
            // math, std::to_string(kWindow)) — a drop-in replacement.
            enum { kWindow = 360, kCapacity = 3600, kMaxOffset = 9 };

            bool matchOffset(AsyncWebServerRequest *request, int *offset_out) const {
              char url_buf[AsyncWebServerRequest::URL_BUF_SIZE];
              auto url = request->url_to(url_buf);
              if (url == "/charge_history.json") { *offset_out = 0; return true; }
              char candidate[40];
              for (int i = 0; i <= kMaxOffset; i++) {
                snprintf(candidate, sizeof(candidate), "/charge_history.json/%d", i);
                if (url == candidate) { *offset_out = i; return true; }
              }
              return false;
            }

            bool canHandle(AsyncWebServerRequest *request) const override {
              if (request->method() != HTTP_GET) return false;
              int offset = 0;
              return matchOffset(request, &offset);
            }

            void handleRequest(AsyncWebServerRequest *request) override {
              int offset = 0;
              matchOffset(request, &offset);

              const int count = id(cc_hist_count);
              const int ring_start = count < kCapacity ? 0 : id(cc_hist_index);
              const int windows_available = count > 0 ? (count + kWindow - 1) / kWindow : 0;
              // Chronological position of the newest sample in THIS window
              // (0 = oldest sample ever stored, count-1 = newest overall).
              int window_end_p = count - 1 - offset * kWindow;
              int window_start_p = window_end_p - (kWindow - 1);
              if (window_start_p < 0) window_start_p = 0;
              const bool any = count > 0 && window_end_p >= 0;

              std::string json;
              // Worst-case size, actually counted (not guessed) from this
              // handler's own concatenation below: fixed fields (~92B,
              // generous 4/2/1-digit headroom on count/windows/offset) +
              // 360 voltage/current samples at "-327.67" (int16 centivolt/
              // centiamp range, 7B) + 360 soc samples at worst-case "null"
              // (4B, longer than any real 0-100 value) + 360 stage digits
              // (1B) + separators = 8,414 bytes. 10240 (10 KiB) gives ~22%
              // headroom above that — enough that the normal (non-null,
              // non-negative) path never reallocates, without reserving
              // for a size that can't actually occur.
              json.reserve(10240);
              char num[16];
              json += "{\"interval_s\":60,\"window_samples\":";
              json += std::to_string(kWindow);
              json += ",\"total_samples\":";
              json += std::to_string(count);
              json += ",\"windows_available\":";
              json += std::to_string(windows_available);
              json += ",\"offset\":";
              json += std::to_string(offset);

              json += ",\"voltage\":[";
              if (any) {
                for (int p = window_start_p; p <= window_end_p; p++) {
                  const int idx = (ring_start + p) % kCapacity;
                  if (p > window_start_p) json += ",";
                  const int16_t cv = id(cc_hist_voltage_cv)[idx];
                  if (cv == INT16_MIN) { json += "null"; }
                  else { snprintf(num, sizeof(num), "%.2f", cv / 100.0f); json += num; }
                }
              }
              json += "],\"current\":[";
              if (any) {
                for (int p = window_start_p; p <= window_end_p; p++) {
                  const int idx = (ring_start + p) % kCapacity;
                  if (p > window_start_p) json += ",";
                  const int16_t ca = id(cc_hist_current_ca)[idx];
                  if (ca == INT16_MIN) { json += "null"; }
                  else { snprintf(num, sizeof(num), "%.2f", ca / 100.0f); json += num; }
                }
              }
              json += "],\"soc\":[";
              if (any) {
                for (int p = window_start_p; p <= window_end_p; p++) {
                  const int idx = (ring_start + p) % kCapacity;
                  if (p > window_start_p) json += ",";
                  const uint8_t sc = id(cc_hist_soc)[idx];
                  if (sc == 255) { json += "null"; }
                  else { json += std::to_string(sc); }
                }
              }
              json += "],\"stage\":[";
              if (any) {
                for (int p = window_start_p; p <= window_end_p; p++) {
                  const int idx = (ring_start + p) % kCapacity;
                  if (p > window_start_p) json += ",";
                  json += std::to_string(id(cc_hist_stage)[idx]);
                }
              }
              json += "]}";
              request->send(200, "application/json", json.c_str());
            }
          };
          id(web_server_base_id)->add_handler(new ChargeHistoryHandler());

esp32:
  board: esp32dev
  framework:
    type: esp-idf

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  min_auth_mode: WPA2
  ap:
    ssid: "JK-BMS Fallback"
    # Was a hardcoded, checked-in placeholder ("change-this-password") --
    # a real security gap per ESPHome's own security_best_practices guide
    # ("ALWAYS SET THIS" for the fallback AP). Now a per-device secret;
    # see secrets.yaml.example. Add the real value to your own
    # (gitignored) secrets.yaml before flashing.
    password: !secret jk_bms_ap_password
  # This can help if you experience wifi connection issues and see errors like
  # bssid=12:34:56:78:9A:CB[redacted] reason=‘Auth Expired’
  # output_power: "8.5dB"

ota:
  - platform: esphome
    # Was unset (any unauthenticated device on the network could push
    # firmware). Per ESPHome's own security_best_practices guide, never
    # reuse this across devices.
    password: !secret jk_bms_ota_password

captive_portal:

logger:
  # NOTE: In production this should be INFO or lower to reduce execution time and remove warnings like:
  # [W][component:239]: Component modbus_controller took a long time for an operation (107 ms).
  # [W][component:240]: Components should block for at most 30 ms.
  level: INFO  # DEBUG

# If you use Home Assistant please remove this `mqtt` section and uncomment the `api` component!
# The native API has many advantages over MQTT: https://esphome.io/components/api.html#advantages-over-mqtt
api:
  encryption:
    key: !secret jk_bms_api_key

# Declared explicitly (rather than left to web_server: to create implicitly)
# so on_boot below can reach the same AsyncWebServer instance via its id and
# register the /history.json handler on it.
web_server_base:
  id: web_server_base_id

web_server:
  web_server_base_id: web_server_base_id
  port: 80
  version: 2
  # ESPHome 2026.6.5's web_server CONF_AUTH schema had no `type:` key at
  # all -- Basic was the only, implicit option. 2026.8.2 (verified by a
  # real compile against that exact version) added `type: basic|digest`;
  # Digest never puts the password on the wire in an easily-reversible
  # form the way Basic does, so it's the better default now that it's
  # available -- explicitly set rather than left to default (ESPHome
  # itself warns the *default* stays 'basic' until 2027.1.0). Still NOT
  # encryption -- HTTP stays plaintext; this only authenticates, and the
  # threat model this device is designed for remains trusted LAN/VPN, not
  # direct internet exposure. WebServerBase::add_handler()
  # (web_server_base.cpp) wraps every handler registered through it --
  # including this project's own HistoryHandler/ChargeHistoryHandler
  # below, which both call id(web_server_base_id)->add_handler(...) -- in
  # AuthMiddlewareHandler whenever credentials are set, so both custom
  # endpoints are covered by this block automatically; a live 401 test
  # against them is still the way to confirm this on real hardware, not
  # just this source read.
  auth:
    type: digest
    username: !secret jk_bms_web_username
    password: !secret jk_bms_web_password
  # jk_bms.js/jk_bms.css now live at the project root, not in a jk_bms_ui/
  # subfolder — the paths below were pointing at a folder that doesn't
  # exist here.
  js_include: "./jk_bms.js"
  css_include: "./jk_bms.css"
  # ESPHome v2 loads js_include as a module. Load the same asset once as a
  # classic script too; jk_bms.js contains a guard against a second start.
  js_url: "/0.js"
  css_url: ""

# On-device history ring buffer for the UI's per-metric trend charts
# (Voltage, Current, Power, Balance current, the four temperature probes).
# 60 points x 30s apart = a real 30-minute window (the frontend derives its
# "Last N minutes" label from interval_s x sample count in the JSON below,
# not a hardcoded string, so this and the label can never drift apart
# again the way "20 minutes" quietly did after this buffer was first
# sized at 40 points). Sized for ESP32 RAM (9 series x 60 floats = 2.1KB)
# rather than flash — history does not survive a reboot, which matches
# "recent trend," not "logged history" (see the separate 60-hour charge-
# cycle buffer for that).
uart:
  - id: uart_0
    baud_rate: 115200
    rx_buffer_size: 384
    tx_pin: ${tx_pin}
    rx_pin: ${rx_pin}

modbus:
  - id: modbus0
    uart_id: uart_0
    flow_control_pin: ${flow_control_pin}
    # command_throttle used to live on modbus_controller: (below) but a
    # real 2026.8.2 compile warned it "no longer has any effect... use
    # 'turnaround_time' there instead" -- moved here, same 50ms value, to
    # keep actually spacing commands rather than silently doing nothing.
    turnaround_time: 50ms

modbus_controller:
  - id: bms0
    # Dip switch configuration of a single pack setup / address 0x01
    #  1    2    4    5
    #  on, off, off, off (0x01)
    #
    # Don't turn off all dip switches / don't use device address 0x00.
    # This is the Modbus Master mode. You must select a device address
    # between 0x01 and 0x0f so the BMS acts as Modbus Slave.
    address: ${device_addr}
    modbus_id: modbus0
    setup_priority: -10
    update_interval: ${modbus_controller_update_interval}

# Critical-path cache: each Modbus response is decoded once; template entities
# only publish already-computed scalar values.
globals:
  - id: g_max_cell_v
    type: float
    restore_value: false
    initial_value: "NAN"
  - id: g_min_cell_v
    type: float
    restore_value: false
    initial_value: "NAN"
  - id: g_max_cell_idx
    type: uint8_t
    restore_value: false
    initial_value: "0"
  - id: g_min_cell_idx
    type: uint8_t
    restore_value: false
    initial_value: "0"
  - id: g_total_voltage_v
    type: float
    restore_value: false
    initial_value: "NAN"
  - id: g_current_a
    type: float
    restore_value: false
    initial_value: "NAN"
  - id: g_power_w
    type: float
    restore_value: false
    initial_value: "NAN"
  - id: g_charging_power_w
    type: float
    restore_value: false
    initial_value: "NAN"
  - id: g_discharging_power_w
    type: float
    restore_value: false
    initial_value: "NAN"
  - id: g_cell_poll_pending
    type: bool
    restore_value: false
    initial_value: "false"
  - id: g_cell_poll_started_ms
    type: uint32_t
    restore_value: false
    initial_value: "0"

  # V2 — BMS communication health, distinct from browser<->ESP32 network
  # health. Updated only at the point below where a cell-poll response has
  # actually been decoded as valid (right length AND at least one plausible
  # cell voltage) — not merely "a response of the right size arrived".
  # bms_health (text_sensor, further down) turns the elapsed time since
  # this timestamp into LIVE/DEGRADED/STALE/OFFLINE.
  - id: g_last_bms_response_ms
    type: uint32_t
    restore_value: false
    initial_value: "0"

  # V2.1 — when the current charge_phase (none/bulk/absorption/float) last
  # CHANGED, in millis(). charge_status_time_elapsed (below) measures
  # something different — time since the `charging` output last turned
  # on — so the Overview "Timer" field was silently reusing the wrong
  # clock: it read as a per-phase timer but never reset at a Bulk-to-
  # Absorption transition, only at Charge-off/on. charge_phase_elapsed
  # (sensor, near charge_status) turns this into the real thing.
  # V2.2 semantic refactor: this now tracks charge_phase specifically
  # (Charge Cycle's own concept), NOT battery_state — see
  # g_battery_state_started_ms below for the main operating-state clock.
  # The two coincide at every bulk/absorption/float transition (both
  # concepts change together there) and diverge only when the pack
  # leaves the charging path entirely (discharging/idle/offline all
  # collapse to charge_phase="none", so this clock stops moving while
  # battery_state keeps its own).
  - id: g_charge_phase_started_ms
    type: uint32_t
    restore_value: false
    initial_value: "0"

  # V2.2 — when battery_state (idle/charging/discharging/absorption/
  # float/offline/unknown) last CHANGED. This is the PUBLIC/HA-facing
  # operating-state clock — separate from charge_phase's clock above,
  # since the two concepts now live at different abstraction levels
  # (see the charge_status resolver's own comment for the full model).
  - id: g_battery_state_started_ms
    type: uint32_t
    restore_value: false
    initial_value: "0"

  # V2.2 — the resolver's own charge_phase result (0=none, 1=bulk,
  # 2=absorption, 3=float), written once by charge_status's lambda and
  # read by the separate charge_phase text_sensor below — one canonical
  # computation, two thin presentation-layer entities reading its output,
  # never two independent classifiers.
  - id: g_charge_phase_code
    type: uint8_t
    restore_value: false
    initial_value: "0"

  # V2.2 — timestamp of the most recent GENUINELY FRESH current sample
  # (set in electrical_metrics_scan's own lambda, not here) — lets the
  # battery_state resolver require actual new telemetry before confirming
  # a transition, not just wall-clock time elapsing with no real new
  # sample (Modbus polls roughly every 15s; a 15-30s wall-clock dwell
  # alone could theoretically elapse from timer jitter without a fresh
  # decode ever landing).
  - id: g_last_current_sample_ms
    type: uint32_t
    restore_value: false
    initial_value: "0"

  # V2.2 hardening pass — resolver internals mirrored into globals purely
  # so the diagnostic text_sensors/sensors further down can read them
  # without re-deriving anything: the `charge_status` lambda remains the
  # ONE place that actually decides these values every tick.
  # Direction codes throughout: 0=neutral, 1=charge, 2=discharge.
  - id: g_current_direction_code
    type: uint8_t
    restore_value: false
    initial_value: "0"
  - id: g_candidate_direction_code
    type: uint8_t
    restore_value: false
    initial_value: "0"
  - id: g_candidate_fresh_samples_g
    type: uint8_t
    restore_value: false
    initial_value: "0"
  - id: g_candidate_since_ms_g
    type: uint32_t
    restore_value: false
    initial_value: "0"
  # unknown_reason: 0=n/a (not currently unknown), 1=no valid telemetry
  # yet since boot, 2=just reconnected, awaiting a fresh sample before
  # trusting the resolved state again.
  - id: g_unknown_reason_code
    type: uint8_t
    restore_value: false
    initial_value: "0"
  # battery_state/charge_phase codes for diagnostics decoding, and their
  # LAST KNOWN (pre-offline) values — Diagnostics-only, per §10: these
  # must never be exposed as the CURRENT live state (charge_status/
  # charge_phase already correctly report offline/none during an outage;
  # these two exist only so a technician can see "what was it doing
  # before it went dark" without that ever being mistaken for live data).
  # battery_state codes: 0=unknown,1=idle,2=charging,3=discharging,
  # 4=absorption,5=float,6=offline.
  - id: g_battery_state_code
    type: uint8_t
    restore_value: false
    initial_value: "0"
  - id: g_last_known_battery_state_code
    type: uint8_t
    restore_value: false
    initial_value: "0"
  - id: g_last_known_charge_phase_code
    type: uint8_t
    restore_value: false
    initial_value: "0"

  # ---- Topology Resolver state (resolve_topology script, in scripts:
  # below) — the single source of truth for whether CellCount can be
  # trusted as the pack's real physical topology. state_code:
  #   0=LOADING 1=CONFIRMED 2=MISMATCH 3=INVALID 4=WRITE_UNCERTAIN
  #   5=OFFLINE 6=PENDING
  # effective_cell_count/last_confirmed_cell_count mirror their published
  # sensors as globals too so C++ code (the cell-poll callback, the
  # transaction driver) never has to read them back through a
  # Sensor::state float round-trip just to decide e.g. the inactive-
  # channel blanking range or what to show while PENDING.
  - id: g_topology_state_code
    type: uint8_t
    restore_value: false
    initial_value: "0"
  - id: g_topology_reason_code
    type: uint8_t
    restore_value: false
    initial_value: "1"  # AWAITING_SNAPSHOT
  - id: g_effective_cell_count
    type: uint8_t
    restore_value: false
    initial_value: "16"
  # The last count the resolver actually reached CONFIRMED for. Distinct
  # from effective_cell_count (which is 16 — "trust nothing" — in every
  # non-CONFIRMED state): while PENDING this is what the UI keeps
  # rendering, so a write in flight never causes a visible, unconfirmed
  # jump to either the old OR the requested topology (spec: "UI не
  # повинен частково перейти на нову кількість комірок раніше, ніж
  # resolver сформував остаточний узгоджений snapshot").
  - id: g_last_confirmed_cell_count
    type: uint8_t
    restore_value: false
    initial_value: "0"  # 0 == "never confirmed since boot"
  # Monotonic — bumped on every resolve_topology publish AND on every
  # transaction-driven state override (PENDING/WRITE_UNCERTAIN), so a
  # client can tell "this is a strictly newer determination" apart from
  # "this looks the same as what I already rendered" without relying on
  # wall-clock time.
  - id: g_topology_revision
    type: uint32_t
    restore_value: false
    initial_value: "0"
  - id: g_topology_last_publish_ms
    type: uint32_t
    restore_value: false
    initial_value: "0"
  # Sticky uncertainty flag: set the instant a CellCount write's ACK or
  # forced readback is lost (the write *may* have applied on the BMS
  # side), cleared ONLY when a freshly, independently re-read CellCount +
  # mask snapshot lands — never by the ordinary 1Hz resolver tick reusing
  # whatever stale register memory it already had cached. This is what
  # stops "readback timeout" from silently reporting the OLD CONFIRMED
  # topology as still trustworthy (spec §3: "не повертай старий стан
  # CONFIRMED як достовірний, доки нове авторитетне читання не визначить
  # фактичний стан").
  - id: g_topology_uncertain
    type: bool
    restore_value: false
    initial_value: "false"
  # Recovery probe (250ms interval, below) — while g_topology_uncertain is
  # set and no transaction is currently in flight, periodically forces a
  # fresh CellCount + mask read specifically to clear the uncertainty; a
  # value that merely happens to match the old one via the ordinary slow
  # poll is NOT proof of freshness, only a live round-trip completing here is.
  - id: g_topology_recovery_pending
    type: bool
    restore_value: false
    initial_value: "false"
  - id: g_topology_recovery_cellcount_done
    type: bool
    restore_value: false
    initial_value: "false"
  - id: g_topology_recovery_mask_done
    type: bool
    restore_value: false
    initial_value: "false"
  - id: g_topology_recovery_last_ms
    type: uint32_t
    restore_value: false
    initial_value: "0"

  # ---- CellCount write transaction (set_cell_count's set_action + the
  # dedicated 250ms interval below) — write -> wait for ACK -> forced
  # readback of CellCount + connected mask -> wait for a cell-block decode
  # newer than the write -> resolve_topology. No step is ever assumed to
  # have happened just because a fixed delay elapsed.
  - id: g_cellcount_tx_pending
    type: bool
    restore_value: false
    initial_value: "false"
  # Correlation id for the currently (or most recently) active CellCount
  # transaction — bumped once per set_action invocation, published
  # alongside every topology/transaction sensor so the frontend can tell
  # "this SSE event belongs to the transaction I'm watching" from a late
  # event belonging to an OLDER transaction (spec §5: transaction_id
  # correlation against the HTTP/SSE race).
  - id: g_cellcount_tx_id
    type: uint32_t
    restore_value: false
    initial_value: "0"
  - id: g_cellcount_tx_target
    type: uint8_t
    restore_value: false
    initial_value: "0"
  - id: g_cellcount_tx_started_ms
    type: uint32_t
    restore_value: false
    initial_value: "0"
  - id: g_cellcount_write_acked
    type: bool
    restore_value: false
    initial_value: "false"
  - id: g_cellcount_readback_started_ms
    type: uint32_t
    restore_value: false
    initial_value: "0"
  - id: g_cellcount_readback_cellcount_done
    type: bool
    restore_value: false
    initial_value: "false"
  - id: g_cellcount_readback_mask_done
    type: bool
    restore_value: false
    initial_value: "false"

  # ---- Generic write transaction manager (jk_write_tx_core.h) — EVERY RW
  # register except CellCount routes through this: write_bms_u32/u16 (the
  # ~25 numeric configuration registers), the packed-subfield template
  # numbers (heating thresholds, dry-contact sources/values), the
  # charging/discharging/balancing control selects, and the setup
  # passcode. 6 concurrent slots is enough headroom for the
  # concurrent-different-register test scenario without allowing unbounded
  # queuing — a write that arrives when every slot is busy is REJECTED
  # outright (jk_write_tx::begin() returns -1), never silently dropped or
  # interleaved with another register's in-flight transaction.
  #
  # ESPHome's globals codegen instantiates every `globals:` entry BEFORE
  # any `esphome: includes:` file is #included in the generated main.cpp
  # (verified by an actual failed compile: a std::array<CustomStruct, 6>
  # global tried to instantiate the struct type ~120 lines before its
  # #include), so the transaction slots cannot be a single global of the
  # jk_write_tx::Slot struct type — only plain scalar/array-of-POD globals
  # (already proven elsewhere in this file: hist_voltage's float[60],
  # cc_hist_voltage_cv's int16_t[3600]) are visible that early. The 14
  # parallel arrays below carry exactly Slot's fields; the YAML lambdas
  # that call jk_write_tx::begin()/tick() (which DO run after the
  # #include, well down in generated main.cpp) marshal a local
  # jk_write_tx::Slot to/from these arrays around each call, so the
  # actual state-machine LOGIC still lives in exactly one, unit-tested
  # place (jk_write_tx_core.h) — only the storage is split.
  - id: g_wtx_in_use          # 0/1
    type: uint8_t[6]
  - id: g_wtx_tx_id
    type: uint32_t[6]
  - id: g_wtx_address
    type: uint16_t[6]
  - id: g_wtx_word_count
    type: uint8_t[6]
  - id: g_wtx_requested_raw
    type: uint32_t[6]
  - id: g_wtx_readback_raw
    type: uint32_t[6]
  - id: g_wtx_compare_mask
    type: uint32_t[6]
  - id: g_wtx_status
    type: uint8_t[6]
  - id: g_wtx_started_ms
    type: uint32_t[6]
  - id: g_wtx_acked           # 0/1
    type: uint8_t[6]
  - id: g_wtx_readback_started_ms
    type: uint32_t[6]
  - id: g_wtx_readback_done   # 0/1
    type: uint8_t[6]
  - id: g_wtx_finished_ms
    type: uint32_t[6]
  - id: g_wtx_suppress_value  # 0/1
    type: uint8_t[6]
  # Third critical audit (2026-09-10, item 6): bumped every time a slot
  # index is reused for a new transaction (mirrors jk_write_tx::Slot's own
  # generation field, marshalled the same parallel-array way as every
  # other Slot member). The ACK and forced-readback command callbacks
  # below capture {idx, tx_id, address, generation} at issue time and
  # verify ALL FOUR still match before writing anything back, so a late
  # callback belonging to a transaction this slot has since moved past
  # can never corrupt the slot's now-current transaction.
  - id: g_wtx_generation
    type: uint32_t[6]
  # Third critical audit (2026-09-10, item 7): a slot the servicer has
  # reclassified into jk_write_tx::WRITE_UNCERTAIN (after ACK_TIMEOUT/
  # READBACK_TIMEOUT) is NOT freed -- it stays in_use while an independent
  # recovery readback runs, mirroring the pattern CellCount's own bespoke
  # uncertainty-recovery probe already uses. g_wtx_recovery_pending marks
  # a slot that still needs its recovery probe (re)issued;
  # g_wtx_recovery_next_ms is the earliest millis() the servicer may issue
  # (or re-issue, if a prior probe never got a response) that read.
  - id: g_wtx_recovery_pending  # 0/1
    type: uint8_t[6]
  - id: g_wtx_recovery_next_ms
    type: uint32_t[6]
  - id: g_write_tx_next_id
    type: uint32_t
    restore_value: false
    initial_value: "0"
  # A write rejected by begin_write_tx (single-flight collision, or every
  # slot busy) never gets a real Slot -- jk_write_tx::begin() returns -1
  # before allocating one. Previously that meant NO terminal signal was
  # ever published for it: the ESPHome set_action still returned HTTP 200
  # (the action ran to completion; refusing to queue a command is not an
  # error from ESPHome's own point of view), and the frontend's only way
  # to learn the write never started was its own client-side timeout --
  # exactly the "REJECTED is masked as a timeout" defect this addendum
  # exists to close.
  #
  # Third critical audit (2026-09-10, item 4): a single set of "last
  # rejected" scalars can only ever remember ONE rejection at a time -- a
  # second, different-address rejection within the same publish window
  # would silently overwrite the first's record before any client ever
  # observed it. This is a real 4-slot ring buffer instead (independent of
  # the 6-slot g_wtx_* pool, which only ever tracks ACCEPTED transactions)
  # so up to 4 concurrent/near-simultaneous rejections each keep their own
  # tx_id/address/timestamp. publish_write_tx_snapshot() (below) surfaces
  # every entry still inside its own 3s grace period as a real, short-
  # lived REJECTED(9) snapshot row, keyed by its own transaction id, using
  # the SAME grace-period convention as a real terminal slot.
  - id: g_wtx_rejected_addr
    type: uint16_t[4]
  - id: g_wtx_rejected_tx_id
    type: uint32_t[4]
  - id: g_wtx_rejected_ms
    type: uint32_t[4]
  - id: g_wtx_rejected_next_slot
    type: uint8_t
    restore_value: false
    initial_value: "0"

  # ---- Setup passcode transaction (setup_passcode's set_action, below,
  # + a dedicated servicer in the generic write-tx interval) — kept
  # separate from jk_write_tx_core.h's slot pool because the passcode is
  # an 8-word (16-byte) packed ASCII payload, wider than any other RW
  # register here (which are all 1-2 words); the comparison logic is
  # otherwise identical (write -> ACK -> forced readback -> compare), and
  # publishes the SAME status-code vocabulary
  # (setup_passcode_tx_status_code, sensor below) so the frontend handles
  # it uniformly. Only ACK/readback SUCCESS is ever published — the
  # actual bytes never leave this device (setup_passcode's own read
  # lambda already always returns a masked "****************").
  - id: g_passcode_tx_pending
    type: bool
    restore_value: false
    initial_value: "false"
  - id: g_passcode_tx_id
    type: uint32_t
    restore_value: false
    initial_value: "0"
  - id: g_passcode_tx_started_ms
    type: uint32_t
    restore_value: false
    initial_value: "0"
  - id: g_passcode_write_acked
    type: bool
    restore_value: false
    initial_value: "false"
  - id: g_passcode_readback_started_ms
    type: uint32_t
    restore_value: false
    initial_value: "0"
  - id: g_passcode_readback_done
    type: bool
    restore_value: false
    initial_value: "false"
  - id: g_passcode_expected_words
    type: uint16_t[8]
  - id: g_passcode_readback_words
    type: uint16_t[8]

  # On-device history ring buffer for the UI's per-metric trend charts
  # (Voltage, Current, Power, Balance current, the four temperature probes).
  # 60 points x 30s apart = a real 30-minute window (see the fuller comment
  # by the /history.json handler in on_boot above — this file used to say
  # "20 minutes" here for a buffer that had already grown past that,
  # exactly the drift the frontend's now-computed label avoids repeating).
  - id: hist_index
    type: int
    restore_value: false
    initial_value: '0'
  - id: hist_count
    type: int
    restore_value: false
    initial_value: '0'
  - id: hist_voltage
    type: float[60]
  - id: hist_current
    type: float[60]
  - id: hist_power
    type: float[60]
  - id: hist_balance
    type: float[60]
  - id: hist_mosfet_temp
    type: float[60]
  - id: hist_temp1
    type: float[60]
  - id: hist_temp2
    type: float[60]
  - id: hist_temp4
    type: float[60]
  - id: hist_temp5
    type: float[60]

  # V2.1 — the real 60-hour Charge Cycle buffer, replacing the old
  # synthetic reference-profile curve entirely. 1 sample/min x 60h = 3600
  # samples. Voltage/current are fixed-point int16 (centivolts / centiamps)
  # rather than float — half the RAM per sample for range/precision this
  # buffer actually needs (+/-327.67 V or A, 0.01 resolution), not
  # "whatever a float happens to cost". SOC and stage are single bytes;
  # no PSRAM is assumed anywhere in this design.
  #
  # ACTUAL memory footprint, verified against the real declarations below
  # (four separate globals, NOT a struct — so there is no compiler-padding
  # question to ask; a plain array of a fixed-width POD type has zero
  # padding between elements by definition):
  #   cc_hist_voltage_cv  int16_t[3600]  = 2 x 3600 = 7200 bytes
  #   cc_hist_current_ca  int16_t[3600]  = 2 x 3600 = 7200 bytes
  #   cc_hist_soc         uint8_t[3600]  = 1 x 3600 = 3600 bytes
  #   cc_hist_stage       uint8_t[3600]  = 1 x 3600 = 3600 bytes
  #   cc_hist_index       int            = 4 bytes  (ESP32: 32-bit int)
  #   cc_hist_count       int            = 4 bytes
  #   TOTAL                              = 21,608 bytes (~21.1 KiB)
  # Comfortably inside the ~320 KiB DRAM an ESP32 has for globals/heap
  # alongside WiFi/TLS/ESPHome's own footprint — no PSRAM required.
  - id: cc_hist_index
    type: int
    restore_value: false
    initial_value: '0'
  - id: cc_hist_count
    type: int
    restore_value: false
    initial_value: '0'
  - id: cc_hist_voltage_cv    # centivolts (V x 100), INT16_MIN = no sample
    type: int16_t[3600]
  - id: cc_hist_current_ca    # centiamps (A x 100), INT16_MIN = no sample
    type: int16_t[3600]
  - id: cc_hist_soc           # percent 0-100, 255 = no sample
    type: uint8_t[3600]
  - id: cc_hist_stage         # 0 idle, 1 bulk, 2 absorption, 3 float, 4 discharging, 5 offline
    type: uint8_t[3600]       # (still 1 byte/sample — 5 is just another value of the same uint8_t)

# A dedicated one-shot read keeps the Cell overview at 1 Hz without reducing
# the 15 s interval of the remaining register map. JK-PB expects the requested
# register count in bytes, so 106 is the required doubled count for 53 Modbus
# words; the real response remains 106 bytes and is decoded exactly once.
interval:
  - interval: 1s
    startup_delay: 2s
    then:
      - lambda: |-
          const uint32_t now = millis();
          if (id(g_cell_poll_pending) &&
              uint32_t(now - id(g_cell_poll_started_ms)) < 15000U) {
            return;
          }
          id(g_cell_poll_pending) = true;
          id(g_cell_poll_started_ms) = now;
          auto command = esphome::modbus_controller::ModbusCommandItem::create_read_command(
              id(bms0), esphome::modbus::EntityType::HOLDING,
              0x1200, 106,
              [](auto, uint16_t, const auto &data) {
                id(g_cell_poll_pending) = false;
                if (data.size() < 106) {
                  ESP_LOGW("jk_cells", "Short cell response: %u/106 bytes",
                           static_cast<unsigned>(data.size()));
                  return;
                }

                esphome::sensor::Sensor *const voltage_sensors[16] = {
                  id(cell_voltage_1),  id(cell_voltage_2),  id(cell_voltage_3),  id(cell_voltage_4),
                  id(cell_voltage_5),  id(cell_voltage_6),  id(cell_voltage_7),  id(cell_voltage_8),
                  id(cell_voltage_9),  id(cell_voltage_10), id(cell_voltage_11), id(cell_voltage_12),
                  id(cell_voltage_13), id(cell_voltage_14), id(cell_voltage_15), id(cell_voltage_16)
                };
                esphome::sensor::Sensor *const resistance_sensors[16] = {
                  id(cell_resistance_1),  id(cell_resistance_2),  id(cell_resistance_3),  id(cell_resistance_4),
                  id(cell_resistance_5),  id(cell_resistance_6),  id(cell_resistance_7),  id(cell_resistance_8),
                  id(cell_resistance_9),  id(cell_resistance_10), id(cell_resistance_11), id(cell_resistance_12),
                  id(cell_resistance_13), id(cell_resistance_14), id(cell_resistance_15), id(cell_resistance_16)
                };

                uint16_t min_mv = UINT16_MAX;
                uint16_t max_mv = 0;
                uint8_t min_index = 0;
                uint8_t max_index = 0;
                for (uint8_t i = 0; i < 16; ++i) {
                  const size_t voltage_offset = size_t(i) * 2U;
                  const size_t resistance_offset = 74U + size_t(i) * 2U;
                  const uint16_t millivolts =
                      (uint16_t(data[voltage_offset]) << 8) | data[voltage_offset + 1U];
                  const uint16_t milliohms =
                      (uint16_t(data[resistance_offset]) << 8) | data[resistance_offset + 1U];

                  voltage_sensors[i]->publish_state(millivolts * 0.001f);
                  resistance_sensors[i]->publish_state(milliohms * 0.001f);
                  if (millivolts >= 500U && millivolts < min_mv) {
                    min_mv = millivolts;
                    min_index = i + 1U;
                  }
                  if (millivolts >= 500U && millivolts > max_mv) {
                    max_mv = millivolts;
                    max_index = i + 1U;
                  }
                }

                if (min_index == 0U || max_index == 0U) return;
                // This line only runs once the response has been fully
                // decoded and at least one cell reported a plausible
                // voltage — the actual confirmation that the BMS itself
                // (not just the UART link) is responding correctly.
                // Fresh millis() here, not the outer lambda's `now`: this
                // callback is captureless ([]) by the ModbusCommandItem
                // API's own requirement, and semantically this timestamp
                // should be the moment the response was actually decoded,
                // not the moment the request was queued (a real compile
                // error caught this: `now` is a local of the ENCLOSING
                // interval lambda and was never capturable here).
                id(g_last_bms_response_ms) = millis();
                id(g_min_cell_v) = min_mv * 0.001f;
                id(g_max_cell_v) = max_mv * 0.001f;
                id(g_min_cell_idx) = min_index;
                id(g_max_cell_idx) = max_index;
                id(min_cell_voltage).publish_state(id(g_min_cell_v));
                id(max_cell_voltage).publish_state(id(g_max_cell_v));
                id(min_voltage_cell).publish_state(float(min_index));
                id(max_voltage_cell).publish_state(float(max_index));
                // Every fresh, successfully-decoded cell-block response
                // re-evaluates topology — cheap (a handful of comparisons
                // over 16 floats), and this is what lets the resolver
                // self-heal after a reboot or a transient mismatch without
                // needing its own dedicated re-check logic (spec test 9).
                id(resolve_topology)->execute();
              });
          id(bms0)->queue_command(std::move(command));

  # ---- CellCount write transaction driver (jk_topology) — advances the
  # state armed by set_cell_count's set_action, above, through:
  #   1. wait for the write to be ACKed (g_cellcount_write_acked, set by
  #      the write command's own on_data_func) — 3s timeout;
  #   2. force one-shot re-reads of CellCount (0x106C) and the connected
  #      mask (0x1240) the instant the ACK lands, instead of waiting for
  #      their normal ~5-minute / 15s poll cadences;
  #   3. wait for BOTH of those AND a fresh cell-block decode (a
  #      g_last_bms_response_ms newer than the write) — 4s timeout;
  #   4. resolve_topology, using the now-corroborated snapshot, then a
  #      strict terminal check: success requires readback_raw_value ==
  #      requested_raw_value AND topology_state == CONFIRMED AND
  #      effective_cell_count == requested_raw_value, ALL THREE — matching
  #      exactly a plausible-but-different value the BMS silently clamped
  #      to is never reported as success just because that OTHER value
  #      happens to resolve cleanly.
  # No step is ever assumed to have happened just because a fixed delay
  # elapsed. An ACK or readback timeout does NOT restore the old CONFIRMED
  # state as if nothing happened — the BMS may well have applied the write
  # and only the confirmation was lost — so it sets g_topology_uncertain
  # and the resolver reports WRITE_UNCERTAIN until the separate recovery
  # probe below (run only when no transaction is in flight) gets a
  # genuinely fresh, independently re-verified snapshot.
  - interval: 250ms
    then:
      - lambda: |-
          const uint32_t now = millis();

          if (id(g_cellcount_tx_pending)) {
            if (!id(g_cellcount_write_acked)) {
              id(cellcount_tx_status_code)->publish_state(2.0f);  // ack_wait
              if (now - id(g_cellcount_tx_started_ms) > 3000U) {
                ESP_LOGW("jk_topology", "CellCount write not acknowledged within 3s (tx_id=%u target=%d) -- WRITE_UNCERTAIN",
                         unsigned(id(g_cellcount_tx_id)), int(id(g_cellcount_tx_target)));
                id(g_cellcount_tx_pending) = false;
                id(g_topology_uncertain) = true;
                id(cellcount_tx_status_code)->publish_state(7.0f);  // ack_timeout
                id(resolve_topology)->execute();
              }
              return;
            }

            if (id(g_cellcount_readback_started_ms) == 0U) {
              id(g_cellcount_readback_started_ms) = now;
              id(cellcount_tx_status_code)->publish_state(3.0f);  // readback_wait

              auto cc_cmd = esphome::modbus_controller::ModbusCommandItem::create_read_command(
                  id(bms0), esphome::modbus::EntityType::HOLDING, 0x106C, 8,
                  [](esphome::modbus::EntityType, uint16_t, std::span<const uint8_t> data) {
                    if (data.size() >= 4) {
                      const uint32_t v = (uint32_t(data[0]) << 24) | (uint32_t(data[1]) << 16) |
                                          (uint32_t(data[2]) << 8) | uint32_t(data[3]);
                      id(cell_count)->publish_state(float(v));
                    }
                    id(g_cellcount_readback_cellcount_done) = true;
                  });
              id(bms0)->queue_command(std::move(cc_cmd));

              auto mask_cmd = esphome::modbus_controller::ModbusCommandItem::create_read_command(
                  id(bms0), esphome::modbus::EntityType::HOLDING, 0x1240, 4,
                  [](esphome::modbus::EntityType, uint16_t, std::span<const uint8_t> data) {
                    if (data.size() >= 4) {
                      const uint32_t v = (uint32_t(data[0]) << 24) | (uint32_t(data[1]) << 16) |
                                          (uint32_t(data[2]) << 8) | uint32_t(data[3]);
                      id(cell_connected_mask)->publish_state(float(v));
                    }
                    id(g_cellcount_readback_mask_done) = true;
                  });
              id(bms0)->queue_command(std::move(mask_cmd));
              return;
            }

            const bool have_fresh_cells = id(g_last_bms_response_ms) > id(g_cellcount_tx_started_ms);
            if (id(g_cellcount_readback_cellcount_done) && id(g_cellcount_readback_mask_done) && have_fresh_cells) {
              id(g_cellcount_tx_pending) = false;
              id(resolve_topology)->execute();
              const uint8_t target = id(g_cellcount_tx_target);
              const float readback_raw = id(cell_count).state;
              const bool readback_matches = !isnan(readback_raw) && uint8_t(lroundf(readback_raw)) == target;
              const bool topo_confirmed = id(g_topology_state_code) == 1;
              const bool effective_matches = id(g_effective_cell_count) == target;
              if (readback_matches && topo_confirmed && effective_matches) {
                id(cellcount_tx_status_code)->publish_state(4.0f);  // confirmed
                ESP_LOGI("jk_topology", "CellCount transaction CONFIRMED (tx_id=%u target=%d)",
                         unsigned(id(g_cellcount_tx_id)), int(target));
              } else {
                id(cellcount_tx_status_code)->publish_state(5.0f);  // mismatch
                ESP_LOGW("jk_topology",
                         "CellCount transaction MISMATCH (tx_id=%u target=%d readback=%.0f topology_state=%d effective=%d)",
                         unsigned(id(g_cellcount_tx_id)), int(target), readback_raw, int(id(g_topology_state_code)),
                         int(id(g_effective_cell_count)));
              }
              return;
            }
            if (now - id(g_cellcount_readback_started_ms) > 4000U) {
              ESP_LOGW("jk_topology", "CellCount readback incomplete after 4s (tx_id=%u cellcount=%d mask=%d fresh_cells=%d) -- WRITE_UNCERTAIN",
                       unsigned(id(g_cellcount_tx_id)), int(id(g_cellcount_readback_cellcount_done)),
                       int(id(g_cellcount_readback_mask_done)), int(have_fresh_cells));
              id(g_cellcount_tx_pending) = false;
              id(g_topology_uncertain) = true;
              id(cellcount_tx_status_code)->publish_state(8.0f);  // readback_timeout
              id(resolve_topology)->execute();
            }
            return;
          }

          // ---- Uncertainty recovery probe — only runs when no
          // transaction is in flight. A value that merely happens to
          // match the old one via the ordinary slow poll is not proof of
          // freshness; only a live round-trip completing here clears
          // g_topology_uncertain. Retries every 5s, indefinitely, until
          // it succeeds (a lost ACK/readback is a communication problem,
          // not something a client-side timeout can wait out once). ----
          if (!id(g_topology_uncertain)) return;

          if (id(g_topology_recovery_pending)) {
            if (id(g_topology_recovery_cellcount_done) && id(g_topology_recovery_mask_done)) {
              id(g_topology_recovery_pending) = false;
              id(g_topology_uncertain) = false;
              ESP_LOGI("jk_topology", "Uncertainty recovery probe succeeded -- re-resolving topology");
              id(resolve_topology)->execute();
            } else if (now - id(g_topology_recovery_last_ms) > 4000U) {
              // This probe attempt stalled; fall through to the throttle
              // below and simply try again.
              id(g_topology_recovery_pending) = false;
            }
            return;
          }

          if (now - id(g_topology_recovery_last_ms) < 5000U) return;
          id(g_topology_recovery_last_ms) = now;
          id(g_topology_recovery_pending) = true;
          id(g_topology_recovery_cellcount_done) = false;
          id(g_topology_recovery_mask_done) = false;

          auto rec_cc_cmd = esphome::modbus_controller::ModbusCommandItem::create_read_command(
              id(bms0), esphome::modbus::EntityType::HOLDING, 0x106C, 8,
              [](esphome::modbus::EntityType, uint16_t, std::span<const uint8_t> data) {
                if (data.size() >= 4) {
                  const uint32_t v = (uint32_t(data[0]) << 24) | (uint32_t(data[1]) << 16) |
                                      (uint32_t(data[2]) << 8) | uint32_t(data[3]);
                  id(cell_count)->publish_state(float(v));
                }
                id(g_topology_recovery_cellcount_done) = true;
              });
          id(bms0)->queue_command(std::move(rec_cc_cmd));

          auto rec_mask_cmd = esphome::modbus_controller::ModbusCommandItem::create_read_command(
              id(bms0), esphome::modbus::EntityType::HOLDING, 0x1240, 4,
              [](esphome::modbus::EntityType, uint16_t, std::span<const uint8_t> data) {
                if (data.size() >= 4) {
                  const uint32_t v = (uint32_t(data[0]) << 24) | (uint32_t(data[1]) << 16) |
                                      (uint32_t(data[2]) << 8) | uint32_t(data[3]);
                  id(cell_connected_mask)->publish_state(float(v));
                }
                id(g_topology_recovery_mask_done) = true;
              });
          id(bms0)->queue_command(std::move(rec_mask_cmd));

  # ---- Generic write transaction servicer (jk_write_tx) — drives EVERY
  # in-use slot in g_write_tx_slots through ACK_WAIT -> READBACK_WAIT ->
  # CONFIRMED/MISMATCH/ACK_TIMEOUT/READBACK_TIMEOUT via
  # jk_write_tx::tick() (pure logic, unit-tested in
  # test/jk_write_tx/test_jk_write_tx_core.cpp). The ONLY hardware-facing
  # work here is: issuing the forced one-shot readback the instant tick()
  # first asks for one, and freeing a terminal slot ~3s later so a later
  # write to a different register can reuse the capacity. Register count
  # for the readback is passed as a BYTE count (word_count*2), matching
  # this BMS's own count convention documented above the 1s cell-block
  # poll ("JK-PB expects the requested register count in bytes").
  - interval: 250ms
    then:
      - lambda: |-
          const uint32_t now = millis();
          bool changed = false;
          for (size_t i = 0; i < 6; i++) {
            if (!id(g_wtx_in_use)[i]) continue;

            // Load -> tick() (the one, unit-tested state machine) -> store.
            jk_write_tx::Slot s;
            s.in_use = true;
            s.tx_id = id(g_wtx_tx_id)[i];
            s.address = id(g_wtx_address)[i];
            s.word_count = id(g_wtx_word_count)[i];
            s.requested_raw = id(g_wtx_requested_raw)[i];
            s.readback_raw = id(g_wtx_readback_raw)[i];
            s.compare_mask = id(g_wtx_compare_mask)[i];
            s.status = id(g_wtx_status)[i];
            s.started_ms = id(g_wtx_started_ms)[i];
            s.acked = id(g_wtx_acked)[i] != 0;
            s.readback_started_ms = id(g_wtx_readback_started_ms)[i];
            s.readback_done = id(g_wtx_readback_done)[i] != 0;
            s.finished_ms = id(g_wtx_finished_ms)[i];
            s.generation = id(g_wtx_generation)[i];

            const uint8_t prev_status = s.status;
            const auto result = jk_write_tx::tick(s, now);
            bool terminal = result.terminal;

            // Third critical audit (2026-09-10, item 7): an ACK/readback
            // timeout is never reported as a plain completed error for
            // the generic manager -- the write may have silently taken
            // effect. Reclassify into jk_write_tx::WRITE_UNCERTAIN right
            // here (NOT terminal yet), which also blocks a new write to
            // this same address via jk_write_tx::is_pending(), and arm an
            // immediate recovery-readback probe below -- mirroring the
            // pattern CellCount's own bespoke uncertainty-recovery probe
            // already uses (resolve_topology / g_topology_recovery_*).
            if (terminal && (s.status == jk_write_tx::ACK_TIMEOUT || s.status == jk_write_tx::READBACK_TIMEOUT)) {
              ESP_LOGW("jk_write_tx", "tx_id=%u addr=0x%04X ack/readback timeout (status=%u) -- entering WRITE_UNCERTAIN, launching recovery probe",
                       unsigned(s.tx_id), unsigned(s.address), unsigned(s.status));
              s.status = jk_write_tx::WRITE_UNCERTAIN;
              id(g_wtx_recovery_pending)[i] = 1;
              id(g_wtx_recovery_next_ms)[i] = now;
              terminal = false;
            }

            id(g_wtx_status)[i] = s.status;
            id(g_wtx_readback_started_ms)[i] = s.readback_started_ms;
            if (s.status != prev_status) changed = true;

            // Uncertainty recovery probe -- only runs while WRITE_UNCERTAIN
            // and no probe is already in flight for this slot; re-issued
            // every 2s if a prior probe never got a response (mirrors the
            // real ack/readback timeouts this same manager already uses).
            // The callback captures the SAME immutable {idx, tx_id,
            // address, generation} quadruple as the ACK/readback
            // callbacks above and additionally re-checks the slot is
            // still WRITE_UNCERTAIN -- a stale or superseded probe result
            // must never mutate a transaction it no longer belongs to.
            if (s.status == jk_write_tx::WRITE_UNCERTAIN && id(g_wtx_recovery_pending)[i] &&
                now >= id(g_wtx_recovery_next_ms)[i]) {
              id(g_wtx_recovery_next_ms)[i] = now + 2000U;
              const uint16_t addr = s.address;
              const uint16_t byte_count = uint16_t(s.word_count) * 2U;
              const uint32_t recovery_tx_id = s.tx_id;
              const uint16_t recovery_addr = s.address;
              const uint32_t recovery_generation = s.generation;
              auto recovery_cmd = esphome::modbus_controller::ModbusCommandItem::create_read_command(
                  id(bms0), esphome::modbus::EntityType::HOLDING, addr, byte_count,
                  [i, recovery_tx_id, recovery_addr, recovery_generation](esphome::modbus::EntityType, uint16_t,
                      std::span<const uint8_t> data) {
                    if (id(g_wtx_generation)[i] != recovery_generation || id(g_wtx_tx_id)[i] != recovery_tx_id ||
                        id(g_wtx_address)[i] != recovery_addr || id(g_wtx_status)[i] != jk_write_tx::WRITE_UNCERTAIN) {
                      ESP_LOGW("jk_write_tx", "Stale recovery-probe response for tx_id=%u addr=0x%04X ignored (slot %d no longer WRITE_UNCERTAIN on this generation)",
                               unsigned(recovery_tx_id), unsigned(recovery_addr), int(i));
                      return;
                    }
                    const size_t need = size_t(id(g_wtx_word_count)[i]) * 2;
                    if (data.size() < need) {
                      ESP_LOGW("jk_write_tx", "Short recovery-probe readback for tx_id=%u addr=0x%04X (%u/%u bytes)",
                               unsigned(recovery_tx_id), unsigned(recovery_addr), unsigned(data.size()), unsigned(need));
                      return;
                    }
                    uint32_t v = 0;
                    for (size_t b = 0; b < need; b++) v = (v << 8) | uint32_t(data[b]);
                    id(g_wtx_readback_raw)[i] = v;
                    const bool matches = jk_write_tx::compare_masked(id(g_wtx_requested_raw)[i], v, id(g_wtx_compare_mask)[i]);
                    id(g_wtx_status)[i] = matches ? jk_write_tx::RECOVERED_CONFIRMED : jk_write_tx::RECOVERED_MISMATCH;
                    id(g_wtx_recovery_pending)[i] = 0;
                    id(g_wtx_finished_ms)[i] = millis();
                    ESP_LOGI("jk_write_tx", "Recovery probe resolved tx_id=%u addr=0x%04X -> status=%u (requested=%u recovered=%u)",
                             unsigned(recovery_tx_id), unsigned(recovery_addr), unsigned(id(g_wtx_status)[i]),
                             unsigned(id(g_wtx_requested_raw)[i]), unsigned(v));
                    id(publish_write_tx_snapshot)->execute();
                  });
              id(bms0)->queue_command(std::move(recovery_cmd));
            }

            if (result.issue_readback) {
              const uint16_t addr = s.address;
              const uint16_t byte_count = uint16_t(s.word_count) * 2U;
              // Third critical audit (2026-09-10, item 6): same immutable-
              // quadruple capture-and-verify as the ACK callback above — a
              // late readback response for a transaction this slot has
              // since moved past must never write into the NEW
              // transaction's readback_raw/readback_done, nor republish a
              // stale value into the display entity below.
              const uint32_t readback_tx_id = s.tx_id;
              const uint16_t readback_addr = s.address;
              const uint32_t readback_generation = s.generation;
              auto read_cmd = esphome::modbus_controller::ModbusCommandItem::create_read_command(
                  id(bms0), esphome::modbus::EntityType::HOLDING, addr, byte_count,
                  [i, readback_tx_id, readback_addr, readback_generation](esphome::modbus::EntityType, uint16_t,
                      std::span<const uint8_t> data) {
                    if (id(g_wtx_generation)[i] != readback_generation || id(g_wtx_tx_id)[i] != readback_tx_id ||
                        id(g_wtx_address)[i] != readback_addr) {
                      ESP_LOGW("jk_write_tx", "Stale readback for tx_id=%u addr=0x%04X ignored (slot %d now on a newer transaction)",
                               unsigned(readback_tx_id), unsigned(readback_addr), int(i));
                      return;
                    }
                    const size_t need = size_t(id(g_wtx_word_count)[i]) * 2;
                    if (data.size() < need) {
                      ESP_LOGW("jk_write_tx", "Short readback for tx_id=%u addr=0x%04X (%u/%u bytes)",
                               unsigned(id(g_wtx_tx_id)[i]), unsigned(id(g_wtx_address)[i]),
                               unsigned(data.size()), unsigned(need));
                      return;
                    }
                    uint32_t v = 0;
                    for (size_t b = 0; b < need; b++) v = (v << 8) | uint32_t(data[b]);
                    id(g_wtx_readback_raw)[i] = v;
                    id(g_wtx_readback_done)[i] = 1;
                    // BUG FIX: a CONFIRMED transaction only ever proved the
                    // register itself changed -- it never told the entity
                    // the REST of the UI actually displays that value from
                    // (a separate sensor with its own slow, independent
                    // poll cycle, e.g. cell_ovp or charging_control_raw).
                    // That display entity kept its stale pre-write value
                    // until its own next poll happened to land, and a
                    // template select/number re-evaluates and republishes
                    // on ITS OWN timer too -- so a confirmed write could
                    // visibly "revert" seconds later when that timer fired
                    // before the underlying sensor's own poll caught up
                    // (reported live: turning Заряд дозволено off, seeing
                    // it confirm, then watching it flip back on). Publish
                    // the just-verified readback directly into the display
                    // entity here, for every simple (non-packed) generic
                    // register, so there is no window where the display can
                    // show anything other than what was just confirmed.
                    // Packed sub-field registers (rcv/rfv time, lcd buzzer
                    // trigger + dry contact 1 source sharing 0x14E4, heating
                    // activation/deactivation sharing 0x111C, dry contact 2
                    // source at 0x14E6) are NOT covered here yet -- each
                    // needs its own byte/shift extraction matching its own
                    // display sensor's read lambda; left as a follow-up.
                    const uint16_t a = id(g_wtx_address)[i];
                    if (a == 0x1070) { id(charging_control_raw)->publish_state(float(v)); }
                    else if (a == 0x1074) { id(discharging_control_raw)->publish_state(float(v)); }
                    else if (a == 0x1078) { id(balancing_control_raw)->publish_state(float(v)); }
                    else if (a == 0x107C) { id(battery_capacity)->publish_state(float(v) / 1000.0f); }
                    else if (a == 0x1014) { id(start_balance_trigger)->publish_state(float(v) / 1000.0f); }
                    else if (a == 0x1084) { id(start_balance)->publish_state(float(v) / 1000.0f); }
                    else if (a == 0x1048) { id(max_balance_current)->publish_state(float(v) / 1000.0f); }
                    else if (a == 0x100C) { id(cell_ovp)->publish_state(float(v) / 1000.0f); }
                    else if (a == 0x1020) { id(cell_request_charge_voltage)->publish_state(float(v) / 1000.0f); }
                    else if (a == 0x1018) { id(soc_100)->publish_state(float(v) / 1000.0f); }
                    else if (a == 0x1010) { id(cell_ovpr)->publish_state(float(v) / 1000.0f); }
                    else if (a == 0x1008) { id(cell_uvpr)->publish_state(float(v) / 1000.0f); }
                    else if (a == 0x101C) { id(soc_0)->publish_state(float(v) / 1000.0f); }
                    else if (a == 0x1004) { id(cell_uvp)->publish_state(float(v) / 1000.0f); }
                    else if (a == 0x1028) { id(system_power_off)->publish_state(float(v) / 1000.0f); }
                    else if (a == 0x1024) { id(cell_request_float_voltage)->publish_state(float(v) / 1000.0f); }
                    else if (a == 0x1000) { id(smart_sleep)->publish_state(float(v) / 1000.0f); }
                    else if (a == 0x102C) { id(continued_charge_current)->publish_state(float(v) / 1000.0f); }
                    else if (a == 0x1030) { id(charge_ocp_delay)->publish_state(float(v)); }
                    else if (a == 0x1034) { id(charge_ocpr_time)->publish_state(float(v)); }
                    else if (a == 0x1038) { id(continued_discharge_current)->publish_state(float(v) / 1000.0f); }
                    else if (a == 0x103C) { id(discharge_ocp_delay)->publish_state(float(v)); }
                    else if (a == 0x1040) { id(discharge_ocpr_time)->publish_state(float(v)); }
                    else if (a == 0x1044) { id(scpr_time)->publish_state(float(v)); }
                    else if (a == 0x1080) { id(scp_delay)->publish_state(float(v)); }
                    else if (a == 0x1054) { id(discharge_otp)->publish_state(float(int32_t(v)) / 10.0f); }
                    else if (a == 0x1058) { id(discharge_otpr)->publish_state(float(int32_t(v)) / 10.0f); }
                    else if (a == 0x104C) { id(charge_otp)->publish_state(float(int32_t(v)) / 10.0f); }
                    else if (a == 0x1050) { id(charge_otpr)->publish_state(float(int32_t(v)) / 10.0f); }
                    else if (a == 0x1060) { id(charge_utpr)->publish_state(float(int32_t(v)) / 10.0f); }
                    else if (a == 0x105C) { id(charge_utp)->publish_state(float(int32_t(v)) / 10.0f); }
                    else if (a == 0x1064) { id(mos_otp)->publish_state(float(int32_t(v)) / 10.0f); }
                    else if (a == 0x1068) { id(mos_otpr)->publish_state(float(int32_t(v)) / 10.0f); }
                    else if (a == 0x14F0) { id(dry_contact_1_trigger_value)->publish_state(float(int32_t(v))); }
                    else if (a == 0x14F4) { id(dry_contact_1_recovery_value)->publish_state(float(int32_t(v))); }
                    else if (a == 0x14F8) { id(dry_contact_2_trigger_value)->publish_state(float(int32_t(v))); }
                    else if (a == 0x14FC) { id(dry_contact_2_recovery_value)->publish_state(float(int32_t(v))); }
                    else if (a == 0x111C) {
                      id(heating_activation_temperature)->publish_state(float(int8_t(uint8_t((v >> 8) & 0xFF))));
                      id(heating_deactivation_temperature)->publish_state(float(int8_t(uint8_t(v & 0xFF))));
                    }
                    else if (a == 0x14E4) {
                      id(lcd_buzzer_trigger_source)->publish_state(float((v >> 8) & 0xFF));
                      id(dry_contact_1_trigger_source)->publish_state(float(v & 0xFF));
                    }
                    else if (a == 0x14E6) { id(dry_contact_2_trigger_source)->publish_state(float((v >> 8) & 0xFF)); }
                  });
              id(bms0)->queue_command(std::move(read_cmd));
            }

            if (terminal) {
              id(g_wtx_finished_ms)[i] = now;
              ESP_LOGI("jk_write_tx", "Transaction tx_id=%u addr=0x%04X terminal status=%u (requested=%u readback=%u)",
                       unsigned(s.tx_id), unsigned(s.address), unsigned(s.status),
                       unsigned(s.requested_raw), unsigned(id(g_wtx_readback_raw)[i]));
            }

            const bool still_pending = s.status == jk_write_tx::SENDING || s.status == jk_write_tx::ACK_WAIT ||
                                        s.status == jk_write_tx::READBACK_WAIT;
            const uint32_t finished_ms = id(g_wtx_finished_ms)[i];
            if (!still_pending && finished_ms != 0 && now - finished_ms > 3000U) {
              id(g_wtx_in_use)[i] = 0;
              changed = true;
            }
          }
          if (changed) id(publish_write_tx_snapshot)->execute();

      # Setup passcode transaction (see g_passcode_tx_pending's comment,
      # globals) -- same write -> ACK -> forced-readback shape as the
      # generic manager above, kept separate only because it's an 8-word
      # payload; shares this interval's 250ms cadence.
      - lambda: |-
          if (!id(g_passcode_tx_pending)) return;
          const uint32_t now = millis();

          if (!id(g_passcode_write_acked)) {
            if (now - id(g_passcode_tx_started_ms) > 3000U) {
              ESP_LOGW("jk_passcode", "Passcode write not acknowledged within 3s -- WRITE_UNCERTAIN");
              id(g_passcode_tx_pending) = false;
              id(setup_passcode_tx_status_code)->publish_state(7.0f);  // ack_timeout
            }
            return;
          }

          if (id(g_passcode_readback_started_ms) == 0U) {
            id(g_passcode_readback_started_ms) = now;
            id(setup_passcode_tx_status_code)->publish_state(3.0f);  // readback_wait
            const uint32_t tx_id = id(g_passcode_tx_id);
            auto read_cmd = esphome::modbus_controller::ModbusCommandItem::create_read_command(
                id(bms0), esphome::modbus::EntityType::HOLDING, 0x1470, 16,
                [tx_id](esphome::modbus::EntityType, uint16_t,
                        std::span<const uint8_t> data) {
                  if (id(g_passcode_tx_id) != tx_id || data.size() < 16) return;
                  for (size_t i = 0; i < 8; i++) {
                    id(g_passcode_readback_words)[i] = (uint16_t(data[i * 2]) << 8) | uint16_t(data[i * 2 + 1]);
                  }
                  id(g_passcode_readback_done) = true;
                });
            id(bms0)->queue_command(std::move(read_cmd));
            return;
          }

          if (id(g_passcode_readback_done)) {
            id(g_passcode_tx_pending) = false;
            bool matches = true;
            for (size_t i = 0; i < 8; i++) {
              if (id(g_passcode_readback_words)[i] != id(g_passcode_expected_words)[i]) { matches = false; break; }
            }
            id(setup_passcode_tx_status_code)->publish_state(matches ? 4.0f : 5.0f);  // confirmed / mismatch
            ESP_LOGI("jk_passcode", "Passcode transaction terminal: %s", matches ? "CONFIRMED" : "MISMATCH");
            return;
          }

          if (now - id(g_passcode_readback_started_ms) > 4000U) {
            ESP_LOGW("jk_passcode", "Passcode readback incomplete after 4s -- WRITE_UNCERTAIN");
            id(g_passcode_tx_pending) = false;
            id(setup_passcode_tx_status_code)->publish_state(8.0f);  // readback_timeout
          }

  - interval: 30s
    then:
      - lambda: |-
          const int idx = id(hist_index);
          id(hist_voltage)[idx] = id(total_voltage).state;
          id(hist_current)[idx] = id(current).state;
          id(hist_power)[idx] = id(power).state;
          id(hist_balance)[idx] = id(balance_current).state;
          id(hist_mosfet_temp)[idx] = id(mosfet_temperature).state;
          id(hist_temp1)[idx] = id(temperature_sensor_1).state;
          id(hist_temp2)[idx] = id(temperature_sensor_2).state;
          id(hist_temp4)[idx] = id(temperature_sensor_4).state;
          id(hist_temp5)[idx] = id(jkbms_bat_temp4).state;
          id(hist_index) = (idx + 1) % 60;
          if (id(hist_count) < 60) id(hist_count) = id(hist_count) + 1;

  # The real 60-hour Charge Cycle sampler — see cc_hist_* in globals for
  # the memory reasoning. This buffer's own stage_code (0-4) is a
  # deliberate VISUALIZATION-ONLY encoding, distinct from the strict
  # battery_state/charge_phase split used everywhere else: it reads
  # charge_phase (bulk/absorption/float/none) for codes 1-3, and layers
  # in battery_state's "discharging" as code 4 so the chart can still
  # show discharge periods — a real, previously-validated feature — WITHOUT
  # a second history byte. That second-byte alternative was costed
  # (§15 of the directive that requested this pass) at +1 byte/sample x
  # 3600 samples = +3600 bytes (~3.6KB, before struct padding — these are
  # four separate arrays, not a packed struct, so no padding applies) for
  # zero additional information over what this single 5-value byte
  # already encodes — not worth the RAM for a purely presentational
  # buffer. Not reclassified here: stage_code is fully determined by
  # reading charge_phase/charge_status's already-computed state, so there
  # remains exactly one place that decides what the pack is actually doing.
  #
  # code 5 (offline) added for the Charge Cycle timeline rework: still
  # zero RAM cost (uint8_t already had headroom to 255, this just uses
  # one more of the values it always could hold) and lets the history
  # state strip distinguish "communication was down" from "confirmed
  # neutral" instead of collapsing both into one idle-looking segment.
  - interval: 60s
    then:
      - lambda: |-
          const int idx = id(cc_hist_index);
          const float v = id(total_voltage).state;
          const float a = id(current).state;
          const float s = id(state_of_charge).state;
          id(cc_hist_voltage_cv)[idx] = isnan(v) ? INT16_MIN : int16_t(roundf(v * 100.0f));
          id(cc_hist_current_ca)[idx] = isnan(a) ? INT16_MIN : int16_t(roundf(a * 100.0f));
          id(cc_hist_soc)[idx] = isnan(s) ? uint8_t(255) : uint8_t(roundf(s));
          const std::string &status = id(charge_status).state;
          const std::string &phase = id(charge_phase).state;
          uint8_t stage_code = 0; // 0 = idle/unrecognized
          if (status == "offline") stage_code = 5;
          else if (phase == "bulk") stage_code = 1;
          else if (phase == "absorption") stage_code = 2;
          else if (phase == "float") stage_code = 3;
          else if (status == "discharging") stage_code = 4;
          id(cc_hist_stage)[idx] = stage_code;
          id(cc_hist_index) = (idx + 1) % 3600;
          if (id(cc_hist_count) < 3600) id(cc_hist_count) = id(cc_hist_count) + 1;

# charging, discharging, and balancing binary_sensors made as the template sensors
# to optimize number of modbus requests
binary_sensor:
  - platform: template
    id: charging
    name: "charging"
    lambda: |-
      return id(charging_raw).state == 1;

  - platform: template
    id: discharging
    name: "discharging"
    lambda: |-
      return id(discharging_raw).state == 1;

  - platform: template
    id: balancing
    name: "balancing"
    lambda: |-
      // Separate live BalanStatus from register 0x12A6. Values 1 and 2
      // indicate active energy transfer in opposite directions; 0 is idle.
      // This is intentionally independent of the enable switch at 0x1078.
      if (isnan(id(balancing_raw).state)) return {};
      return id(balancing_raw).state > 0.0f;

  # Read-only views of the three output-permission registers. The writer
  # Select entities are internal safety stubs while write evidence is blocked.
  - platform: template
    id: charging_allowed
    name: "charging allowed"
    lambda: |-
      if (isnan(id(charging_control_raw).state)) return {};
      return uint32_t(id(charging_control_raw).state) != 0;

  - platform: template
    id: discharging_allowed
    name: "discharging allowed"
    lambda: |-
      if (isnan(id(discharging_control_raw).state)) return {};
      return uint32_t(id(discharging_control_raw).state) != 0;

  - platform: template
    id: balancing_allowed
    name: "balancing allowed"
    lambda: |-
      if (isnan(id(balancing_control_raw).state)) return {};
      return uint32_t(id(balancing_control_raw).state) != 0;

