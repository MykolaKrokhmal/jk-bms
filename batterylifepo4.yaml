    modbus_controller_id: bms0
    id: charging_float_mode
    name: "charging float mode"
    address: 0x1114
    register_type: holding
    bitmask: 0x0200

sensor:
  # ESP32 diagnostics exposed to the local web UI.
  - platform: wifi_signal
    id: wifi_signal_dbm
    name: "wifi signal"
    update_interval: 30s

  - platform: uptime
    id: system_uptime
    name: "system uptime"
    update_interval: 30s

  # V2 — raw seconds since the last validly-decoded BMS response, for the
  # Diagnostics screen ("last BMS update Xs ago"). bms_health (text_sensor)
  # is the classified LIVE/DEGRADED/STALE/OFFLINE state derived from the
  # same timestamp; this is the underlying number.
  - platform: template
    id: bms_last_update_age
    name: "bms last update age"
    unit_of_measurement: "s"
    accuracy_decimals: 0
    update_interval: 2s
    lambda: |-
      if (id(g_last_bms_response_ms) == 0) return NAN;
      return float(millis() - id(g_last_bms_response_ms)) / 1000.0f;

