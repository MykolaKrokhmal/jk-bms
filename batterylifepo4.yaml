    update_interval: never
    unit_of_measurement: "A"
    device_class: current
    state_class: measurement
    accuracy_decimals: 3
    lambda: |-
      return isnan(id(g_current_a)) ? NAN : std::max(id(g_current_a), 0.0f);

  - platform: template
    id: discharging_current
