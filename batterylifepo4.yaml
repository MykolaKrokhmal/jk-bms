  # 0x12AC   172   UINT32    4    R    SOCFullChargeCap    mAH
  - platform: modbus_controller
    modbus_controller_id: bms0
    name: "full charge capacity"
    address: 0x12AC
    register_type: holding
    value_type: U_DWORD
    register_count: 4
    response_size: 4
    state_class: measurement
    device_class: energy_storage
    unit_of_measurement: "Ah"
    accuracy_decimals: 0
    filters:
      - multiply: 0.001

  # 0x12B0   176   UINT32    4    R    SOCCycleCount   次
  - platform: modbus_controller
    modbus_controller_id: bms0
    name: "charging cycles"
    address: 0x12B0
    register_type: holding
    value_type: U_DWORD
    register_count: 4
    response_size: 4
    state_class: measurement
    accuracy_decimals: 0

  # 0x12B4   180   UINT32    4    R    SOCCycleCap     mAH
  - platform: modbus_controller
    modbus_controller_id: bms0
    name: "total charging cycle capacity"
    address: 0x12B4
    register_type: holding
    value_type: U_DWORD
    register_count: 4
    response_size: 4
    state_class: measurement
    unit_of_measurement: "Ah"
    accuracy_decimals: 0
    filters:
      - multiply: 0.001

  # 0x12B8   184 UINT8+UINT8 2    R    StateOfHealth % / Precharge stats (1:打开 ; 0:关闭)
  # Genuine native protocol field (matches the JK-PB register table, same
  # packed-byte shape as charging_raw/discharging_raw at 0x12C0 below) —
  # not derived/computed. register_count/response_size corrected to the
  # register's real 2-byte width (was 4, copy-pasted from the neighboring
  # UINT32 SOCCycleCap entry above; byte 0 was still read correctly either
  # way, this just stops requesting 2 unrelated bytes past the register).
  - platform: modbus_controller
    modbus_controller_id: bms0
    name: "state of health"
    address: 0x12B8
    register_type: holding
    value_type: U_WORD
    register_count: 2
    response_size: 2
    state_class: measurement
    unit_of_measurement: "%"
    accuracy_decimals: 0
    lambda: |-
      return data[item->offset];

  - platform: modbus_controller
    modbus_controller_id: bms0
    name: "precharge status"
    address: 0x12B8
    register_type: holding
    value_type: U_WORD
    register_count: 2
    response_size: 2
    accuracy_decimals: 0
    lambda: |-
      return data[item->offset + 1];

  # 0x12BA   186   UINT16    2    R    UserAlarm
  - platform: modbus_controller
    modbus_controller_id: bms0
    name: "custom alarm 1"
    address: 0x12BA
    register_type: holding
    value_type: U_WORD
    register_count: 2
    response_size: 2
    accuracy_decimals: 0

  # 0x12BC   188   UINT32    4    R    RunTime         S
  - platform: modbus_controller
    modbus_controller_id: bms0
    name: "total runtime in seconds"
    address: 0x12BC
    register_type: holding
    value_type: U_DWORD
    register_count: 4
    response_size: 4
    unit_of_measurement: "S"
    device_class: duration
    state_class: measurement
    accuracy_decimals: 0
    id: total_runtime

  # 0x12C0   192 UINT8+UINT8 Charge (1:打开 ; 0:关闭) / Discharge (1:打开 ; 0:关闭)
  - platform: modbus_controller
    modbus_controller_id: bms0
    id: charging_raw
    address: 0x12C0
    register_type: holding
    value_type: U_WORD
    disabled_by_default: true
    bitmask: 0xFF00

  - platform: modbus_controller
    modbus_controller_id: bms0
    id: discharging_raw
    address: 0x12C0
    register_type: holding
    value_type: U_WORD
    register_count: 2
    response_size: 2
    disabled_by_default: true
    bitmask: 0x00FF

  # 0x12C2   194   UINT16    2    R    UserAlarm2
  - platform: modbus_controller
    modbus_controller_id: bms0
    name: "custom alarm 2"
    address: 0x12C2
    register_type: holding
    value_type: U_WORD
    register_count: 2
    response_size: 2
    accuracy_decimals: 0

  # 0x12C4   196   UINT16    2    R    TimeDcOCPR      S
  - platform: modbus_controller
    modbus_controller_id: bms0
    name: "disacharge OCPR left"
    address: 0x12C4
    register_type: holding
    value_type: U_WORD
    register_count: 2
    response_size: 2
    unit_of_measurement: "S"
    device_class: duration
    state_class: measurement
    accuracy_decimals: 0

  # 0x12C6   198   UINT16    2    R    TimeDcSCPR      S
  - platform: modbus_controller
    modbus_controller_id: bms0
    name: "disacharge SCPR left"
    address: 0x12C6
    register_type: holding
    value_type: U_WORD
    register_count: 2
    response_size: 2
    state_class: measurement
    accuracy_decimals: 0

  # 0x12C8   200   UINT16    2    R    TimeCOCPR       S
  - platform: modbus_controller
    modbus_controller_id: bms0
    name: "charge OCPR left"
    address: 0x12C8
    register_type: holding
    value_type: U_WORD
    register_count: 2
    response_size: 2
    unit_of_measurement: "S"
    device_class: duration
    state_class: measurement
    accuracy_decimals: 0

  # 0x12CA   202   UINT16    2    R    TimeCSCPR       S
  - platform: modbus_controller
    modbus_controller_id: bms0
    name: "charge SCPR left"
    address: 0x12CA
    register_type: holding
    value_type: U_WORD
    register_count: 2
    response_size: 2
    unit_of_measurement: "S"
    device_class: duration
    state_class: measurement
    accuracy_decimals: 0

  # 0x12CC   204   UINT16    2    R    TimeUVPR        S
  - platform: modbus_controller
    modbus_controller_id: bms0
    name: "uVPR left"
    address: 0x12CC
    register_type: holding
    value_type: U_WORD
    register_count: 2
    response_size: 2
    unit_of_measurement: "S"
    device_class: duration
    state_class: measurement
    accuracy_decimals: 0

  # 0x12CE   206   UINT16    2    R    TimeOVPR        S
  - platform: modbus_controller
    modbus_controller_id: bms0
    name: "oVPR left"
    address: 0x12CE
    register_type: holding
    value_type: U_WORD
    register_count: 2
    response_size: 2
    unit_of_measurement: "S"
    device_class: duration
    state_class: measurement
    accuracy_decimals: 0

  # 0x12D0   208 UINT8+UINT8 2    R    AbsentBitmask (Bit0: MOS TempSensorAbsent, Bit1: BATTempSensor1Absent, Bit2: BATTempSensor2Absent, Bit4: BATTempSensor4Absent, Bit5: BATTempSensor5Absent) / Heating
  - platform: modbus_controller
    modbus_controller_id: bms0
    name: "sensor heating mask"
    address: 0x12D0
    register_type: holding
    value_type: U_WORD
    register_count: 2
    response_size: 2
    accuracy_decimals: 0

  # 0x12D2   210   UINT16    2    R    Reserved
  # 0x12D4   212   UINT16    2    R    TimeEmergency   S
  - platform: modbus_controller
    modbus_controller_id: bms0
    name: "emergency timer"
    address: 0x12D4
    register_type: holding
    value_type: U_WORD
    register_count: 2
    response_size: 2
    unit_of_measurement: "s"
    device_class: duration
    accuracy_decimals: 0

  # 0x12D6   214   UINT16    2    R    BatCurCorrect
  - platform: modbus_controller
    modbus_controller_id: bms0
    name: "battery current correction"
    address: 0x12D6
    register_type: holding
    value_type: U_WORD
    register_count: 2
    response_size: 2
    accuracy_decimals: 0

  # 0x12D8   216   UINT16    2    R    VolChargCur     mV
  - platform: modbus_controller
    modbus_controller_id: bms0
    name: "charge current measurement voltage"
    address: 0x12D8
    register_type: holding
    value_type: U_WORD
    register_count: 2
    response_size: 2
    unit_of_measurement: "mV"
    accuracy_decimals: 0

  # 0x12DA   218   UINT16    2    R    VolDischargCur  mV
  - platform: modbus_controller
    modbus_controller_id: bms0
    name: "discharge current measurement voltage"
    address: 0x12DA
    register_type: holding
    value_type: U_WORD
    register_count: 2
    response_size: 2
    unit_of_measurement: "mV"
    accuracy_decimals: 0

  # 0x12DC   214   FLOAT     4    R    BatVolCorrect
  - platform: modbus_controller
    modbus_controller_id: bms0
    name: "battery voltage correction"
    address: 0x12DC
    register_type: holding
    value_type: FP32
    register_count: 4
    response_size: 4
    accuracy_decimals: 6

  # 0x12E4   228   UINT16    2    R    BatVol          0.01V
  - platform: modbus_controller
    modbus_controller_id: bms0
    name: "alternate battery voltage"
    address: 0x12E4
    register_type: holding
    value_type: U_WORD
    register_count: 2
    response_size: 2
    unit_of_measurement: "V"
    device_class: voltage
    accuracy_decimals: 2
    filters:
      - multiply: 0.01

  # 0x12E6   230   INT16     2    R    HeatCurrent     mA
  - platform: modbus_controller
    modbus_controller_id: bms0
    name: "heating current"
    address: 0x12E6
    register_type: holding
    value_type: S_WORD
    register_count: 2
    response_size: 2
    unit_of_measurement: "A"
    device_class: current
    state_class: measurement
    accuracy_decimals: 3
    filters:
      - multiply: 0.001

  # 0x12F0   240   UINT32    4    R    SysRunTicks     0.1S
  - platform: modbus_controller
    modbus_controller_id: bms0
    name: "bms system ticks"
    address: 0x12F0
    register_type: holding
    value_type: U_DWORD
    register_count: 4
    response_size: 4
    unit_of_measurement: "s"
    device_class: duration
    accuracy_decimals: 1
    filters:
      - multiply: 0.1

  # 0x12F8   248   INT16     2    R    TempBat 3       0.1℃
  - platform: modbus_controller
    modbus_controller_id: bms0
    name: "temperature sensor 3"
    address: 0x12F8
    register_type: holding
    value_type: S_WORD
    register_count: 2
    response_size: 2
    unit_of_measurement: "°C"
    device_class: temperature
    state_class: measurement
    accuracy_decimals: 1
    filters:
      - multiply: 0.1

  # 0x12FA   248   INT16     2    R    TempBat 4       0.1℃
  - platform: modbus_controller
    modbus_controller_id: bms0
    id: temperature_sensor_4
    name: "temperature sensor 4"
    address: 0x12FA
    register_type: holding
    value_type: S_WORD
    register_count: 2
    response_size: 2
    unit_of_measurement: "°C"
    device_class: temperature
    state_class: measurement
    accuracy_decimals: 1
    filters:
      - multiply: 0.1

  # 0x12FC   248   INT16     2    R    TempBat 5       0.1℃
  - platform: modbus_controller
    modbus_controller_id: bms0
    id: jkbms_bat_temp4
    name: "temperature sensor 5"
    address: 0x12FC
    register_type: holding
    value_type: S_WORD
    register_count: 2
    response_size: 2
    unit_of_measurement: "°C"
    device_class: temperature
    state_class: measurement
    accuracy_decimals: 1
    filters:
      - multiply: 0.1

# ----

  # 0x1504   260 UINT8+UINT8 2    RW    RCV Time / RFV Time 0.1 H
  - platform: modbus_controller
    modbus_controller_id: bms0
    id: rcv_time
    name: "rCV Time"
    address: 0x1504
    register_type: holding
    value_type: U_WORD
    register_count: 1
    response_size: 1
    skip_updates: ${bms_control_params_skip_updates}
    unit_of_measurement: "H"
    device_class: duration
    state_class: measurement
    bitmask: 0xFF
    filters:
      - multiply: 0.1

  - platform: modbus_controller
    modbus_controller_id: bms0
    id: rfv_time
    name: "rFV Time"
    address: 0x1504
    register_type: holding
    value_type: U_WORD
    register_count: 1
    response_size: 1
    skip_updates: ${bms_control_params_skip_updates}
    unit_of_measurement: "H"
    device_class: duration
    state_class: measurement
    bitmask: 0xFF00
    filters:
      - multiply: 0.1

  # Raw DRY values keep the JK-PB byte-addressed read geometry. Public RW
  # entities below are template numbers, avoiding version-specific Number schema.
  - platform: modbus_controller
    id: dry_contact_1_trigger_value_raw
    internal: true
    modbus_controller_id: bms0
    address: 0x14F0
    register_type: holding
    value_type: S_DWORD
    register_count: 4
    response_size: 4
    skip_updates: ${bms_control_params_skip_updates}

  - platform: modbus_controller
    id: dry_contact_1_recovery_value_raw
    internal: true
    modbus_controller_id: bms0
    address: 0x14F4
    register_type: holding
    value_type: S_DWORD
    register_count: 4
    response_size: 4
    skip_updates: ${bms_control_params_skip_updates}

  - platform: modbus_controller
    id: dry_contact_2_trigger_value_raw
    internal: true
    modbus_controller_id: bms0
    address: 0x14F8
    register_type: holding
    value_type: S_DWORD
    register_count: 4
    response_size: 4
    skip_updates: ${bms_control_params_skip_updates}

  - platform: modbus_controller
    id: dry_contact_2_recovery_value_raw
    internal: true
    modbus_controller_id: bms0
    address: 0x14FC
    register_type: holding
    value_type: S_DWORD
    register_count: 4
    response_size: 4
    skip_updates: ${bms_control_params_skip_updates}

  # Moved here from text_sensor: (config-validation fix, pre-existing bug
  # found while auditing for the auth/history work — these two return
  # numeric durations via their lambdas and use sensor-only schema keys
  # unit_of_measurement/device_class/state_class/accuracy_decimals, which
  # text_sensor.template does not accept; esphome config rejected them
  # under text_sensor with exactly that error).
  - platform: template
    id: battery_state_candidate_age
    name: "battery state candidate age"
    unit_of_measurement: "s"
    device_class: duration
    state_class: measurement
    accuracy_decimals: 0
    update_interval: 5s
    lambda: |-
      if (id(g_candidate_since_ms_g) == 0) return 0.0f;
      return float(uint32_t(millis() - id(g_candidate_since_ms_g)) / 1000U);

  - platform: template
    id: current_sample_age
    name: "current sample age"
    unit_of_measurement: "s"
    device_class: duration
    state_class: measurement
    accuracy_decimals: 0
    update_interval: 2s
    lambda: |-
      if (id(g_last_current_sample_ms) == 0) return NAN;
      return float(millis() - id(g_last_current_sample_ms)) / 1000.0f;

  # Also moved here from text_sensor: (same config-validation fix as
  # above — numeric value/schema keys, not a text_sensor).
  - platform: template
    id: battery_state_candidate_samples
    name: "battery state candidate fresh samples"
    accuracy_decimals: 0
    update_interval: 5s
    lambda: |-
      return id(g_candidate_fresh_samples_g);

  - platform: template
    id: idle_current_noise_min
    name: "idle current noise min"
    unit_of_measurement: "A"
    accuracy_decimals: 3
    update_interval: 5s
    lambda: |-
      static float rolling_min = NAN;
      const float amps = id(current).state;
      const bool near_idle = !isnan(amps) && fabsf(amps) < 0.5f; // mirrors CURRENT_ENTER_A
      if (id(g_current_direction_code) != 0) { rolling_min = NAN; return NAN; } // a real charge/discharge is confirmed — window not meaningful right now
      if (near_idle) rolling_min = isnan(rolling_min) ? amps : std::min(rolling_min, amps);
      return rolling_min;

  - platform: template
    id: idle_current_noise_max
    name: "idle current noise max"
    unit_of_measurement: "A"
    accuracy_decimals: 3
    update_interval: 5s
    lambda: |-
      static float rolling_max = NAN;
      const float amps = id(current).state;
      const bool near_idle = !isnan(amps) && fabsf(amps) < 0.5f;
      if (id(g_current_direction_code) != 0) { rolling_max = NAN; return NAN; }
      if (near_idle) rolling_max = isnan(rolling_max) ? amps : std::max(rolling_max, amps);
      return rolling_max;

  # Hidden raw readback source for the charging/discharging/balancing
  # template selects (below) -- converting them from platform:
  # modbus_controller to platform: template (to get a custom set_action
  # that routes through the generic Write Transaction Manager) loses
  # modbus_controller select's OWN built-in polling, so each needs an
  # explicit sensor of its own, exactly like set_cell_count depends on
  # the separate `cell_count` sensor. skip_updates matches the selects'
  # former polling cadence (5 x 15s modbus_controller_update_interval).
  - platform: modbus_controller
    modbus_controller_id: bms0
    id: charging_control_raw
    internal: true
    address: 0x1070
    register_type: holding
    value_type: U_DWORD
    skip_updates: 5

  - platform: modbus_controller
    modbus_controller_id: bms0
    id: discharging_control_raw
    internal: true
    address: 0x1074
    register_type: holding
    value_type: U_DWORD
    skip_updates: 5

  - platform: modbus_controller
    modbus_controller_id: bms0
    id: balancing_control_raw
    internal: true
    address: 0x1078
    register_type: holding
    value_type: U_DWORD
    skip_updates: 5

  # Read-only decoded views for fields whose write semantics are not proven.
  # These are sensors, not Number entities, so web/native API clients cannot
  # obtain a writable endpoint or receive a false-success response.
  #
  # Stage 1 Completion Pass note: these 7 entities used to sit much further
  # down in this file, directly after the `script:` block's last real item
  # (resolve_topology) with no `sensor:` key of their own — meaning they
  # were, until this fix, silently still LIST ITEMS of `script:`, which
  # ESPHome's config validator rejects outright (their `platform`/`name`/
  # `accuracy_decimals`/`update_interval` keys are not valid Script
  # options). ESPHome does not allow a second top-level `sensor:` key
  # (confirmed: "Duplicate key" is a hard config error, not merged), so
  # they are relocated here, appended to this file's one real `sensor:`
  # section, rather than given a header of their own. See
  # STAGE_1_COMPLETION_AUDIT.md.
  # 0x111C packed INT8/INT8 pair (see heating_thresholds_raw's own comment,
  # above): high byte = activation threshold, low byte = deactivation
  # threshold, both signed (-40..100 °C).
  - platform: template
    id: heating_activation_temperature
    name: "heating activation temperature"
    unit_of_measurement: "°C"
    device_class: temperature
    state_class: measurement
    accuracy_decimals: 0
    update_interval: 15s
    lambda: |-
      if (isnan(id(heating_thresholds_raw).state)) return NAN;
      return float(int8_t(uint8_t(uint16_t(id(heating_thresholds_raw).state) >> 8)));

  - platform: template
    id: heating_deactivation_temperature
    name: "heating deactivation temperature"
    unit_of_measurement: "°C"
    device_class: temperature
    state_class: measurement
    accuracy_decimals: 0
    update_interval: 15s
    lambda: |-
      if (isnan(id(heating_thresholds_raw).state)) return NAN;
      return float(int8_t(uint8_t(uint16_t(id(heating_thresholds_raw).state) & 0x00FF)));

  - platform: template
    id: lcd_buzzer_trigger_source
    name: "lcd buzzer trigger"
    accuracy_decimals: 0
    update_interval: 15s
    lambda: |-
      if (isnan(id(lcd_dry1_sources_raw).state)) return NAN;
      return float((uint16_t(id(lcd_dry1_sources_raw).state) >> 8) & 0xFF);

  - platform: template
    id: dry_contact_1_trigger_source
    name: "dry contact 1 trigger source"
    accuracy_decimals: 0
    update_interval: 15s
    lambda: |-
      if (isnan(id(lcd_dry1_sources_raw).state)) return NAN;
      return float(uint16_t(id(lcd_dry1_sources_raw).state) & 0x00FF);

  - platform: template
    id: dry_contact_2_trigger_source
    name: "dry contact 2 trigger source"
    accuracy_decimals: 0
    update_interval: 15s
    lambda: |-
      if (isnan(id(dry2_protocol_raw).state)) return NAN;
      return float((uint16_t(id(dry2_protocol_raw).state) >> 8) & 0x00FF);

  - platform: template
    id: dry_contact_1_trigger_value
    name: "dry contact 1 trigger value"
    accuracy_decimals: 0
    update_interval: 15s
    lambda: return id(dry_contact_1_trigger_value_raw).state;

  - platform: template
    id: dry_contact_1_recovery_value
    name: "dry contact 1 recovery value"
    accuracy_decimals: 0
    update_interval: 15s
    lambda: return id(dry_contact_1_recovery_value_raw).state;

  - platform: template
    id: dry_contact_2_trigger_value
    name: "dry contact 2 trigger value"
    accuracy_decimals: 0
    update_interval: 15s
    lambda: return id(dry_contact_2_trigger_value_raw).state;

  - platform: template
    id: dry_contact_2_recovery_value
    name: "dry contact 2 recovery value"
    accuracy_decimals: 0
    update_interval: 15s
    lambda: return id(dry_contact_2_recovery_value_raw).state;

script:
  # Rebuilds and republishes the atomic JSON transaction snapshot
  # (write_tx_snapshot, text_sensor above) from the current slot array.
  # Called after begin_write_tx (so PENDING is visible before the write
  # goes out) and after every state change the 250ms servicer interval
  # below makes.
  - id: publish_write_tx_snapshot
    then:
      - lambda: |-
          std::string out = "[";
          bool first = true;
          char buf[160];
          for (size_t i = 0; i < 6; i++) {
            if (!id(g_wtx_in_use)[i]) continue;
            if (!first) out += ",";
            first = false;
            if (id(g_wtx_suppress_value)[i]) {
              snprintf(buf, sizeof(buf), "{\"addr\":%u,\"tx_id\":%u,\"status\":%u}",
                       unsigned(id(g_wtx_address)[i]), unsigned(id(g_wtx_tx_id)[i]), unsigned(id(g_wtx_status)[i]));
            } else {
              snprintf(buf, sizeof(buf), "{\"addr\":%u,\"tx_id\":%u,\"status\":%u,\"req\":%u,\"rb\":%u}",
                       unsigned(id(g_wtx_address)[i]), unsigned(id(g_wtx_tx_id)[i]), unsigned(id(g_wtx_status)[i]),
                       unsigned(id(g_wtx_requested_raw)[i]), unsigned(id(g_wtx_readback_raw)[i]));
            }
            out += buf;
          }
          // A begin_write_tx() rejection (single-flight collision, or
          // every slot busy) never allocates a real Slot -- surface EVERY
          // rejection still inside its own 3s grace period (up to 4 can
          // be tracked concurrently, see g_wtx_rejected_* above) as its
          // own short-lived REJECTED(9) entry, so the frontend's tx-id-
          // keyed watcher (findWriteTxEntry) sees a real terminal event
          // instead of running out its own timeout -- and a second,
          // different-address rejection can never silently overwrite an
          // earlier one no client has observed yet.
          for (size_t r = 0; r < 4; r++) {
            if (id(g_wtx_rejected_tx_id)[r] == 0 || millis() - id(g_wtx_rejected_ms)[r] > 3000U) continue;
            if (!first) out += ",";
            first = false;
            snprintf(buf, sizeof(buf), "{\"addr\":%u,\"tx_id\":%u,\"status\":9}",
                     unsigned(id(g_wtx_rejected_addr)[r]), unsigned(id(g_wtx_rejected_tx_id)[r]));
            out += buf;
          }
          out += "]";
          id(write_tx_snapshot)->publish_state(out);

  # Generic Write Transaction Manager entry point (spec §4.1) — used by
  # EVERY RW register except CellCount (which keeps its own bespoke
  # topology-aware driver above/below). Starts a tracked transaction
  # (jk_write_tx::begin) and immediately queues the actual Modbus write
  # with a real on_data_func ACK handler — never assumes success from a
  # fixed delay. word_count is 1 for a plain 16-bit register, 2 for a
  # packed 32-bit pair; mask is -1 (all bits, i.e. 0xFFFFFFFF once
  # reinterpreted unsigned) for a whole-register compare, or the specific
  # bits for a packed sub-field (e.g. 0xFF00 for a register's high byte)
  # so the readback comparison never flags the untouched sibling field as
  # a mismatch. A write that arrives while a transaction for the SAME
  # address is already in flight, or while every slot is busy, is
  # REJECTED outright (nothing queued, nothing silently dropped later).
  - id: begin_write_tx
    parameters:
      address: int
      word_count: int
      raw: int
      mask: int
      suppress: int
    then:
      - lambda: |-
          // Marshal the parallel-array storage (see the globals: comment
          // above g_wtx_in_use for why it isn't a single struct global)
          // into a local jk_write_tx::Slot array so the actual
          // single-flight/allocation LOGIC still runs through the one,
          // unit-tested jk_write_tx::begin() implementation.
          std::array<jk_write_tx::Slot, 6> local;
          for (size_t i = 0; i < 6; i++) {
            local[i].in_use = id(g_wtx_in_use)[i] != 0;
            local[i].address = id(g_wtx_address)[i];
            local[i].generation = id(g_wtx_generation)[i];
          }
          uint32_t next_id = id(g_write_tx_next_id);
          const uint16_t addr = uint16_t(address);
          const int idx = jk_write_tx::begin(local, next_id, addr, uint8_t(word_count),
                                              uint32_t(raw), uint32_t(mask), millis(), suppress != 0);
          id(g_write_tx_next_id) = next_id;
          if (idx < 0) {
            ESP_LOGW("jk_write_tx", "Write to 0x%04X rejected -- a transaction for this register "
                     "is already in flight, or every transaction slot is busy", unsigned(addr));
            const uint8_t rslot = id(g_wtx_rejected_next_slot);
            id(g_wtx_rejected_addr)[rslot] = addr;
            id(g_wtx_rejected_tx_id)[rslot] = ++next_id;
            id(g_write_tx_next_id) = next_id;
            id(g_wtx_rejected_ms)[rslot] = millis();
            id(g_wtx_rejected_next_slot) = uint8_t((rslot + 1) % 4);
            id(publish_write_tx_snapshot)->execute();
            return;
          }
          const auto &s = local[idx];
          id(g_wtx_in_use)[idx] = 1;
          id(g_wtx_tx_id)[idx] = s.tx_id;
          id(g_wtx_address)[idx] = s.address;
          id(g_wtx_word_count)[idx] = s.word_count;
          id(g_wtx_requested_raw)[idx] = s.requested_raw;
          id(g_wtx_readback_raw)[idx] = 0;
          id(g_wtx_compare_mask)[idx] = s.compare_mask;
          id(g_wtx_status)[idx] = s.status;
          id(g_wtx_started_ms)[idx] = s.started_ms;
          id(g_wtx_acked)[idx] = 0;
          id(g_wtx_readback_started_ms)[idx] = 0;
          id(g_wtx_readback_done)[idx] = 0;
          id(g_wtx_finished_ms)[idx] = 0;
          id(g_wtx_suppress_value)[idx] = uint8_t(s.suppress_value ? 1 : 0);
          id(g_wtx_generation)[idx] = s.generation;
          // Third critical audit (2026-09-10, item 7): a fresh transaction
          // must never inherit a stale recovery-probe flag left over from
          // whatever OLD transaction last occupied this slot index.
          id(g_wtx_recovery_pending)[idx] = 0;

          std::vector<uint16_t> words;
          if (word_count >= 2) words = {uint16_t(uint32_t(raw) >> 16), uint16_t(uint32_t(raw) & 0xFFFFU)};
          else words = {uint16_t(raw)};
          auto command = esphome::modbus_controller::ModbusCommandItem::create_write_multiple_command(
              id(bms0), addr, words.size(), words);
          // Third critical audit (2026-09-10, item 6): capture the
          // immutable {idx, tx_id, address, generation} quadruple this ACK
          // belongs to, and verify ALL FOUR still match before mutating
          // anything -- a late ACK for a transaction this slot has since
          // moved past (reused by a newer write) is silently discarded
          // instead of corrupting the new transaction's state.
          const uint32_t ack_tx_id = s.tx_id;
          const uint16_t ack_addr = s.address;
          const uint32_t ack_generation = s.generation;
          command.on_data_func = [idx, ack_tx_id, ack_addr, ack_generation](esphome::modbus::EntityType, uint16_t,
                                        std::span<const uint8_t>) {
            if (id(g_wtx_generation)[idx] != ack_generation || id(g_wtx_tx_id)[idx] != ack_tx_id ||
                id(g_wtx_address)[idx] != ack_addr) {
              ESP_LOGW("jk_write_tx", "Stale ACK for tx_id=%u addr=0x%04X ignored (slot %d now on a newer transaction)",
                       unsigned(ack_tx_id), unsigned(ack_addr), int(idx));
              return;
            }
            id(g_wtx_acked)[idx] = 1;
          };
          id(bms0)->queue_command(std::move(command));
          id(publish_write_tx_snapshot)->execute();

  # Shared Modbus write path for numeric RW registers exposed on the
  # Configuration page — routes through the generic Write Transaction
  # Manager above (full-register compare, mask=-1 i.e. all bits) instead
  # of the old fire-and-forget queue_command-and-hope. Every UI write now
  # gets a real ACK + forced readback before it is ever reported CONFIRMED.
  - id: write_bms_u32
    parameters:
      address: int
      raw: int
    then:
      - script.execute: {id: begin_write_tx, address: !lambda "return address;", word_count: 2, raw: !lambda "return raw;", mask: -1, suppress: 0}

  - id: write_bms_u16
    parameters:
      address: int
      raw: int
    then:
      - script.execute: {id: begin_write_tx, address: !lambda "return address;", word_count: 1, raw: !lambda "return raw;", mask: -1, suppress: 0}

  # ---- Topology Resolver — the single source of truth for whether
  # CellCount (BMS *configuration*) can be trusted as the pack's actual
  # *physical* topology. Called after every 1s cell-block decode (below),
  # after a CellCount write's forced readback lands, and after the
  # uncertainty-recovery probe succeeds (250ms transaction interval,
  # below) — so it continuously self-heals (covers a reboot mid-mismatch
  # too) rather than only re-evaluating on a write.
  #
  # Inputs: cell_count (configured), cell_connected_mask (CellStatus, low
  # 16 bits), cell_voltage_1..16 (already-decoded, from the cell-block
  # poll), total_voltage (BMS's own direct pack measurement — NEVER
  # replaced by a derived sum). Rules, in priority order:
  #   LOADING          — no complete snapshot yet since boot.
  #   WRITE_UNCERTAIN  — g_topology_uncertain is set (a CellCount write's
  #                      ACK or readback was lost) and hasn't been cleared
  #                      by a fresh, independently-verified re-read yet —
  #                      overrides everything below; the old CONFIRMED
  #                      snapshot is never reported as still trustworthy.
  #   OFFLINE          — BMS communication itself has gone stale (>30s
  #                      since the last valid cell-block decode) — a mask/
  #                      count snapshot this old cannot be asserted CONFIRMED.
  #   INVALID          — configured count outside 1..MAX_CELL_CHANNELS, OR
  #                      zero connected channels, OR zero channels WITHIN
  #                      THE CONFIGURED ACTIVE RANGE report a plausible
  #                      voltage. Data is nonsensical, not just
  #                      inconsistent with configuration.
  #   MISMATCH         — the connected mask is not *exactly* the expected
  #                      contiguous "first N bits set" pattern (checking
  #                      popcount alone is NOT sufficient — a scattered
  #                      mask with the right bit COUNT but wrong
  #                      POSITIONS must still fail), OR a channel inside
  #                      the configured range lacks a plausible voltage,
  #                      OR the BMS's direct pack-voltage measurement
  #                      doesn't match the sum of the active cell voltages
  #                      within a reasonable tolerance (max(0.5V, 1.5% of
  #                      pack voltage) — generous enough for real ADC-chain
  #                      differences between the pack-level and per-cell-
  #                      tap measurements, tight enough to catch a genuine
  #                      8S/16S mix-up outright). Channels AT OR BEYOND the
  #                      configured range are never examined for
  #                      plausibility at all (measured_count is published
  #                      purely as a diagnostic) — see the loop below for
  #                      why gating on them would deadlock CONFIRMED.
  #   CONFIRMED        — none of the above; effective_cell_count becomes
  #                      the configured count, last_confirmed_cell_count
  #                      is updated, and channels beyond it are blanked to
  #                      NaN so no stale/foreign reading can linger
  #                      anywhere in the UI (raw registers included).
  # Every branch publishes the real diagnostic numbers (connected/measured
  # count, active-cell voltage sum) — mismatch/invalid/offline/uncertain
  # never hide physical data, only effective_cell_count (safely 16, the
  # full transport range) and the blanking above are gated on CONFIRMED.
  - id: resolve_topology
    then:
      - lambda: |-
          static const char *const REASON_NAMES[12] = {
            "OK", "AWAITING_SNAPSHOT", "COUNT_OUT_OF_RANGE", "NO_CONNECTED_CELLS",
            "NO_VALID_VOLTAGE", "MASK_COUNT_DIFFERS", "VOLTAGE_COUNT_DIFFERS",
            "ACTIVE_RANGE_GAP", "VOLTAGE_SUM_DIFFERS", "MASK_NOT_CONTIGUOUS",
            "BMS_OFFLINE", "WRITE_UNCERTAIN"
          };
          static const char *const STATE_NAMES[7] = {
            "LOADING", "CONFIRMED", "MISMATCH", "INVALID",
            "WRITE_UNCERTAIN", "OFFLINE", "PENDING"
          };

          // publish() is the ONLY place that touches the published
          // sensors/globals below, so every early-return branch (LOADING,
          // WRITE_UNCERTAIN, OFFLINE, INVALID) goes through the exact same
          // bookkeeping (revision bump, freshness timestamp, diagnostic
          // numbers when available) as the full CONFIRMED/MISMATCH path.
          auto publish = [](uint8_t state_code, uint8_t reason, uint8_t effective,
                             float connected_count, float measured_count, float active_sum) {
            id(g_topology_state_code) = state_code;
            id(g_topology_reason_code) = reason;
            id(g_effective_cell_count) = effective;
            id(g_topology_revision) += 1;
            id(g_topology_last_publish_ms) = millis();
            id(effective_cell_count)->publish_state(float(effective));
            id(last_confirmed_cell_count)->publish_state(float(id(g_last_confirmed_cell_count)));
            id(topology_revision)->publish_state(float(id(g_topology_revision)));
            id(topology_state)->publish_state(std::string(STATE_NAMES[state_code]));
            id(topology_reason)->publish_state(std::string(REASON_NAMES[reason]));
            if (!isnan(connected_count)) id(connected_cell_count)->publish_state(connected_count);
            if (!isnan(measured_count)) id(measured_cell_count)->publish_state(measured_count);
            if (!isnan(active_sum)) id(active_cells_voltage_sum)->publish_state(active_sum);
          };

          // ---- WRITE_UNCERTAIN: overrides everything else until the
          // recovery probe (250ms interval) clears it with a genuinely
          // fresh, independently re-read snapshot. ----
          if (id(g_topology_uncertain)) {
            publish(4, 11, 16, NAN, NAN, NAN);
            return;
          }

          const bool have_cell_data = id(g_last_bms_response_ms) != 0;
          if (!have_cell_data) {
            publish(0, 1, 16, NAN, NAN, NAN);
            return;
          }

          // ---- OFFLINE: BMS communication itself is stale. Mirrors
          // bms_health's own OFFLINE threshold (30s) for consistency —
          // a mask/count snapshot this old cannot be asserted CONFIRMED. ----
          const uint32_t comm_elapsed_ms = millis() - id(g_last_bms_response_ms);
          if (comm_elapsed_ms > 30000U) {
            publish(5, 10, 16, NAN, NAN, NAN);
            return;
          }

          const float configured_f = id(cell_count).state;
          const float mask_f = id(cell_connected_mask).state;
          if (isnan(configured_f) || isnan(mask_f)) {
            publish(0, 1, 16, NAN, NAN, NAN);
            return;
          }

          const int32_t configured_raw = int32_t(lroundf(configured_f));
          // MAX_CELL_CHANNELS = 16: the JK-PB protocol's own physical
          // ceiling (CellCount register 0x106C is documented RW 1..16;
          // the cell-block read at 0x1200 always spans exactly 16
          // channels regardless of configuration) — the transport
          // maximum, never an assumed/default ACTIVE count. The active
          // count is configured_raw, cross-checked below; it is never
          // hardcoded.
          const uint8_t MAX_CELL_CHANNELS = 16;
          const bool count_in_range = configured_raw >= 1 && configured_raw <= int32_t(MAX_CELL_CHANNELS);
          if (!count_in_range) {
            publish(3, 2, MAX_CELL_CHANNELS, NAN, NAN, NAN);
            return;
          }
          const uint8_t configured = uint8_t(configured_raw);

          const uint32_t mask = uint32_t(mask_f) & 0xFFFFU;
          // The ONE exact mask this configuration can ever legitimately
          // produce: the first `configured` bits set, nothing else — a
          // gap, an extra high bit, or a right POPCOUNT in the wrong
          // POSITIONS all fail this, which a popcount-only check would miss.
          const uint32_t expected_mask = (uint32_t(1) << configured) - 1U;
          const bool mask_exact = mask == expected_mask;

          uint8_t connected_count = 0;
          for (uint8_t i = 0; i < 16; i++) if (mask & (1U << i)) connected_count++;
          if (connected_count == 0) {
            publish(3, 3, MAX_CELL_CHANNELS, 0.0f, NAN, NAN);
            return;
          }

          esphome::sensor::Sensor *const voltage_sensors[16] = {
            id(cell_voltage_1),  id(cell_voltage_2),  id(cell_voltage_3),  id(cell_voltage_4),
            id(cell_voltage_5),  id(cell_voltage_6),  id(cell_voltage_7),  id(cell_voltage_8),
            id(cell_voltage_9),  id(cell_voltage_10), id(cell_voltage_11), id(cell_voltage_12),
            id(cell_voltage_13), id(cell_voltage_14), id(cell_voltage_15), id(cell_voltage_16)
          };

          // measured_count is a DIAGNOSTIC over all 16 physical channels —
          // published for the operator to see, but deliberately NOT a
          // CONFIRMED gate: whether a channel beyond `configured` happens
          // to still report a plausible (possibly stale) voltage is a BMS
          // firmware implementation detail this resolver has no verified
          // way to depend on, and gating on it would create a genuine
          // chicken-and-egg deadlock — the ONLY place a channel beyond
          // `configured` gets blanked to NaN is the CONFIRMED branch
          // below, so requiring it to ALREADY read as implausible before
          // CONFIRMED can ever be reached would make a cell-count
          // reduction permanently unconfirmable on any BMS that holds the
          // last real reading on now-unused channels rather than zeroing
          // them. Spec: "для кожного неактивної комірки значення не
          // використовуються" — inactive-channel values are excluded from
          // the determination entirely, not required to look a certain way.
          uint8_t measured_count = 0;
          uint8_t active_measured_count = 0;
          bool active_range_gap = false;
          float active_sum = 0.0f;
          for (uint8_t i = 0; i < 16; i++) {
            const float v = voltage_sensors[i]->state;
            // isfinite() explicitly rejects NaN AND +/-infinity, not just
            // the range check below (which would already exclude both,
            // but this makes the exclusion an explicit, named intent
            // rather than an accident of the bounds chosen).
            const bool plausible = std::isfinite(v) && v > 0.5f && v < 10.0f;
            if (plausible) measured_count++;
            if (i < configured) {
              if (plausible) { active_sum += v; active_measured_count++; } else active_range_gap = true;
            }
          }
          if (active_measured_count == 0) {
            publish(3, 4, MAX_CELL_CHANNELS, float(connected_count), float(measured_count), NAN);
            return;
          }

          uint8_t state_code = 1;  // CONFIRMED, optimistically
          uint8_t reason = 0;      // OK
          if (!mask_exact) {
            state_code = 2;
            reason = (connected_count != configured) ? 5 : 9;  // MASK_COUNT_DIFFERS vs MASK_NOT_CONTIGUOUS
          } else if (active_range_gap) { state_code = 2; reason = 7; }
          else {
            const float raw_pack_v = id(total_voltage).state;
            const float tolerance = std::max(0.5f, fabsf(raw_pack_v) * 0.015f);
            if (!std::isfinite(raw_pack_v) || fabsf(raw_pack_v - active_sum) > tolerance) { state_code = 2; reason = 8; }
          }

          const uint8_t effective = state_code == 1 ? configured : MAX_CELL_CHANNELS;
          if (state_code == 1) id(g_last_confirmed_cell_count) = configured;
          publish(state_code, reason, effective, float(connected_count), float(measured_count), active_sum);

          if (state_code == 1) {
            esphome::sensor::Sensor *const resistance_sensors[16] = {
              id(cell_resistance_1),  id(cell_resistance_2),  id(cell_resistance_3),  id(cell_resistance_4),
              id(cell_resistance_5),  id(cell_resistance_6),  id(cell_resistance_7),  id(cell_resistance_8),
              id(cell_resistance_9),  id(cell_resistance_10), id(cell_resistance_11), id(cell_resistance_12),
              id(cell_resistance_13), id(cell_resistance_14), id(cell_resistance_15), id(cell_resistance_16)
            };
            for (uint8_t i = configured; i < 16; i++) {
              voltage_sensors[i]->publish_state(NAN);
              resistance_sensors[i]->publish_state(NAN);
            }
          }

