  # rework, THIRD pass, 2026-09-17: a validly-read CellCount drives this in
  # EVERY state (CONFIRMED, MISMATCH, OFFLINE with a cached last-read
  # value) -- only LOADING (no snapshot since boot/reconnect) and INVALID/
  # COUNT_OUT_OF_RANGE (a nonsensical reading -- an explicit configuration
  # error, never silently turned into 32) publish 0. See
  # jk_topology_core.h's own Outputs::display_cell_count comment for the
  # full reasoning; jk_bms.js's activeCellCount() reads THIS sensor
