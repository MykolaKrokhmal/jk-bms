select:
  # Converted from platform: modbus_controller to platform: template so
  # each gets a custom set_action routing through the generic Write
  # Transaction Manager (spec §4.1) instead of modbus_controller select's
  # own optimistic, unconfirmed write. `name:`/object_id/web_server
  # endpoint slug ("charging") is unchanged, so the frontend's existing
  # `select-charging` entity key keeps working; the internal C++ `id:` is
  # renamed (select_charging) only because `charging` is already taken by
  # the separate live-status binary_sensor (a different register, 0x1218-
  # family — charging_raw — NOT this control register at 0x1070). The
  # displayed option is the LAST CONFIRMED register value
  # (charging_control_raw, above), never an optimistic echo of the click.
  #
  # Stage 1 Completion Pass (CODEX_STAGE_1_REMEDIATION_RESULT_REVIEW.md
  # P0-2/P0-4, user-confirmed 2026-09-09): charging/discharging/balancing
  # (0x1070/0x1074/0x1078) have the same evidence gap as every other
  # protection-threshold RW field (verification_status
  # "implementation_only_unverified" — implementation and upstream share
  # one derivation group; workbook provenance is unknown) and are declared
  # write_safety_class "disruptive". All three set_action bodies below now
  # refuse unconditionally instead of calling begin_write_tx — no Modbus
  # write is ever queued for these addresses. The entity keeps its
  # `select` domain and its lambda: read function (unchanged), so the
  # dropdown continues to correctly display the real, live enabled/
  # disabled state; picking an option in the UI now has no effect (the
  # display reverts to the real state on the next poll) rather than
  # silently reporting a fake success — kept as `select` rather than
  # converted to a plain read-only sensor specifically so this file did
  # not also have to change jk_bms.js's several "select" + charging/
  # discharging/balancing frontend code paths (rendering, control pills,
  # timeline) under the same time-boxed pass; STAGE_1_COMPLETION_AUDIT.md
  # discloses this as a residual UX gap, not a write-safety one — the
  # generic Write Transaction Manager's begin_write_tx is never invoked,
  # which is the property that actually matters.
  - platform: template
    id: select_charging
    internal: true
    name: "charging"
    icon: "mdi:battery-charging-100"
    options:
      - "Off"
      - "On"
    lambda: |-
      if (isnan(id(charging_control_raw).state)) return {};
      return uint32_t(id(charging_control_raw).state) != 0 ? std::string("On") : std::string("Off");
    # Reverted to fail-closed (2026-09-10, second critical audit) pending
    # independent write-contract verification (see docs/adr/0001-protocol-
    # catalog.md's sixth-pass addendum): owner_write_override alone is risk
    # acceptance, not protocol verification. No Modbus command is queued.
    set_action:
      - lambda: |-
          ESP_LOGE("jk_write_block", "Write to select_charging (0x1070) rejected: "
                   "reverted to fail-closed pending write-contract verification "
                   "(disruptive/unverified) -- no Modbus command was queued.");
  - platform: template
    id: select_discharging
    internal: true
    name: "discharging"
    icon: "mdi:power-plug-battery"
    options:
      - "Off"
      - "On"
    lambda: |-
      if (isnan(id(discharging_control_raw).state)) return {};
      return uint32_t(id(discharging_control_raw).state) != 0 ? std::string("On") : std::string("Off");
    # Reverted to fail-closed (2026-09-10, second critical audit) pending
    # independent write-contract verification (see docs/adr/0001-protocol-
    # catalog.md's sixth-pass addendum): owner_write_override alone is risk
    # acceptance, not protocol verification. No Modbus command is queued.
    set_action:
      - lambda: |-
          ESP_LOGE("jk_write_block", "Write to select_discharging (0x1074) rejected: "
                   "reverted to fail-closed pending write-contract verification "
                   "(disruptive/unverified) -- no Modbus command was queued.");
  - platform: template
    id: select_balancing
    internal: true
    name: "balancing"
    icon: mdi:scale-balance
    options:
      - "Off"
      - "On"
    lambda: |-
      if (isnan(id(balancing_control_raw).state)) return {};
      return uint32_t(id(balancing_control_raw).state) != 0 ? std::string("On") : std::string("Off");
    # Reverted to fail-closed (2026-09-10, third critical audit):
    # registers.canonical.json wrongly had write_safety_class "normal" for
