    device_class: current
    state_class: measurement
    accuracy_decimals: 3
    lambda: |-
      return isnan(id(g_current_a)) ? NAN : std::max(-id(g_current_a), 0.0f);

  # The documented JK-PB Modbus map does not expose the BLE-only charge-stage
  # timer. Publish a deterministic local elapsed value from the BMS charging
  # flag, independent of the installation-specific current sign convention.
  - platform: template
    id: charge_status_time_elapsed
    name: "charge status time elapsed"
    update_interval: 1s
    unit_of_measurement: "s"
    device_class: duration
    state_class: measurement
    accuracy_decimals: 0
    lambda: |-
      static bool was_charging = false;
      static uint32_t started_ms = 0;
      const uint32_t now = millis();
      const bool charging_flag_active = id(charging).state;
      if (!charging_flag_active) {
        was_charging = false;
        started_ms = now;
        return 0.0f;
      }
      if (!was_charging) {
        was_charging = true;
        started_ms = now;
      }
      return float(uint32_t(now - started_ms) / 1000U);

  # V2.1 — the REAL per-phase timer (charge_status_time_elapsed above is a
  # different clock: time since the `charging` output last turned on, which
  # never resets at a Bulk->Absorption transition). g_charge_phase_started_ms
  # is set by charge_status's own lambda (further down) at the exact instant
  # its classified charge_phase changes, so this is genuinely "how long has
  # the pack been in its CURRENT charge phase" (bulk/absorption/float/none)
  # — the Charge Cycle graph's own timer, not the whole charging session and
  # NOT the main operating-state duration (see battery_state_elapsed below).
  - platform: template
    id: charge_phase_elapsed
    name: "charge phase elapsed"
    update_interval: 1s
    unit_of_measurement: "s"
    device_class: duration
    state_class: measurement
    accuracy_decimals: 0
    lambda: |-
      if (id(g_charge_phase_started_ms) == 0) return 0.0f;
      return float(uint32_t(millis() - id(g_charge_phase_started_ms)) / 1000U);

  # V2.2 — the PUBLIC/main-status timer: how long the pack has been in its
  # CURRENT battery_state (idle/charging/discharging/absorption/float/
  # offline), driven by g_battery_state_started_ms (set by charge_status's
  # own resolver whenever battery_state itself changes — a separate clock
  # from charge_phase_elapsed above, since the two concepts now live at
  # different abstraction levels and only coincide while actively charging).
  - platform: template
    id: battery_state_elapsed
    name: "battery state elapsed"
    update_interval: 1s
    unit_of_measurement: "s"
    device_class: duration
    state_class: measurement
    accuracy_decimals: 0
    lambda: |-
      if (id(g_battery_state_started_ms) == 0) return 0.0f;
      return float(uint32_t(millis() - id(g_battery_state_started_ms)) / 1000U);

  # Moved here from text_sensor: (config-validation fix, pre-existing bug
  # found while auditing for the auth/history work — these two return
  # numeric durations via their lambdas and use sensor-only schema keys
  # unit_of_measurement/device_class/state_class/accuracy_decimals, which
  # text_sensor.template does not accept; esphome config rejected them
  # under text_sensor with exactly that error).
  - platform: template
    id: battery_state_candidate_age
    name: "battery state candidate age"
    unit_of_measurement: "s"
    device_class: duration
    state_class: measurement
    accuracy_decimals: 0
    update_interval: 5s
    lambda: |-
      if (id(g_candidate_since_ms_g) == 0) return 0.0f;
      return float(uint32_t(millis() - id(g_candidate_since_ms_g)) / 1000U);

  - platform: template
    id: current_sample_age
    name: "current sample age"
    unit_of_measurement: "s"
    device_class: duration
    state_class: measurement
    accuracy_decimals: 0
    update_interval: 2s
    lambda: |-
      if (id(g_last_current_sample_ms) == 0) return NAN;
      return float(millis() - id(g_last_current_sample_ms)) / 1000.0f;

  # Also moved here from text_sensor: (same config-validation fix as
  # above — numeric value/schema keys, not a text_sensor).
  - platform: template
    id: battery_state_candidate_samples
    name: "battery state candidate fresh samples"
    accuracy_decimals: 0
    update_interval: 5s
    lambda: |-
      return id(g_candidate_fresh_samples_g);

  - platform: template
    id: idle_current_noise_min
    name: "idle current noise min"
    unit_of_measurement: "A"
    accuracy_decimals: 3
    update_interval: 5s
    lambda: |-
      static float rolling_min = NAN;
      const float amps = id(current).state;
      const bool near_idle = !isnan(amps) && fabsf(amps) < 0.5f; // mirrors CURRENT_ENTER_A
      if (id(g_current_direction_code) != 0) { rolling_min = NAN; return NAN; } // a real charge/discharge is confirmed — window not meaningful right now
      if (near_idle) rolling_min = isnan(rolling_min) ? amps : std::min(rolling_min, amps);
      return rolling_min;

  - platform: template
    id: idle_current_noise_max
    name: "idle current noise max"
    unit_of_measurement: "A"
    accuracy_decimals: 3
    update_interval: 5s
    lambda: |-
      static float rolling_max = NAN;
      const float amps = id(current).state;
      const bool near_idle = !isnan(amps) && fabsf(amps) < 0.5f;
      if (id(g_current_direction_code) != 0) { rolling_max = NAN; return NAN; }
      if (near_idle) rolling_max = isnan(rolling_max) ? amps : std::max(rolling_max, amps);
      return rolling_max;

  # Hidden raw readback source for the charging/discharging/balancing
  # template selects (below) -- converting them from platform:
  # modbus_controller to platform: template (to get a custom set_action
  # that routes through the generic Write Transaction Manager) loses
  # modbus_controller select's OWN built-in polling, so each needs an
  # explicit sensor of its own, exactly like set_cell_count depends on
  # the separate `cell_count` sensor. skip_updates matches the selects'
  # former polling cadence (5 x 15s modbus_controller_update_interval).
script:
  # ---- Clustered read hook (plan M5): runs right after the generated
  # servicer stored and decoded a cluster (protocol/generated/read_plan.yaml).
  # Publishes the values that are not per-register read-plan fields:
  #   A1 -> cell voltages 1-32 and wire resistances 1-32 (active channels
  #         only, from the configured cell count), native max/min index,
  #         min/max over every active channel, topology resolution;
  #   C2 -> CellConWireRes0-31 (0x1088-0x1106), which spans C1 (0x1088-
  #         0x10EE) and C2 (0x10F0-0x1106): decoded only when C1 was read
  #         in the same cycle (C2 always follows C1).
  # Reads only the raw cluster cache (jk_cluster_cache_core.h); never Modbus.
  - id: cluster_stored
    parameters:
      cluster: int
      fallback: bool
    then:
      - lambda: |-
          // fallback == false: the cluster was just stored in the runtime's
          // cache. fallback == true: a latched group's bespoke reader just
          // filled the runtime's fallback image (jk_cluster_runtime::
          // kBespokeReads) laid out like this cluster's payload.
          const auto &rt = jk_cluster_runtime::g_runtime;
          if (cluster < 0 || std::size_t(cluster) >= jk_read_clusters::kClusterCount) return;
          const auto &cl = jk_read_clusters::kClusters[cluster];
          const auto &entry = rt.cache().entry(std::size_t(cluster));
          if (!fallback && entry.source != jk_cluster_cache::Source::CLUSTER) return;

          if (cl.start == 0x1200) {  // A1
            esphome::sensor::Sensor *const voltage_sensors[32] = {
              id(cell_voltage_1),  id(cell_voltage_2),  id(cell_voltage_3),  id(cell_voltage_4),
              id(cell_voltage_5),  id(cell_voltage_6),  id(cell_voltage_7),  id(cell_voltage_8),
              id(cell_voltage_9),  id(cell_voltage_10), id(cell_voltage_11), id(cell_voltage_12),
              id(cell_voltage_13), id(cell_voltage_14), id(cell_voltage_15), id(cell_voltage_16),
              id(cell_voltage_17), id(cell_voltage_18), id(cell_voltage_19), id(cell_voltage_20),
              id(cell_voltage_21), id(cell_voltage_22), id(cell_voltage_23), id(cell_voltage_24),
              id(cell_voltage_25), id(cell_voltage_26), id(cell_voltage_27), id(cell_voltage_28),
              id(cell_voltage_29), id(cell_voltage_30), id(cell_voltage_31), id(cell_voltage_32)
            };
            esphome::sensor::Sensor *const resistance_sensors[32] = {
              id(cell_resistance_1),  id(cell_resistance_2),  id(cell_resistance_3),  id(cell_resistance_4),
              id(cell_resistance_5),  id(cell_resistance_6),  id(cell_resistance_7),  id(cell_resistance_8),
              id(cell_resistance_9),  id(cell_resistance_10), id(cell_resistance_11), id(cell_resistance_12),
              id(cell_resistance_13), id(cell_resistance_14), id(cell_resistance_15), id(cell_resistance_16),
              id(cell_resistance_17), id(cell_resistance_18), id(cell_resistance_19), id(cell_resistance_20),
              id(cell_resistance_21), id(cell_resistance_22), id(cell_resistance_23), id(cell_resistance_24),
              id(cell_resistance_25), id(cell_resistance_26), id(cell_resistance_27), id(cell_resistance_28),
              id(cell_resistance_29), id(cell_resistance_30), id(cell_resistance_31), id(cell_resistance_32)
            };
            const uint8_t *a1 = fallback ? rt.fallback_cell_image() : entry.bytes.data();
            if (a1 == nullptr) return;
            // Fallback: cell_resistance_17-32 only once their own 0x126A read landed.
            const bool ext_resistance_ok = !fallback || rt.fallback_cells_ext_valid();
            const uint8_t active = jk_topology::channel_count_from_configured(id(cell_count).state);
            const auto f = jk_cluster_cache::decode_cells_from_a1(a1, active);
            for (std::size_t i = 0; i < jk_cluster_cache::kCellChannels; i++) {
              if (!f.publish[i]) continue;  // inactive channels are never published
              voltage_sensors[i]->publish_state(f.millivolts[i] * 0.001f);
              if (i < 16 || ext_resistance_ok) resistance_sensors[i]->publish_state(f.milliohms[i] * 0.001f);
            }
            id(max_voltage_cell_index_native)->publish_state(float(f.native_max_index));
            id(min_voltage_cell_index_native)->publish_state(float(f.native_min_index));
            if (active > 16 && ext_resistance_ok && id(g_cellwireres_ext_capability) != jk_capability::STATE_SUPPORTED) {
              id(g_cellwireres_ext_capability) = jk_capability::STATE_SUPPORTED;
              id(cell_wire_resistance_ext_capability)->publish_state(std::string(jk_capability::STATE_NAMES[jk_capability::STATE_SUPPORTED]));
            }
            if (f.min_index == 0U || f.max_index == 0U) return;
            id(g_last_bms_response_ms) = millis();
            id(g_min_cell_v) = f.min_mv * 0.001f;
            id(g_max_cell_v) = f.max_mv * 0.001f;
            id(g_min_cell_idx) = f.min_index;
            id(g_max_cell_idx) = f.max_index;
            id(min_cell_voltage).publish_state(id(g_min_cell_v));
            id(max_cell_voltage).publish_state(id(g_max_cell_v));
            id(min_voltage_cell).publish_state(float(f.min_index));
            id(max_voltage_cell).publish_state(float(f.max_index));
            id(resolve_topology)->execute();
            return;
          }

          if (cl.start == 0x10F0) {  // C2: CellConWireRes0-31 from C1 + C2 of this cycle (or the fallback image)
            const int c1 = jk_read_clusters::cluster_of(0x1088);
            if (c1 < 0) return;
            const auto &c1e = rt.cache().entry(std::size_t(c1));
            const uint8_t *con_image = fallback ? rt.fallback_conwireres_image() : nullptr;
            if (fallback && con_image == nullptr) return;
            if (!fallback && (c1e.source != jk_cluster_cache::Source::CLUSTER || uint32_t(entry.success_ms - c1e.success_ms) > 1000U)) return;
            esphome::sensor::Sensor *const calibration_sensors[32] = {
              id(cell_connection_wire_resistance_1),  id(cell_connection_wire_resistance_2),
              id(cell_connection_wire_resistance_3),  id(cell_connection_wire_resistance_4),
              id(cell_connection_wire_resistance_5),  id(cell_connection_wire_resistance_6),
              id(cell_connection_wire_resistance_7),  id(cell_connection_wire_resistance_8),
              id(cell_connection_wire_resistance_9),  id(cell_connection_wire_resistance_10),
              id(cell_connection_wire_resistance_11), id(cell_connection_wire_resistance_12),
              id(cell_connection_wire_resistance_13), id(cell_connection_wire_resistance_14),
              id(cell_connection_wire_resistance_15), id(cell_connection_wire_resistance_16),
              id(cell_connection_wire_resistance_17), id(cell_connection_wire_resistance_18),
              id(cell_connection_wire_resistance_19), id(cell_connection_wire_resistance_20),
              id(cell_connection_wire_resistance_21), id(cell_connection_wire_resistance_22),
              id(cell_connection_wire_resistance_23), id(cell_connection_wire_resistance_24),
              id(cell_connection_wire_resistance_25), id(cell_connection_wire_resistance_26),
              id(cell_connection_wire_resistance_27), id(cell_connection_wire_resistance_28),
              id(cell_connection_wire_resistance_29), id(cell_connection_wire_resistance_30),
              id(cell_connection_wire_resistance_31), id(cell_connection_wire_resistance_32)
            };
            const auto &c1c = jk_read_clusters::kClusters[c1];
            for (uint8_t k = 0; k < 32; k++) {
              const uint16_t address = uint16_t(0x1088 + 4U * k);
              const bool in_c1 = uint32_t(address) + 4U <= uint32_t(c1c.start) + c1c.payload_bytes;
              const uint8_t *p = con_image != nullptr ? con_image + 4U * k
                               : in_c1 ? c1e.bytes.data() + (address - c1c.start) : entry.bytes.data() + (address - cl.start);
              const uint32_t microohms = (uint32_t(p[0]) << 24) | (uint32_t(p[1]) << 16) | (uint32_t(p[2]) << 8) | uint32_t(p[3]);
              calibration_sensors[k]->publish_state(float(double(microohms) * 0.001));
            }
            id(g_cellconwireres_queued_count) += 1;
            id(g_cellconwireres_callback_count) += 1;
            id(cell_connection_wire_resistance_queued_count)->publish_state(float(id(g_cellconwireres_queued_count)));
            id(cell_connection_wire_resistance_callback_count)->publish_state(float(id(g_cellconwireres_callback_count)));
            id(cell_connection_wire_resistance_last_response_bytes)->publish_state(128.0f);
            id(cell_connection_wire_resistance_last_outcome)->publish_state(
                std::string(jk_capability::ATTEMPT_OUTCOME_NAMES[jk_capability::ATTEMPT_RESPONSE_OK]));
            if (id(g_cellconwireres_capability) != jk_capability::STATE_SUPPORTED) {
              id(g_cellconwireres_capability) = jk_capability::STATE_SUPPORTED;
              id(cell_connection_wire_resistance_capability)->publish_state(std::string(jk_capability::STATE_NAMES[jk_capability::STATE_SUPPORTED]));
            }
          }

  # Rebuilds and republishes the atomic JSON transaction snapshot
  # (write_tx_snapshot, text_sensor above) from the current slot array.
  # Called after begin_write_tx (so PENDING is visible before the write
  # goes out) and after every state change the 250ms servicer interval
  # below makes.
  - id: publish_write_tx_snapshot
    then:
      - lambda: |-
          std::string out = "[";
          bool first = true;
          char buf[160];
          for (size_t i = 0; i < 6; i++) {
            if (!id(g_wtx_in_use)[i]) continue;
            if (!first) out += ",";
            first = false;
            if (id(g_wtx_suppress_value)[i]) {
              snprintf(buf, sizeof(buf), "{\"addr\":%u,\"tx_id\":%u,\"status\":%u}",
                       unsigned(id(g_wtx_address)[i]), unsigned(id(g_wtx_tx_id)[i]), unsigned(id(g_wtx_status)[i]));
            } else {
              snprintf(buf, sizeof(buf), "{\"addr\":%u,\"tx_id\":%u,\"status\":%u,\"req\":%u,\"rb\":%u}",
                       unsigned(id(g_wtx_address)[i]), unsigned(id(g_wtx_tx_id)[i]), unsigned(id(g_wtx_status)[i]),
                       unsigned(id(g_wtx_requested_raw)[i]), unsigned(id(g_wtx_readback_raw)[i]));
            }
            out += buf;
          }
          // A begin_write_tx() rejection (single-flight collision, or
          // every slot busy) never allocates a real Slot -- surface EVERY
          // rejection still inside its own 3s grace period (up to 4 can
          // be tracked concurrently, see g_wtx_rejected_* above) as its
          // own short-lived REJECTED(9) entry, so the frontend's tx-id-
          // keyed watcher (findWriteTxEntry) sees a real terminal event
          // instead of running out its own timeout -- and a second,
          // different-address rejection can never silently overwrite an
          // earlier one no client has observed yet.
          for (size_t r = 0; r < 4; r++) {
            if (id(g_wtx_rejected_tx_id)[r] == 0 || millis() - id(g_wtx_rejected_ms)[r] > 3000U) continue;
            if (!first) out += ",";
            first = false;
            snprintf(buf, sizeof(buf), "{\"addr\":%u,\"tx_id\":%u,\"status\":9}",
                     unsigned(id(g_wtx_rejected_addr)[r]), unsigned(id(g_wtx_rejected_tx_id)[r]));
            out += buf;
          }
          out += "]";
          id(write_tx_snapshot)->publish_state(out);

  # Generic Write Transaction Manager entry point (spec §4.1) — used by
  # EVERY RW register except CellCount (which keeps its own bespoke
  # topology-aware driver above/below). Starts a tracked transaction
  # (jk_write_tx::begin) and immediately queues the actual Modbus write
  # with a real on_data_func ACK handler — never assumes success from a
  # fixed delay. word_count is 1 for a plain 16-bit register, 2 for a
  # packed 32-bit pair; mask is -1 (all bits, i.e. 0xFFFFFFFF once
  # reinterpreted unsigned) for a whole-register compare, or the specific
  # bits for a packed sub-field (e.g. 0xFF00 for a register's high byte)
  # so the readback comparison never flags the untouched sibling field as
  # a mismatch. A write that arrives while a transaction for the SAME
  # address is already in flight, or while every slot is busy, is
  # REJECTED outright (nothing queued, nothing silently dropped later).
  - id: begin_write_tx
    parameters:
      address: int
      word_count: int
      raw: int
      mask: int
      suppress: int
    then:
      - lambda: |-
          // Marshal the parallel-array storage (see the globals: comment
          // above g_wtx_in_use for why it isn't a single struct global)
          // into a local jk_write_tx::Slot array so the actual
          // single-flight/allocation LOGIC still runs through the one,
          // unit-tested jk_write_tx::begin() implementation.
          std::array<jk_write_tx::Slot, 6> local;
          for (size_t i = 0; i < 6; i++) {
            local[i].in_use = id(g_wtx_in_use)[i] != 0;
            local[i].address = id(g_wtx_address)[i];
            local[i].generation = id(g_wtx_generation)[i];
          }
          uint32_t next_id = id(g_write_tx_next_id);
          const uint16_t addr = uint16_t(address);
          const int idx = jk_write_tx::begin(local, next_id, addr, uint8_t(word_count),
                                              uint32_t(raw), uint32_t(mask), millis(), suppress != 0);
          id(g_write_tx_next_id) = next_id;
          if (idx < 0) {
            ESP_LOGW("jk_write_tx", "Write to 0x%04X rejected -- a transaction for this register "
                     "is already in flight, or every transaction slot is busy", unsigned(addr));
            const uint8_t rslot = id(g_wtx_rejected_next_slot);
            id(g_wtx_rejected_addr)[rslot] = addr;
            id(g_wtx_rejected_tx_id)[rslot] = ++next_id;
            id(g_write_tx_next_id) = next_id;
            id(g_wtx_rejected_ms)[rslot] = millis();
            id(g_wtx_rejected_next_slot) = uint8_t((rslot + 1) % 4);
            id(publish_write_tx_snapshot)->execute();
            return;
          }
          const auto &s = local[idx];
          id(g_wtx_in_use)[idx] = 1;
          id(g_wtx_tx_id)[idx] = s.tx_id;
          id(g_wtx_address)[idx] = s.address;
          id(g_wtx_word_count)[idx] = s.word_count;
          id(g_wtx_requested_raw)[idx] = s.requested_raw;
          id(g_wtx_readback_raw)[idx] = 0;
          id(g_wtx_compare_mask)[idx] = s.compare_mask;
          id(g_wtx_status)[idx] = s.status;
          id(g_wtx_started_ms)[idx] = s.started_ms;
          id(g_wtx_acked)[idx] = 0;
          id(g_wtx_readback_started_ms)[idx] = 0;
          id(g_wtx_readback_done)[idx] = 0;
          id(g_wtx_finished_ms)[idx] = 0;
          id(g_wtx_suppress_value)[idx] = uint8_t(s.suppress_value ? 1 : 0);
          id(g_wtx_generation)[idx] = s.generation;
          // Third critical audit (2026-09-10, item 7): a fresh transaction
          // must never inherit a stale recovery-probe flag left over from
          // whatever OLD transaction last occupied this slot index.
          id(g_wtx_recovery_pending)[idx] = 0;

          std::vector<uint16_t> words;
          if (word_count >= 2) words = {uint16_t(uint32_t(raw) >> 16), uint16_t(uint32_t(raw) & 0xFFFFU)};
          else words = {uint16_t(raw)};
          auto command = esphome::modbus_controller::ModbusCommandItem::create_write_multiple_command(
              id(bms0), addr, words.size(), words);
          // Third critical audit (2026-09-10, item 6): capture the
          // immutable {idx, tx_id, address, generation} quadruple this ACK
          // belongs to, and verify ALL FOUR still match before mutating
          // anything -- a late ACK for a transaction this slot has since
          // moved past (reused by a newer write) is silently discarded
          // instead of corrupting the new transaction's state.
          const uint32_t ack_tx_id = s.tx_id;
          const uint16_t ack_addr = s.address;
          const uint32_t ack_generation = s.generation;
          command.on_data_func = [idx, ack_tx_id, ack_addr, ack_generation](esphome::modbus::EntityType, uint16_t,
                                        std::span<const uint8_t>) {
            if (id(g_wtx_generation)[idx] != ack_generation || id(g_wtx_tx_id)[idx] != ack_tx_id ||
                id(g_wtx_address)[idx] != ack_addr) {
              ESP_LOGW("jk_write_tx", "Stale ACK for tx_id=%u addr=0x%04X ignored (slot %d now on a newer transaction)",
                       unsigned(ack_tx_id), unsigned(ack_addr), int(idx));
              return;
            }
            id(g_wtx_acked)[idx] = 1;
          };
          id(bms0)->queue_command(std::move(command));
          id(publish_write_tx_snapshot)->execute();

  # Write coordination (plan M8): who owns the bus, from the same
  # authoritative predicate the read servicer pauses on -- a generic slot's
  # write or forced readback, CellCount, topology recovery, the setup
  # passcode, or a write intent draining the hub (plan M8.1). Published on
  # change only; the browser shows "paused" from it, disables every OK and
  # never runs a pause timer of its own.
  - id: publish_read_pause_reason
    then:
      - lambda: |-
          const char *pause = jk_write_tx::bus_owner_name(jk_write_tx::bus_owner(
              id(g_wtx_in_use), id(g_wtx_status), 6, id(g_cellcount_tx_pending), id(g_topology_recovery_pending),
              id(g_passcode_tx_pending), jk_cluster_runtime::g_write_intent.active));
          if (id(read_pause_reason).state != pause) id(read_pause_reason).publish_state(pause);

  # ---- Pre-write quiescence barrier (plan M8.1) -- the ONLY caller of
  # begin_write_tx, so the only way a Modbus write is ever queued. M8 paused
  # only NEW reads once a write owned the bus; a read the ESPHome hub had
  # already accepted still ran -- in flight before the write frame, or still
  # queued and then sent between the ACK and the forced readback (the
  # WRITE-class frame overtakes a READY read, which then goes before the
  # readback as the oldest READ-class frame). Now a write is first accepted
  # as the one write intent (jk_cluster_runtime::g_write_intent, from the UI
  # request consumer or entity_write_step): bus_owner() reports it at once,
  # so the servicer and both recovery probes issue nothing more. This step
  # (run at acceptance and every 20 ms) queues the write only when
  # jk_write_tx::quiesce_step() is READY -- no other transaction owns the bus
  # AND the hub proves it holds nothing (tx_buffer_empty() && !tx_blocked())
  # -- and only after every precondition passes again at that instant: the
  # request's own checks (registry entry live, BMS LIVE, topology CONFIRMED,
  # same encoding) and recheck_write_intent() (strict raw freshness, same
  # source, same or newer read, same raw, same merged value; no pre-read).
  # The hub check and queue_command() run in this one synchronous lambda, so
  # no read can be queued between them. Bounded: kQuiesceTimeoutMs (3000 ms)
  # after acceptance the intent is refused (BUS_NOT_QUIESCENT) and nothing is
  # queued. Each outcome ends the intent exactly once.
  - id: write_barrier_step
    then:
      - lambda: |-
          auto &in = jk_cluster_runtime::g_write_intent;
          if (!in.active) return;
          const uint32_t now = millis();
          auto *hub = id(bms0)->hub();
          const bool quiet = jk_write_tx::hub_quiescent(hub->tx_buffer_empty(), hub->tx_blocked());
          const auto other = jk_write_tx::bus_owner(id(g_wtx_in_use), id(g_wtx_status), 6, id(g_cellcount_tx_pending),
                                                    id(g_topology_recovery_pending), id(g_passcode_tx_pending), false);
          const auto qs = jk_write_tx::quiesce_step(in.active, in.accepted_ms, now, quiet, other);
          if (qs == jk_write_tx::QuiesceStep::WAIT) return;

          // Terminal from here on: queued once, or refused -- never both, never later.
          const jk_cluster_runtime::WriteIntent intent = in;
          in.active = false;
          const bool ui = intent.source == jk_cluster_runtime::IntentSource::REGISTER_REQUEST;
          jk_write_tx::RejectReason reason = jk_write_tx::RejectReason::NONE;
          if (qs != jk_write_tx::QuiesceStep::READY) {
            reason = jk_write_tx::RejectReason::BUS_NOT_QUIESCENT;
          } else {
            if (ui) {
              const jk_write_registry::Entry *e = intent.registry_index >= 0 ? &jk_write_registry::kEntries[intent.registry_index] : nullptr;
              if (e == nullptr || e->submit_policy != jk_write_registry::SubmitPolicy::LIVE) {
                reason = jk_write_tx::RejectReason::AUTHORIZATION_REQUIRED;
              } else if (id(bms_health).state != "LIVE") {
                reason = jk_write_tx::RejectReason::BMS_NOT_LIVE;
              } else if (id(topology_state).state != "CONFIRMED") {
                reason = jk_write_tx::RejectReason::TOPOLOGY_NOT_CONFIRMED;
              } else {
                const auto enc = jk_write_tx::encode_numeric_field(intent.value, e->is_signed, e->scale, e->offset,
                                                                    e->minimum, e->maximum, e->field_width_bits);
                if (enc.status != jk_write_tx::EncodeStatus::OK || uint32_t(enc.encoded_raw) != intent.write.encoded)
                  reason = jk_write_tx::RejectReason::VALUE_REJECTED;
              }
            }
            if (reason == jk_write_tx::RejectReason::NONE) {
              const auto narrow = jk_cluster_runtime::make_narrow_view(jk_read_plan::kBlocks, jk_read_plan::kBlockCount, intent.write.address,
                                                                       id(g_rp_last_success_ms), id(g_rp_last_raw_word), id(g_rp_pending_index));
              const auto rc = jk_cluster_runtime::recheck_write_intent(jk_cluster_runtime::g_runtime, intent, now, narrow);
              if (rc.step == jk_cluster_runtime::RecheckStep::STALE) {
                reason = rc.reason == jk_cluster_cache::Lookup::UNKNOWN ? jk_write_tx::RejectReason::NO_READ_PLAN_BLOCK
                                                                        : jk_write_tx::RejectReason::STALE_RAW;
              } else if (rc.step == jk_cluster_runtime::RecheckStep::CHANGED) {
                reason = jk_write_tx::RejectReason::RAW_CHANGED;
              }
            }
          }

          if (reason != jk_write_tx::RejectReason::NONE) {
            ESP_LOGW("jk_write_tx", "Write to 0x%04X refused before queueing (%s write, %u ms after acceptance): %s",
                     unsigned(intent.write.address), ui ? "UI" : "entity", unsigned(now - intent.accepted_ms),
                     jk_write_tx::reject_reason_text(reason));
            if (ui) {
              jk_write_tx::publish_write_result(jk_write_tx::g_register_write_result_table,
                                                 jk_write_tx::g_register_write_pending_request_id, intent.request_id,
                                                 false, 0, reason, now);
              jk_diag::mark_write_crash_stage(jk_diag::STAGE_IDLE);
            }
            id(publish_read_pause_reason)->execute();
            return;
          }

          // Single-flight/queued-vs-rejected detection (moved here unchanged
          // from the UI request consumer): jk_write_tx::begin() inside
          // begin_write_tx always bumps g_write_tx_next_id by exactly 1 once
          // reached, whether it accepts (new slot) or rejects (single-flight/
          // all slots busy -- recorded in the rejected-ring buffer).
          // STAGE_TRANSACTION_ALLOCATED and STAGE_MODBUS_COMMAND_QUEUED are
          // set ONLY after real proof (accepted_idx found below) -- see
          // jk_reset_diag_core.h's WriteCrashStage comment.
          const uint32_t next_before = id(g_write_tx_next_id);
          // Exactly the raw the gate decided on (and the recheck confirmed),
          // through begin_write_tx itself -- never begin_write_tx_rmw /
          // write_bms_u16 / write_bms_u32, which would gate a second time.
          id(begin_write_tx)->execute(int(intent.write.address), int(intent.write.word_count), int(intent.merged_raw),
                                      int(intent.write.tx_compare_mask()), 0);
          const uint32_t next_after = id(g_write_tx_next_id);
          id(publish_read_pause_reason)->execute();
          if (!ui) return;

          if (next_after == next_before) {
            jk_write_tx::publish_write_result(jk_write_tx::g_register_write_result_table,
                                               jk_write_tx::g_register_write_pending_request_id, intent.request_id,
                                               false, 0, jk_write_tx::RejectReason::WRITE_NOT_QUEUED, now);
            jk_diag::mark_write_crash_stage(jk_diag::STAGE_IDLE);
            return;
          }

          int accepted_idx = -1;
          for (int i = 0; i < 6; i++) {
            if (id(g_wtx_tx_id)[i] == next_after && id(g_wtx_address)[i] == intent.write.address) { accepted_idx = i; break; }
          }
          if (accepted_idx < 0) {
            jk_write_tx::publish_write_result(jk_write_tx::g_register_write_result_table,
                                               jk_write_tx::g_register_write_pending_request_id, intent.request_id,
                                               false, 0, jk_write_tx::RejectReason::TRANSACTION_UNAVAILABLE, now);
            jk_diag::mark_write_crash_stage(jk_diag::STAGE_IDLE);
            return;
          }

          // PROOF now exists: a real slot was found (TRANSACTION_ALLOCATED)
          // and next_after != next_before means queue_command() genuinely
          // ran without begin() itself rejecting (MODBUS_COMMAND_QUEUED).
          // Deliberately NOT set to STAGE_IDLE on this success path -- the
          // 250ms write-tx tick loop's aggregate check owns advancing the
          // marker to STAGE_TRANSACTION_PENDING and back to STAGE_IDLE.
          jk_diag::mark_write_crash_stage(jk_diag::STAGE_TRANSACTION_ALLOCATED);
          jk_diag::mark_write_crash_stage(jk_diag::STAGE_MODBUS_COMMAND_QUEUED);

          jk_write_tx::publish_write_result(jk_write_tx::g_register_write_result_table,
                                             jk_write_tx::g_register_write_pending_request_id, intent.request_id, true,
                                             next_after, jk_write_tx::RejectReason::NONE, now);

  # Shared Modbus write path for full-width numeric RW registers (HA
  # entities). Clustered-read plan M5 (owner decision 2026-09-29): write only
  # when the value changes. Each call arms one tracked request in the entity
  # pool (jk_cluster_runtime::g_entity_write_requests); entity_write_step
  # compares the encoded value with the register's current raw (strict
  # 3.5 s, one tracked pre-read when stale) and either finishes NO_CHANGE
  # (no Modbus command at all) or hands exactly that value to the generic
  # Write Transaction Manager above (full-register compare, mask=-1), with
  # its real ACK + forced readback.
  - id: write_bms_u32
    parameters:
      address: int
      raw: int
    then:
      - lambda: |-
          jk_cluster_runtime::RmwWrite w;
          w.address = uint16_t(address);
          w.word_count = 2;
          w.encoded = uint32_t(raw);
          w.full_width = true;
          const auto armed = jk_cluster_runtime::arm_write(jk_cluster_runtime::g_entity_write_requests, w, millis());
          if (armed == jk_cluster_runtime::ArmResult::REGISTER_BUSY || armed == jk_cluster_runtime::ArmResult::POOL_FULL)
            ESP_LOGW("jk_write_tx", "Write to 0x%04X rejected -- %s", unsigned(w.address),
                     armed == jk_cluster_runtime::ArmResult::REGISTER_BUSY ? "another write to this register is waiting" : "every write request is busy");
      - script.execute: entity_write_step

  - id: write_bms_u16
    parameters:
      address: int
      raw: int
    then:
      - lambda: |-
          jk_cluster_runtime::RmwWrite w;
          w.address = uint16_t(address);
          w.word_count = 1;
          w.encoded = uint32_t(raw);
          w.full_width = true;
          const auto armed = jk_cluster_runtime::arm_write(jk_cluster_runtime::g_entity_write_requests, w, millis());
          if (armed == jk_cluster_runtime::ArmResult::REGISTER_BUSY || armed == jk_cluster_runtime::ArmResult::POOL_FULL)
            ESP_LOGW("jk_write_tx", "Write to 0x%04X rejected -- %s", unsigned(w.address),
                     armed == jk_cluster_runtime::ArmResult::REGISTER_BUSY ? "another write to this register is waiting" : "every write request is busy");
      - script.execute: entity_write_step

  # Stage 4 (typed-petting-puzzle plan §5 Phase 4): real packed read-modify-
  # write entry point -- used ONLY by fields whose canonical
  # write_uses_read_modify_write is true (packed_siblings and/or narrower
  # than the whole register; see protocol/registers.canonical.json's own
  # field-level comment). Full-width fields keep using write_bms_u32/u16
  # above unchanged (mask=-1, no merge needed, per this project's own "no
  # unnecessary merge" policy for a field that already owns its entire
  # register). `encoded_raw` here is ALREADY the field's own validated,
  # range-checked, scaled raw bit pattern (right-aligned at bit 0, not yet
  # shifted) -- each generated per-field on_value: trigger computes it via
  # jk_write_tx::encode_numeric_field() with ITS OWN compile-time-known
  # scale/offset/range/signedness/width before calling this shared script,
  # so this script itself stays generic over every packed field's geometry
  # (address/word_count/mask/shift only).
  #
  # Sequence (clustered read plan M5): the raw register value comes only
  # through the strict RMW gate (jk_cluster_runtime::RmwRequest ->
  # Runtime::check_rmw: cluster bytes, or in a latched fallback group the
  # register's own narrow block read after the latch, fresher than
  # jk_cluster_cache::kRmwStrictBudgetMs = 3.5 s; never a background budget,
  # never the setup passcode). This script only arms one tracked request in
  # the entity pool (g_entity_write_requests, at most one per register) and
  # takes its first decision in entity_write_step; older or missing bytes
  # make it WAIT for one tracked pre-read, re-decided by the 100 ms interval
  # until queued, NO_CHANGE (the field already holds the value: no Modbus
  # command at all) or rejected for good (refused / kRmwPreReadDeadlineMs).
  # A different write to a register that already has one waiting is refused
  # at once (fail closed). The raw that is queued is the merged raw of the
  # deciding lookup -- nothing re-gates it.
  # freshness_budget_ms is kept for the caller signature only and is not a
  # gate. The hand-off is the EXISTING begin_write_tx (steps 7-9, 14-17:
  # single-flight, ACK/readback, WRITE_UNCERTAIN+recovery, no auto-retry,
  # resume -- reused verbatim, never duplicated).
  - id: begin_write_tx_rmw
    parameters:
      address: int
      word_count: int
      mask: int
      shift: int
      encoded_raw: int
      freshness_budget_ms: int
    then:
      - lambda: |-
          (void) freshness_budget_ms;  // not a gate: the strict RMW gate decides
          jk_cluster_runtime::RmwWrite w;
          w.address = uint16_t(address);
          w.word_count = uint8_t(word_count);
          w.mask = uint32_t(mask);
          w.shift = uint8_t(shift);
          w.encoded = uint32_t(encoded_raw);
          const auto armed = jk_cluster_runtime::arm_write(jk_cluster_runtime::g_entity_write_requests, w, millis());
          if (armed == jk_cluster_runtime::ArmResult::REGISTER_BUSY || armed == jk_cluster_runtime::ArmResult::POOL_FULL)
            ESP_LOGW("jk_write_tx", "RMW write to 0x%04X rejected -- %s", unsigned(w.address),
                     armed == jk_cluster_runtime::ArmResult::REGISTER_BUSY ? "another write to this register is waiting" : "every write request is busy");
      - script.execute: entity_write_step

  # One decision for every tracked HA entity write request
  # (g_entity_write_requests): QUEUE hands exactly that decision to the
  # pre-write quiescence barrier as the one write intent (plan M8.1:
  # write_barrier_step queues it once the hub has drained); NO_CHANGE and
  # REJECT are final and create no Modbus command; WAIT leaves it for the
  # 100 ms interval above. While a write intent drains or any transaction
  # owns the bus, no request is stepped (each keeps its own
  # kRmwPreReadDeadlineMs): writes run one at a time.
  - id: entity_write_step
    then:
      - lambda: |-
          const uint32_t now = millis();
          auto &intent = jk_cluster_runtime::g_write_intent;
          const auto owner = jk_write_tx::bus_owner(id(g_wtx_in_use), id(g_wtx_status), 6, id(g_cellcount_tx_pending),
                                                    id(g_topology_recovery_pending), id(g_passcode_tx_pending), false);
          if (intent.active || owner != jk_write_tx::BusOwner::NONE) return;
          for (auto &req : jk_cluster_runtime::g_entity_write_requests) {
            if (!req.active()) continue;
            const jk_cluster_runtime::RmwWrite w = req.write();
            const auto narrow = jk_cluster_runtime::make_narrow_view(jk_read_plan::kBlocks, jk_read_plan::kBlockCount, w.address,
                                                                     id(g_rp_last_success_ms), id(g_rp_last_raw_word), id(g_rp_pending_index));
            const auto st = req.step(jk_cluster_runtime::g_runtime, now, narrow);
            if (st.step == jk_cluster_runtime::RmwStep::QUEUE) {
              if (!jk_cluster_runtime::accept_write_intent(intent, jk_cluster_runtime::IntentSource::ENTITY, w, st, now, owner)) {
                ESP_LOGW("jk_write_tx", "Write to 0x%04X refused -- another write is draining the bus or owns it", unsigned(w.address));
                continue;
              }
              id(publish_read_pause_reason)->execute();
              id(write_barrier_step)->execute();  // an already idle hub: the write is queued right now
              break;  // one write at a time: the other requests wait for the next step
            } else if (st.step == jk_cluster_runtime::RmwStep::NO_CHANGE) {
              ESP_LOGI("jk_write_tx", "Write to 0x%04X: no change -- the register already holds the value, no Modbus command", unsigned(w.address));
            } else if (st.step == jk_cluster_runtime::RmwStep::REJECT) {
              ESP_LOGW("jk_write_tx", "Write to 0x%04X rejected -- %s raw %s", unsigned(w.address), st.narrow ? "narrow fallback" : "cluster",
                       st.deadline_expired ? "pre-read did not land in time (stale)" : jk_cluster_cache::lookup_name(st.reason));
            }
          }

  # ---- Topology Resolver — the single source of truth for whether
  # CellCount (BMS *configuration*) can be trusted as the pack's actual
  # *physical* topology. Called after every 1s cell-block decode (below),
  # after a CellCount write's forced readback lands, and after the
  # uncertainty-recovery probe succeeds (250ms transaction interval,
  # below) — so it continuously self-heals (covers a reboot mid-mismatch
  # too) rather than only re-evaluating on a write.
  #
  # User-directed rework (2026-09-17): this lambda is now a thin wrapper —
  # the actual decision logic lives in
  # components/jk_topology/jk_topology_core.h's resolve(), a pure function
  # exercised by test/jk_topology/test_jk_topology_core.cpp against 4S/8S/
  # 16S/24S/32S and the transitions between them (one general mechanism
  # driven by whatever `configured` count the device reports, never a
  # fixed set of hardcoded topology sizes — the deployed 16S unit is one
  # hardware test case among the fixture-tested range, not a baseline
  # limitation baked into the mechanism). See that header's own comments
  # for the full up-to-date rule set; kept here only as a short pointer so
  # a reader starting from this YAML file finds it.
  #
  # Inputs: cell_count (configured), cell_connected_mask (CellSta, all 32
  # bits), cell_voltage_1..32 (already-decoded, from the cell-block poll —
  # channels 17-32 read from bytes the SAME 1Hz buffer already fetches, no
  # new Modbus command), total_voltage (BMS's own direct pack measurement
  # — NEVER replaced by a derived sum). Acceptance range for `configured`
  # is now the protocol's own documented channel capacity (1..32, not a
  # fixed 16) — see jk_topology_core.h's PROTOCOL_CHANNEL_CAPACITY. A
  # channel at or beyond the CURRENT candidate `configured` is blanked to
  # NaN in EVERY state (LOADING/WRITE_UNCERTAIN/OFFLINE/INVALID/MISMATCH/
  # CONFIRMED), not only when CONFIRMED — so it never shows raw/residual
  # bytes as a trustworthy active-cell voltage while state is uncertain.
  # cell_resistance_17..32 have no entities at all this batch (not
  # actively polled — CellCount alone never proves that extension
  # read-block is available); the frontend shows an explicit "not read"
  # state for those specific channels' resistance, never hiding the
  # channel itself (its voltage is real and shown normally).
  - id: resolve_topology
    then:
      - lambda: |-
          // Thin wrapper (user-directed rework, 2026-09-17): the actual
          // decision logic now lives entirely in
          // components/jk_topology/jk_topology_core.h's resolve() -- a
          // pure, hardware-independent function, desktop-testable against
          // concrete channel-count scenarios (4S/8S/16S/24S/32S and the
          // transitions between them) without ESP-IDF or real hardware,
          // see test/jk_topology/test_jk_topology_core.cpp. This lambda's
          // only job is gathering real sensor/global state into
          // jk_topology::Inputs, calling resolve(), and applying the
          // jk_topology::Outputs it returns (publish_state calls) — no
          // decision-making of its own.
          jk_topology::Inputs in;
          in.topology_uncertain = id(g_topology_uncertain);
          in.have_cell_data = id(g_last_bms_response_ms) != 0;
          in.comm_elapsed_ms = millis() - id(g_last_bms_response_ms);
          in.configured_f = id(cell_count).state;
          // g_cell_connected_mask_raw/g_cell_connected_mask_valid (Stage 3
          // cell-channel batch, set alongside every decode of this field --
          // the generic 15s poll AND the 2 one-shot topology-driver
          // re-reads, above) instead of id(cell_connected_mask).state, a
          // float that loses precision on the LOW bits too once ANY high
          // bit (e.g. bit31) is set -- float's ULP scales with magnitude,
          // so a high bit being set corrupts exactly the low bits resolve()
          // goes on to test. g_cell_connected_mask_valid is the same
          // "never decoded yet since boot" sentinel isnan() used to
          // provide for free from a float sensor's own
          // NaN-until-first-publish default.
          in.mask_valid = id(g_cell_connected_mask_valid);
          in.mask_raw = id(g_cell_connected_mask_raw);
          in.pack_voltage = id(total_voltage).state;

          esphome::sensor::Sensor *const voltage_sensors[jk_topology::PROTOCOL_CHANNEL_CAPACITY] = {
            id(cell_voltage_1),  id(cell_voltage_2),  id(cell_voltage_3),  id(cell_voltage_4),
            id(cell_voltage_5),  id(cell_voltage_6),  id(cell_voltage_7),  id(cell_voltage_8),
            id(cell_voltage_9),  id(cell_voltage_10), id(cell_voltage_11), id(cell_voltage_12),
            id(cell_voltage_13), id(cell_voltage_14), id(cell_voltage_15), id(cell_voltage_16),
            id(cell_voltage_17), id(cell_voltage_18), id(cell_voltage_19), id(cell_voltage_20),
            id(cell_voltage_21), id(cell_voltage_22), id(cell_voltage_23), id(cell_voltage_24),
            id(cell_voltage_25), id(cell_voltage_26), id(cell_voltage_27), id(cell_voltage_28),
            id(cell_voltage_29), id(cell_voltage_30), id(cell_voltage_31), id(cell_voltage_32)
          };
          // cell_resistance_17..32 (CellWireRes16-31) have NO entities at
          // all this batch (source_only_unimplemented -- not actively
          // polled, see their own register safety_notes): CellCount alone
          // never proves that extension read-block is available, so this
          // resolver must never assume/fabricate resistance data for
          // channels 17-32 -- only 16 real sensors exist to blank/read.
          esphome::sensor::Sensor *const resistance_sensors[jk_topology::RESISTANCE_CHANNEL_COUNT] = {
            id(cell_resistance_1),  id(cell_resistance_2),  id(cell_resistance_3),  id(cell_resistance_4),
            id(cell_resistance_5),  id(cell_resistance_6),  id(cell_resistance_7),  id(cell_resistance_8),
            id(cell_resistance_9),  id(cell_resistance_10), id(cell_resistance_11), id(cell_resistance_12),
            id(cell_resistance_13), id(cell_resistance_14), id(cell_resistance_15), id(cell_resistance_16)
          };
          // RAW (pre-blank) snapshot -- read BEFORE any blanking is
          // applied below, so measured_count (inside resolve()) stays a
          // genuine diagnostic of what the BMS itself still reports on
          // now-unused channels, not an artifact of this same call having
          // already blanked them.
          for (uint8_t i = 0; i < jk_topology::PROTOCOL_CHANNEL_CAPACITY; i++) {
            in.voltage[i] = voltage_sensors[i]->state;
          }

          const jk_topology::Outputs out = jk_topology::resolve(in);

          // g_last_confirmed_cell_count must be updated BEFORE it's
          // published below (a real ordering bug caught during this
          // extraction: publishing first and updating after would lag the
          // sensor one call behind a just-confirmed count, unlike the
          // original inline lambda, which always updated before its own
          // single publish() call).
          if (out.confirmed) id(g_last_confirmed_cell_count) = out.configured;

          id(g_topology_state_code) = out.state_code;
          id(g_topology_reason_code) = out.reason_code;
          id(g_effective_cell_count) = out.effective_cell_count;
          id(g_topology_revision) += 1;
          id(g_topology_last_publish_ms) = millis();
          id(effective_cell_count)->publish_state(float(out.effective_cell_count));
          id(display_cell_count)->publish_state(float(out.display_cell_count));
          id(last_confirmed_cell_count)->publish_state(float(id(g_last_confirmed_cell_count)));
          id(topology_revision)->publish_state(float(id(g_topology_revision)));
          id(topology_state)->publish_state(std::string(jk_topology::STATE_NAMES[out.state_code]));
          id(topology_reason)->publish_state(std::string(jk_topology::REASON_NAMES[out.reason_code]));
          if (out.has_connected_count) id(connected_cell_count)->publish_state(out.connected_count);
          if (out.has_measured_count) id(measured_cell_count)->publish_state(out.measured_count);
          if (out.has_active_sum) id(active_cells_voltage_sum)->publish_state(out.active_sum);

          // Channel-aware blanking, applied AFTER resolve() -- see
          // Outputs::blank_voltage_from/blank_resistance_from's own
          // comment in jk_topology_core.h: covers every state resolve()
          // can return, not only CONFIRMED, so a channel beyond the
          // current candidate CellCount never shows raw/residual bytes as
          // a trustworthy active-cell voltage in ANY state.
          for (uint8_t i = out.blank_voltage_from; i < jk_topology::PROTOCOL_CHANNEL_CAPACITY; i++) {
            voltage_sensors[i]->publish_state(NAN);
          }
          for (uint8_t i = out.blank_resistance_from; i < jk_topology::RESISTANCE_CHANNEL_COUNT; i++) {
            resistance_sensors[i]->publish_state(NAN);
          }

