  # The documented JK-PB Modbus map does not expose the BLE-only charge-stage
  # timer. Publish a deterministic local elapsed value from the BMS charging
  # flag, independent of the installation-specific current sign convention.
  - platform: template
    id: charge_status_time_elapsed
    name: "charge status time elapsed"
    update_interval: 1s
    unit_of_measurement: "s"
    device_class: duration
    state_class: measurement
    accuracy_decimals: 0
    lambda: |-
      static bool was_charging = false;
      static uint32_t started_ms = 0;
      const uint32_t now = millis();
      const bool charging_flag_active = id(charging).state;
      if (!charging_flag_active) {
        was_charging = false;
        started_ms = now;
        return 0.0f;
      }
      if (!was_charging) {
        was_charging = true;
        started_ms = now;
      }
      return float(uint32_t(now - started_ms) / 1000U);

  # V2.1 — the REAL per-phase timer (charge_status_time_elapsed above is a
  # different clock: time since the `charging` output last turned on, which
  # never resets at a Bulk->Absorption transition). g_charge_phase_started_ms
  # is set by charge_status's own lambda (further down) at the exact instant
  # its classified charge_phase changes, so this is genuinely "how long has
  # the pack been in its CURRENT charge phase" (bulk/absorption/float/none)
  # — the Charge Cycle graph's own timer, not the whole charging session and
  # NOT the main operating-state duration (see battery_state_elapsed below).
  - platform: template
    id: charge_phase_elapsed
    name: "charge phase elapsed"
    update_interval: 1s
    unit_of_measurement: "s"
    device_class: duration
    state_class: measurement
    accuracy_decimals: 0
    lambda: |-
      if (id(g_charge_phase_started_ms) == 0) return 0.0f;
      return float(uint32_t(millis() - id(g_charge_phase_started_ms)) / 1000U);

  # V2.2 — the PUBLIC/main-status timer: how long the pack has been in its
  # CURRENT battery_state (idle/charging/discharging/absorption/float/
  # offline), driven by g_battery_state_started_ms (set by charge_status's
  # own resolver whenever battery_state itself changes — a separate clock
  # from charge_phase_elapsed above, since the two concepts now live at
  # different abstraction levels and only coincide while actively charging).
  - platform: template
    id: battery_state_elapsed
    name: "battery state elapsed"
    update_interval: 1s
    unit_of_measurement: "s"
    device_class: duration
    state_class: measurement
    accuracy_decimals: 0
    lambda: |-
      if (id(g_battery_state_started_ms) == 0) return 0.0f;
      return float(uint32_t(millis() - id(g_battery_state_started_ms)) / 1000U);

