  # Diagnostic instrumentation (2026-09-18, user-directed) for the
  # CellConWireRes0-31 read -- does NOT add any new Modbus traffic, new
  # retries, or a separate polling loop; these are pure bookkeeping
  # publishes alongside the EXISTING 300s-cadence read, at the exact same
  # call sites that already run. See the CellConWireRes0-31 interval's own
  # comment (below) for the full reasoning and the framework research this
  # is based on.
  #
  # Diagnostic 1/5: how many attempts have actually been queue_command()'d
  # -- proves the read is being ISSUED (queue_command() only enqueues, it
  # is not itself proof of UART transmission -- this counter answers
  # "issued", nothing stronger).
  - platform: template
    id: cell_connection_wire_resistance_queued_count
    name: "cell connection wire resistance queued count"
    update_interval: never
    accuracy_decimals: 0

  # Diagnostic 2/5: how many times the response callback (on_data_func)
  # has actually fired, for ANY attempt including a late/stale one --
  # independent of attribution to a specific attempt (see queued_count
  # above: comparing these two counts directly shows whether callbacks are
  # firing at all relative to how many attempts were issued).
  - platform: template
    id: cell_connection_wire_resistance_callback_count
    name: "cell connection wire resistance callback count"
    update_interval: never
    accuracy_decimals: 0

  # Diagnostic 3/5: byte length of the LAST callback payload received (any
  # attempt, including stale). Deliberately left UNPUBLISHED until the
  # first real callback fires -- ESPHome's own "never published" sensor
  # state (shown as "--"/unset in this project's UI, the same convention
  # every other not-yet-resolved diagnostic sensor here already uses) is
  # the explicit "unknown", never a fabricated 0.
  - platform: template
    id: cell_connection_wire_resistance_last_response_bytes
    name: "cell connection wire resistance last response bytes"
    update_interval: never
    accuracy_decimals: 0

  # Diagnostic 4/5 (uptime timestamps for the CURRENT attempt's own start/
  # end, generation-gated -- see cell_connection_wire_resistance_last_outcome,
  # declared alongside the capability text_sensors above, for the 5th
  # piece: the attempt's own outcome enum).
  - platform: template
    id: cell_connection_wire_resistance_attempt_started_uptime_s
    name: "cell connection wire resistance attempt started uptime"
    update_interval: never
    unit_of_measurement: "s"
    accuracy_decimals: 3

  - platform: template
    id: cell_connection_wire_resistance_attempt_ended_uptime_s
    name: "cell connection wire resistance attempt ended uptime"
    update_interval: never
    unit_of_measurement: "s"
    accuracy_decimals: 3


  # 0x1290 BatVol UINT32 mV, 0x1294 BatWatt UINT32 mW (never decoded --
  # every power metric is derived from voltage x current instead, see
  # below), 0x1298 BatCurrent INT32 mA. Migrated off this file's own
  # modbus_controller auto-poll onto the scheduler (Final-preparation-plan
  # Stage 1 corrective pass) -- the audited voltage/current/power/sign-
  # convention computation itself is unchanged, ported VERBATIM into
  # components/jk_poll_scheduler/jk_poll_scheduler_core.h's own
  # decode_electrical_metrics() (hand-written, unit-tested against golden
  # byte vectors -- see test/jk_poll_scheduler/test_electrical_metrics_decode.cpp),
  # dispatched from protocol/generated/read_plan.yaml's own scheduler
  # servicer (see that generated file's own comment for the exact
  # generated call site). This file no longer declares a physical read
  # for it at all -- only the 9 downstream, purely-computed display
  # entities below remain (updated via ->update() from that servicer,
  # exactly matching what the removed on_value: automation used to do;
  # total_voltage_raw/current_raw added 2026-09-22, Settings read-value
  # fix, same globals, same callback, no new read).
  - platform: template
    id: total_voltage
    name: "total voltage"
    update_interval: never
    unit_of_measurement: "V"
    device_class: voltage
    state_class: measurement
    accuracy_decimals: 3
    lambda: return id(g_total_voltage_v);

  - platform: template
    id: current
    name: "current"
    update_interval: never
    unit_of_measurement: "A"
    device_class: current
    state_class: measurement
    accuracy_decimals: 3
    lambda: return id(g_current_a);

  # Settings read-value fix (2026-09-22): registers.canonical.json already
  # declared total_voltage_raw/current_raw as implemented, public entities
  # (esphome_read_entity_id: "total_voltage_raw"/"current_raw") -- but no
  # ESPHome entity under those ids was ever actually declared, so their
  # Settings rows could never show a value regardless of routing
  # correctness. These mirror the SAME already-decoded globals as
  # total_voltage/current above (no new Modbus read), published under
  # their own distinct entity ids so they never share a wire route with
  # total_voltage/current's own SSE state.
  - platform: template
    id: total_voltage_raw
    name: "total voltage raw"
    update_interval: never
    unit_of_measurement: "V"
    accuracy_decimals: 3
    lambda: return id(g_total_voltage_v);

  - platform: template
