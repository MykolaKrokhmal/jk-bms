  - platform: template
    id: set_cell_count
    internal: true
    name: "set cell count"
    min_value: 1
    # max_value 32 (user-directed rework, 2026-09-17): the protocol's
    # evidenced channel capacity (CellVol/CellWireRes/CellConWireRes all
    # span index 0-31 in both the official PDF and the V2 workbook), used
    # here only as a sane input-range bound -- NOT a claim that CellCount's
    # own documented valid range is confirmed as 1..32 (it isn't -- see
    # registers.canonical.json's own cell_count safety_notes/maximum:null).
    # Moot either way: set_action below refuses every write unconditionally,
    # regardless of what value this spinner would accept.
    max_value: 32
    step: 1
    lambda: return id(cell_count).state;
    # Reverted to fail-closed (2026-09-10, second critical audit) pending
    # independent write-contract verification (see docs/adr/0001-protocol-
    # catalog.md's sixth-pass addendum): owner_write_override alone is risk
