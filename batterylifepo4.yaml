# Portions of this configuration were derived from syssi/esphome-jk-bms's
# esp32-jk-pb-modbus-example.yaml and have been substantially modified here.
# See THIRD_PARTY_NOTICES.md and LICENSES/Apache-2.0.txt.
#
# Note:
# If you have only 8 cells - comment out "cell voltage 9-16" and "cell 9-16 wire resistance".
# Also adjust values in "cell voltage/wire resistance 8" and "cell voltage/wire resistance 16".
# See details in the comments for these parameters.
# Also you can comment out "cell 9-16 wire resistance" if you don't need this info.
#
#
# Setup: adjust parameters in substitutions section
#
#
# Some configuration details:
#
# JK Modbus protocol is not the same as standard Modbus RTU
# Key difference is response on reading more than one value in one request.
# Example:
# We want to read "Smart sleep" and "Cell UVP" values, their register addresses are 0x1000 and 0x1004.
# Each parameter has length of 4 bytes or 2 registers.
# To read these parameters in one request we send command `01 03 10 00 00 02 <CRC>`
#
# Standard Modbus response: `01 03 0C XX XX XX XX 00 00 00 00 YY YY YY YY <CRC>`
# where XXXXXXXX - "Smart sleep" value and YYYYYYYY - "Cell UVP". So, there's a gap between values.
#
# JK BMS response: `01 03 08 XX XX XX XX YY YY YY YY <CRC>. See - there is no gap between values.
#
# Why it's matters: We want as few requests as possible to reduce communication and processing time.
# Good news: modbus_controller component will do this automatically for us if it detect adjacent entities
# by their address and size and makes ranges that are read in one request.
# Not so good news: because of JK Modbus specifics we have to do some tweaks.
# 1. Explicitly define two settings for a sensor:
#     register_count: 4
#     response_size: 4
# By defining register_count with value double of the actual size (**in registers**) of the sensor we cover gaps in the parameters addresses.
# And by defining response_size to be the actual size (**in bytes**) of the sensor we cover absence of the gaps in the response.
#
# Described optimization applies only to the entities without custom commands and only for the entities of the same type!
# To tackle the second limitation we define binary_sensors as templates and update their values based on the regular sensors,
# while setting `disabled_by_default: true` in the regular sensor definition.

substitutions:
  name: jk-bms
  friendly_name: "JK BMS"
  # User-visible name from the JK mobile application. The JK-PB RS485 map
  # exposes the hardware model at 0x1400, but not the editable BLE name.
  bms_display_name: "LiFePO4-1S16P-00"
  device_description: "Monitor a JK-BMS (JK-PB series) via Modbus"
  tx_pin: GPIO22
  rx_pin: GPIO21
  flow_control_pin: GPIO17
  device_addr: "1"    # NOTE: On change also update the first byte in `switch` custom_command and write_lambda
  modbus_controller_update_interval: "15s"
  bms_control_params_skip_updates: "20"   # 20 - update every 20th update cycle

# Final-preparation-plan Stage 1, commit boundary 3 (§3.1): the generated
# read-plan package -- the SOLE source of every migrated read entity below.
# See protocol/generated/read_plan.yaml (generated by
# tools/protocol/generate_read_plan.js) for the full scope/exclusion
# reasoning. Declares its own globals:/interval: (the scheduler servicer)
# alongside its sensor:/binary_sensor:/text_sensor: entities.
packages:
  register_reads: !include protocol/generated/read_plan.yaml
  # Stage 4 (typed-petting-puzzle plan §5 Phase 3): generated write
  # registry -- one `number:` entity per RW field newly eligible for a
  # real write path this stage (never the original 18 owner-authorized
  # fields, which keep their own existing hand-authored entities below;
  # see generate_write_registry.js's own isEligible() for the exact,
  # non-overlapping gate). Declares only `number:` entities -- no globals:/
  # interval: of its own, since every entity dispatches through the
  # SAME shared scripts (write_bms_u32/u16, begin_write_tx_rmw) already
  # declared by hand further down this file.
  write_registry: !include protocol/generated/write_registry.yaml

esphome:
  name: ${name}
  friendly_name: ${friendly_name}
  comment: ${device_description}
  project:
    name: "syssi.esphome-jk-bms"
    version: 3.0.0
  # Pure, hardware-independent state machine for the generic RW-register
  # write -> ACK -> forced-readback transaction manager (every RW register
  # EXCEPT CellCount, which keeps its own bespoke topology-aware driver
  # below). Desktop-testable — see test/jk_write_tx/test_jk_write_tx_core.cpp.
  includes:
    - components/jk_write_tx/jk_write_tx_core.h
    # Second corrective pass (2026-09-21): main-loop-published atomic
    # snapshots RegisterWritePreflightHandler reads instead of the plain
    # g_rp_*/g_wtx_* globals directly -- see this header's own module
    # comment for the full root-cause writeup.
    - components/jk_write_tx/jk_preflight_snapshot_core.h
    # Final-preparation-plan Stage 1 (§3.2/§3.5): pure, hardware-independent
    # core for the generic block-read scheduler and its physical block
    # cache. Same header-only, zero-I/O pattern as jk_write_tx_core.h
    # above — desktop-testable, see
    # test/jk_poll_scheduler/test_jk_poll_scheduler_core.cpp.
    - components/jk_poll_scheduler/jk_poll_scheduler_core.h
    # Generated DATA (kFields/kBlocks) the scheduler servicer below (inside
    # protocol/generated/read_plan.yaml's own interval:) iterates/dispatches
    # on. #includes jk_poll_scheduler_core.h itself, so the entry above is
    # technically redundant once this one is present -- kept anyway since it
    # independently justifies itself (the active-group HTTP endpoint below
    # uses jk_poll_scheduler_core.h's types directly, with no dependency on
    # generated data). See test/jk_poll_scheduler/test_read_plan_decode.cpp.
    - protocol/generated/read_plan_decode.h
    # Clustered read path (docs/project/RS485_CLUSTERED_READ_MIGRATION_PLAN.md,
    # M2-M5): the generated cluster table, the pure scheduler, raw cluster
    # cache and runtime (fallback latch, strict RMW gate with pre-read,
    # cross-task snapshot). Desktop-tested under test/jk_poll_scheduler/.
    - protocol/generated/read_clusters_table.h
    - components/jk_poll_scheduler/jk_cluster_scheduler_core.h
    - components/jk_poll_scheduler/jk_cluster_cache_core.h
    - components/jk_poll_scheduler/jk_cluster_runtime_core.h
    # User-directed rework (2026-09-17): pure, hardware-independent core
    # for the Topology Resolver's decision logic (resolve_topology, below)
    # -- same header-only, zero-I/O pattern as jk_write_tx_core.h/
    # jk_poll_scheduler_core.h above -- desktop-testable, see
    # test/jk_topology/test_jk_topology_core.cpp.
    - components/jk_topology/jk_topology_core.h
    # Stage 3 bounded batch (2026-09-17): pure, hardware-independent
    # UNKNOWN/SUPPORTED/UNSUPPORTED capability-tracking core for
    # CellWireRes16-31 and CellConWireRes0-31 -- two never-before-read
    # blocks whose actual support on the connected device is independent
    # of topology confirmation (see that header's own module comment) --
    # same header-only, zero-I/O pattern as the components above --
    # desktop-testable, see test/jk_capability/test_jk_capability_core.cpp.
    - components/jk_capability/jk_capability_core.h
    # Stage 4 production-integration gap fix (2026-09-21, user-directed):
    # compiled write-registry lookup table (namespace jk_write_registry,
    # kEntries[]/find_entry_index()) -- generated by
    # tools/protocol/generate_write_registry.js from the same canonical
    # source as write_registry.yaml's per-field `number:` entities, but as
    # a string-key-addressable C++ array the production HTTP handlers
    # below (RegisterWriteHandler/RegisterWritePreflightHandler) can
    # actually look up at runtime -- see that generator's own module
    # comment for why write_registry.json (JSON on flash) is never read by
    # the firmware itself.
    - protocol/generated/write_registry_table.h
    # Reset/crash observability + fail-closed HTTP-task-to-main-loop
    # handoff (2026-09-21, post-reboot hardware-acceptance audit): a
    # real ESP uptime drop from ~1842s to ~18s occurred immediately after
    # a single POST to /settings/register-write, with zero HTTP response
    # bytes ever received. Direct source evidence (fetched and grepped
    # against ESPHome 2026.8.2 / ESP-IDF 5.5.5's own real, pinned source)
    # confirms the PREVIOUS RegisterWriteHandler called
    # begin_write_tx_rmw/queue_command directly from the ESP-IDF httpd
    # server's own FreeRTOS task, which then mutated
    # modbus_controller's unsynchronized one_shot_command_items_
    # std::vector concurrently with the main loop's own use of the SAME
    # vector -- a genuine, evidenced cross-task data race. See this
    # project's own audit report for the full write-up;
    # jk_write_tx_core.h's own "HTTP-task-to-main-loop handoff mailboxes"
    # module comment for the fix; jk_reset_diag_core.h/jk_reset_diag_rtc.h
    # for the new reset-reason/crash-stage diagnostics.
    - components/jk_diag/jk_reset_diag_core.h
    - components/jk_diag/jk_reset_diag_rtc.h
  on_boot:
    priority: -100
    then:
      - lambda: |-
          // Reset/crash observability (2026-09-21, post-reboot hardware-
          // acceptance audit) -- captured FIRST, before anything else in
          // this boot sequence, so a crash-stage marker from a reset that
          // happened mid-write-request is read before any new activity
          // (including a fresh write) could possibly overwrite it.
          // ESP32-only (see jk_reset_diag_rtc.h's own #ifdef USE_ESP32) --
          // this device always builds against esp32:framework:type:esp-idf,
          // so no non-ESP32 fallback path exists or is needed here.
          {
            const auto diag = jk_diag::read_and_reset_boot_diagnostics();
            std::string reason_text = jk_diag::reset_reason_name(diag.reset_reason_code);
            id(reset_reason)->publish_state(reason_text);
            id(reset_count_since_power_on)->publish_state(float(diag.reset_count_since_power_on));
            if (diag.rtc_trustworthy) {
              std::string stage_text = jk_diag::write_crash_stage_name(diag.last_write_crash_stage);
              id(last_write_crash_stage)->publish_state(stage_text);
              if (diag.last_write_crash_stage != jk_diag::STAGE_IDLE) {
                ESP_LOGW("jk_reset_diag", "Reboot reason=%s: a write-registry HTTP request was in flight at stage=%s when this device last reset -- see the diagnostic entities for detail.",
                         reason_text.c_str(), stage_text.c_str());
              }
            } else {
              // Never claim a stage survived a reset type RTC memory
              // cannot be trusted across (POWERON/BROWNOUT/PWR_GLITCH/
              // UNKNOWN) -- explicit, honest "not available" rather than
              // silently showing a stale/garbage value.
              id(last_write_crash_stage)->publish_state(std::string("not available for this reset type"));
            }
          }

          // Single combined endpoint (not one per metric) so the UI does one
          // fetch instead of nine. The buffer is a ring — hist_index is the
          // *next write* slot, so readout starts one past it (oldest sample
          // first) and wraps, giving the client points already in
          // chronological order without it needing to know about the ring.
          //
          // AsyncCallbackWebHandler (ESPAsyncWebServer's Arduino-only
          // shortcut) doesn't exist in ESPHome's ESP-IDF web_server_idf
          // shim — this device builds with esp32: framework: type: esp-idf.
          // Subclassing AsyncWebHandler directly, exactly the way ESPHome's
          // own AsyncEventSource (the /events SSE handler) does it, is the
          // pattern that's actually available here.
          class HistoryHandler : public AsyncWebHandler {
           public:
            bool canHandle(AsyncWebServerRequest *request) const override {
              if (request->method() != HTTP_GET) return false;
              char url_buf[AsyncWebServerRequest::URL_BUF_SIZE];
              return request->url_to(url_buf) == "/history.json";
            }
            void handleRequest(AsyncWebServerRequest *request) override {
              auto append_series = [](std::string &out, const char *key, float *buf) {
                out += "\"";
                out += key;
                out += "\":[";
                const int count = id(hist_count);
                const int start = count < 60 ? 0 : id(hist_index);
                char num[16];
                for (int i = 0; i < count; i++) {
                  const int idx = (start + i) % 60;
                  if (i > 0) out += ",";
                  if (isnan(buf[idx])) {
                    out += "null";
                  } else {
                    snprintf(num, sizeof(num), "%.3f", buf[idx]);
                    out += num;
                  }
                }
                out += "]";
              };
              std::string json;
              json.reserve(4096);
              json += "{\"interval_s\":30,";
              append_series(json, "voltage", id(hist_voltage));
              json += ",";
              append_series(json, "current", id(hist_current));
              json += ",";
              append_series(json, "power", id(hist_power));
              json += ",";
              append_series(json, "balance", id(hist_balance));
              json += ",";
              append_series(json, "mosfet_temp", id(hist_mosfet_temp));
              json += ",";
              append_series(json, "temp1", id(hist_temp1));
              json += ",";
              append_series(json, "temp2", id(hist_temp2));
              json += ",";
              append_series(json, "temp4", id(hist_temp4));
              json += ",";
              append_series(json, "temp5", id(hist_temp5));
              json += "}";
              request->send(200, "application/json", json.c_str());
            }
          };
          id(web_server_base_id)->add_handler(new HistoryHandler());

          // Real 60-hour Charge Cycle history, replacing the old synthetic
          // reference-profile curve. 6-hour windows (360 x 60s samples),
          // offset 0 = most recent, addressed by URL PATH SEGMENT
          // (/charge_history.json/<offset>) rather than a query string:
          // the AsyncWebServerRequest shim this device actually builds
          // against (web_server_idf.h, verified for HistoryHandler above)
          // only confirms url_to()/method()/send() — no getParam()-style
          // query API — so path-segment matching via plain string equality
          // (the one operation already proven to compile here) is what's
          // actually available, not a guessed convenience.
          class ChargeHistoryHandler : public AsyncWebHandler {
           public:
            // A local class (defined inside this on_boot lambda) may not
            // have static DATA members ([class.local]p1 — GCC only
            // accepts it under -fpermissive, which this build doesn't
            // enable, hence a real "shall not have static data member"
            // compile error). An enum sidesteps this entirely: an
            // enumerator isn't a data member, has no address/linkage
            // question, and implicitly converts to int everywhere these
            // were already used as plain values (array bounds, index
            // math, std::to_string(kWindow)) — a drop-in replacement.
            enum { kWindow = 360, kCapacity = 3600, kMaxOffset = 9 };

            bool matchOffset(AsyncWebServerRequest *request, int *offset_out) const {
              char url_buf[AsyncWebServerRequest::URL_BUF_SIZE];
              auto url = request->url_to(url_buf);
              if (url == "/charge_history.json") { *offset_out = 0; return true; }
              char candidate[40];
              for (int i = 0; i <= kMaxOffset; i++) {
                snprintf(candidate, sizeof(candidate), "/charge_history.json/%d", i);
                if (url == candidate) { *offset_out = i; return true; }
              }
              return false;
            }

            bool canHandle(AsyncWebServerRequest *request) const override {
              if (request->method() != HTTP_GET) return false;
              int offset = 0;
              return matchOffset(request, &offset);
            }

            void handleRequest(AsyncWebServerRequest *request) override {
              int offset = 0;
              matchOffset(request, &offset);

              const int count = id(cc_hist_count);
              const int ring_start = count < kCapacity ? 0 : id(cc_hist_index);
              const int windows_available = count > 0 ? (count + kWindow - 1) / kWindow : 0;
              // Chronological position of the newest sample in THIS window
              // (0 = oldest sample ever stored, count-1 = newest overall).
              int window_end_p = count - 1 - offset * kWindow;
              int window_start_p = window_end_p - (kWindow - 1);
              if (window_start_p < 0) window_start_p = 0;
              const bool any = count > 0 && window_end_p >= 0;

              std::string json;
              // Worst-case size, actually counted (not guessed) from this
              // handler's own concatenation below: fixed fields (~92B,
              // generous 4/2/1-digit headroom on count/windows/offset) +
              // 360 voltage/current samples at "-327.67" (int16 centivolt/
              // centiamp range, 7B) + 360 soc samples at worst-case "null"
              // (4B, longer than any real 0-100 value) + 360 stage digits
              // (1B) + separators = 8,414 bytes. 10240 (10 KiB) gives ~22%
              // headroom above that — enough that the normal (non-null,
              // non-negative) path never reallocates, without reserving
              // for a size that can't actually occur.
              json.reserve(10240);
              char num[16];
              json += "{\"interval_s\":60,\"window_samples\":";
              json += std::to_string(kWindow);
              json += ",\"total_samples\":";
              json += std::to_string(count);
              json += ",\"windows_available\":";
              json += std::to_string(windows_available);
              json += ",\"offset\":";
              json += std::to_string(offset);

              json += ",\"voltage\":[";
              if (any) {
                for (int p = window_start_p; p <= window_end_p; p++) {
                  const int idx = (ring_start + p) % kCapacity;
                  if (p > window_start_p) json += ",";
                  const int16_t cv = id(cc_hist_voltage_cv)[idx];
                  if (cv == INT16_MIN) { json += "null"; }
                  else { snprintf(num, sizeof(num), "%.2f", cv / 100.0f); json += num; }
                }
              }
              json += "],\"current\":[";
              if (any) {
                for (int p = window_start_p; p <= window_end_p; p++) {
                  const int idx = (ring_start + p) % kCapacity;
                  if (p > window_start_p) json += ",";
                  const int16_t ca = id(cc_hist_current_ca)[idx];
                  if (ca == INT16_MIN) { json += "null"; }
                  else { snprintf(num, sizeof(num), "%.2f", ca / 100.0f); json += num; }
                }
              }
              json += "],\"soc\":[";
              if (any) {
                for (int p = window_start_p; p <= window_end_p; p++) {
                  const int idx = (ring_start + p) % kCapacity;
                  if (p > window_start_p) json += ",";
                  const uint8_t sc = id(cc_hist_soc)[idx];
                  if (sc == 255) { json += "null"; }
                  else { json += std::to_string(sc); }
                }
              }
              json += "],\"stage\":[";
              if (any) {
                for (int p = window_start_p; p <= window_end_p; p++) {
                  const int idx = (ring_start + p) % kCapacity;
                  if (p > window_start_p) json += ",";
                  json += std::to_string(id(cc_hist_stage)[idx]);
                }
              }
              json += "]}";
              request->send(200, "application/json", json.c_str());
            }
          };
          id(web_server_base_id)->add_handler(new ChargeHistoryHandler());

          // Final-preparation-plan Stage 1, commit boundary 2 (§3.4),
          // corrected against the project's real pinned ESPHome target
          // (2026.8.2, confirmed installable and compiled against this
          // session's corrective pass — an earlier draft of this comment
          // wrongly asserted only an older, unrelated release could be
          // reached, and separately mischaracterized this version's own
          // POST body handling; both fixed here): local scheduling hint
          // only — this NEVER touches the Modbus bus and NEVER calls
          // jk_write_tx. It is a same-origin POST handler on the
          // already-authenticated web_server_base (every handler added
          // through it is wrapped in AuthMiddlewareHandler whenever
          // web_server: auth: credentials are set — see that section's
          // own comment — exactly like HistoryHandler/ChargeHistoryHandler
          // above). Body is application/x-www-form-urlencoded (`group=5`
          // or `group=none`), not JSON: confirmed directly against the
          // real ESPHome 2026.8.2 source
          // (esphome/components/web_server_idf/web_server_idf.cpp,
          // request_post_handler) that this is the simplest content type
          // this handler can accept without implementing its own
          // handleBody() override -- any OTHER Content-Type (JSON
          // included) is still deliverable to a handler in this version,
          // just via that separate, raw handleBody() path this handler
          // does not implement, since form-urlencoded already satisfies
          // the plan's own prose ("Body: {group: 1..12 | \"none\"}")
          // without needing it.
          //
          // Active Settings lease (clustered-read plan M7, section 8): every
          // valid POST renews ONE global lease (jk_cluster_runtime::
          // g_settings_lease, atomics only -- this runs on the httpd task),
          // with a fixed TTL and no per-client registry, so any number of
          // clients or renewals yields the same lease and never multiplies
          // the C1/C2 cadence. "none" releases it. Nothing renews it ->
          // it expires by itself (a hidden page, disconnect or reboot).
          // The servicer reads it on its next pass; this handler never
          // touches Modbus. The group number is validated for wire
          // compatibility only; any valid group means "Settings visible".
          class ActiveGroupHandler : public AsyncWebHandler {
           public:
            bool canHandle(AsyncWebServerRequest *request) const override {
              if (request->method() != HTTP_POST) return false;
              char url_buf[AsyncWebServerRequest::URL_BUF_SIZE];
              return request->url_to(url_buf) == "/settings/active-group";
            }
            void handleRequest(AsyncWebServerRequest *request) override {
              // Stage 1 hardware acceptance corrective pass: a minimum
              // interval between accepted requests -- well under the
              // plan's own 250ms browser-side debounce (§3.4), so normal
              // debounced traffic is never rejected, but a misbehaving or
              // scripted client cannot flood this handler at high
              // frequency. Checked before parsing, so a rejected request
              // never renews or releases the Settings lease either way.
              const uint32_t now = millis();
              const uint32_t last = id(g_active_group_last_request_ms);
              if (last != 0 && now - last < 100U) {
                // Real hardware acceptance retest (post-dd2a4b6) found this
                // request->send(429, ...) actually delivered on the wire as
                // HTTP 500, confirmed 2/2 -- traced to ESPHome's own bundled
                // web_server_idf.cpp: AsyncWebServerRequest::init_response_()
                // only has explicit cases for {200,204,400,401,404,409,422}
                // and silently falls through to HTTPD_500 for any other
                // code, 429 included (its own comment: "default to 500 for
                // unknown codes") -- confirmed directly against the real
                // ESPHome 2026.8.2 package source, not assumed. ESP-IDF
                // 5.5.5's esp_http_server.h has no HTTPD_429 macro either,
                // but httpd_resp_set_status() accepts any literal status
                // string -- exactly how this same vendor file's own
                // AsyncWebServerRequest::redirect() already sends "302
                // Found" (also uncovered by that switch) by calling
                // httpd_resp_set_status()/httpd_resp_send() directly on the
                // request's public `operator httpd_req_t*()` conversion,
                // bypassing send()'s fixed-code path. Mirrored here rather
                // than patching the vendor file or adding a case to its
                // switch.
                const char *body = "{\"ok\":false,\"error\":\"rate limited\"}";
                httpd_resp_set_status(*request, "429 Too Many Requests");
                httpd_resp_set_type(*request, "application/json");
                httpd_resp_set_hdr(*request, "Accept-Ranges", "none");
                httpd_resp_send(*request, body, HTTPD_RESP_USE_STRLEN);
                return;
              }
              id(g_active_group_last_request_ms) = now;
              const std::string raw = request->arg("group");
              if (raw == "none") {
                jk_cluster_runtime::release_settings_lease(jk_cluster_runtime::g_settings_lease);
                request->send(200, "application/json", "{\"ok\":true,\"group\":\"none\",\"lease\":false}");
                return;
              }
              // Strict-integer parse (no partial/garbage suffix accepted)
              // -- a malformed value is a 400, never silently coerced to
              // some default.
              if (raw.empty()) {
                request->send(400, "application/json", "{\"ok\":false,\"error\":\"missing group\"}");
                return;
              }
              char *end = nullptr;
              const long parsed = std::strtol(raw.c_str(), &end, 10);
              if (end == raw.c_str() || *end != '\0' || parsed < 1 || parsed > 12) {
                request->send(400, "application/json", "{\"ok\":false,\"error\":\"group must be 1-12 or 'none'\"}");
                return;
              }
              jk_cluster_runtime::renew_settings_lease(jk_cluster_runtime::g_settings_lease, millis());
              char body[80];
              snprintf(body, sizeof(body), "{\"ok\":true,\"group\":%ld,\"lease\":true,\"ttl_ms\":%u}", parsed,
                       unsigned(jk_cluster_runtime::kSettingsLeaseTtlMs));
              request->send(200, "application/json", body);
            }
          };
          id(web_server_base_id)->add_handler(new ActiveGroupHandler());

          // Stage 4 production-integration gap fix (2026-09-21, user-
          // directed), REARCHITECTED 2026-09-21 (post-reboot hardware-
          // acceptance audit): the actual production write endpoint.
          // Every generated write-registry `number:` entity
          // (write_registry.yaml) is `internal: true` by design -- which
          // means ESPHome's generic `/number/<id>/set` REST route cannot
          // reach any of them, and until now nothing else could either.
          //
          // FAIL-CLOSED REARCHITECTURE (real, evidenced cross-task hazard
          // found via a real device reboot immediately following a single
          // write POST -- see jk_write_tx_core.h's own "HTTP-task-to-
          // main-loop handoff mailboxes" module comment for the full,
          // source-cited root-cause writeup): this handler used to call
          // begin_write_tx_rmw/write_bms_u32/write_bms_u16 (which reach
          // modbus_controller::queue_command(), confirmed unsynchronized
          // against the main loop's own use of the same command vector)
          // DIRECTLY from handleRequest() -- which real, cited ESPHome/
          // ESP-IDF source confirms runs on the httpd server's own
          // FreeRTOS task, never the main loop. It no longer does. This
          // handler now does ONLY safe, task-local work: rate limiting
          // (a coarse, tolerant-of-a-torn-read timestamp comparison),
          // parsing, a constexpr table lookup, and a PURE encode/range
          // check (no shared mutable state) -- then atomically stages the
          // validated intent into jk_write_tx::g_register_write_request_
          // mailbox (safe from any task) and returns an HONEST
          // "accepted, here is a request_id" response. It NEVER returns a
          // tx_id (a real transaction does not exist yet -- see the new
          // GET .../status endpoint below) and NEVER itself calls
          // begin_write_tx_rmw/write_bms_u32/write_bms_u16/queue_command/
          // publish_state or any other ESPHome/Modbus component method --
          // only the new main-loop `interval:` consumer below does that,
          // where it is safe, and where it independently RE-validates
          // everything this handler already checked (registry key,
          // submit_policy, value encoding/range, freshness/geometry,
          // topology/health, single-flight, generation) rather than
          // trusting this handler's own now-possibly-stale judgment.
          //
          // Body: application/x-www-form-urlencoded (same content-type
          // decision as ActiveGroupHandler above, confirmed against the
          // real, pinned ESPHome 2026.8.2 web_server_idf.cpp this project
          // builds against): key=<registry key>, value=<decoded numeric
          // value>, submit_policy=live (a literal, required client
          // acknowledgement -- separate from, and in addition to, the
          // registry's own compiled submit_policy check below; this
          // project accepts nothing but an explicit "live" here, exactly
          // the plan's own "accepts only submit_policy=live" requirement).
          class RegisterWriteHandler : public AsyncWebHandler {
           public:
            bool canHandle(AsyncWebServerRequest *request) const override {
              if (request->method() != HTTP_POST) return false;
              char url_buf[AsyncWebServerRequest::URL_BUF_SIZE];
              return request->url_to(url_buf) == "/settings/register-write";
            }
            void handleRequest(AsyncWebServerRequest *request) override {
              jk_diag::mark_write_crash_stage(jk_diag::STAGE_HANDLER_ENTERED);

              const uint32_t now = millis();
              const uint32_t last = id(g_register_write_last_request_ms);
              if (last != 0 && now - last < 100U) {
                const char *body = "{\"ok\":false,\"error\":\"rate limited\"}";
                httpd_resp_set_status(*request, "429 Too Many Requests");
                httpd_resp_set_type(*request, "application/json");
                httpd_resp_set_hdr(*request, "Accept-Ranges", "none");
                httpd_resp_send(*request, body, HTTPD_RESP_USE_STRLEN);
                jk_diag::mark_write_crash_stage(jk_diag::STAGE_IDLE);
                return;
              }
              id(g_register_write_last_request_ms) = now;

              const std::string key = request->arg("key");
              const std::string value_raw = request->arg("value");
              const std::string submit_policy_arg = request->arg("submit_policy");

              if (key.empty()) {
                request->send(400, "application/json", "{\"ok\":false,\"error\":\"missing key\"}");
                jk_diag::mark_write_crash_stage(jk_diag::STAGE_IDLE);
                return;
              }
              if (submit_policy_arg != "live") {
                request->send(400, "application/json", "{\"ok\":false,\"error\":\"submit_policy must be 'live'\"}");
                jk_diag::mark_write_crash_stage(jk_diag::STAGE_IDLE);
                return;
              }
              if (value_raw.empty()) {
                request->send(400, "application/json", "{\"ok\":false,\"error\":\"missing value\"}");
                jk_diag::mark_write_crash_stage(jk_diag::STAGE_IDLE);
                return;
              }
              char *value_end = nullptr;
              const double value = std::strtod(value_raw.c_str(), &value_end);
              if (value_end == value_raw.c_str() || *value_end != '\0' || !std::isfinite(value)) {
                request->send(400, "application/json", "{\"ok\":false,\"error\":\"value must be a finite number\"}");
                jk_diag::mark_write_crash_stage(jk_diag::STAGE_IDLE);
                return;
              }

              const int idx = jk_write_registry::find_entry_index(key.c_str());
              if (idx < 0) {
                request->send(404, "application/json", "{\"ok\":false,\"error\":\"unknown key\"}");
                jk_diag::mark_write_crash_stage(jk_diag::STAGE_IDLE);
                return;
              }
              const auto &e = jk_write_registry::kEntries[idx];

              if (e.submit_policy != jk_write_registry::SubmitPolicy::LIVE) {
                char body[192];
                snprintf(body, sizeof(body),
                         "{\"ok\":false,\"error\":\"authorization_required\",\"write_safety_class\":\"%s\"}",
                         e.write_safety_class);
                httpd_resp_set_status(*request, "403 Forbidden");
                httpd_resp_set_type(*request, "application/json");
                httpd_resp_set_hdr(*request, "Accept-Ranges", "none");
                httpd_resp_send(*request, body, HTTPD_RESP_USE_STRLEN);
                jk_diag::mark_write_crash_stage(jk_diag::STAGE_IDLE);
                return;
              }

              // Pure function, no shared/component state touched -- safe
              // on any task. A failure here means the mailbox is never
              // even offered a request (no point burning the single-
              // flight slot on a value that could never succeed); the
              // main-loop consumer redoes this SAME check anyway, since a
              // client could theoretically race a preflight/POST against
              // itself with different values.
              const auto enc = jk_write_tx::encode_numeric_field(value, e.is_signed, e.scale, e.offset,
                                                                   e.minimum, e.maximum, e.field_width_bits);
              if (enc.status != jk_write_tx::EncodeStatus::OK) {
                char body[128];
                snprintf(body, sizeof(body), "{\"ok\":false,\"error\":\"encode_rejected\",\"status\":%d}", int(enc.status));
                request->send(400, "application/json", body);
                jk_diag::mark_write_crash_stage(jk_diag::STAGE_IDLE);
                return;
              }

              jk_diag::mark_write_crash_stage(jk_diag::STAGE_VALIDATION_COMPLETE);

              // Atomic, lock-free, safe from any task -- see
              // jk_write_tx_core.h's own module comment. Rejects
              // (request_id==0) if a request is already staged/being
              // consumed -- single-flight at the mailbox itself, on top
              // of (not a replacement for) the main-loop consumer's own
              // jk_write_tx::begin() single-flight check on the real
              // transaction slots.
              const uint32_t request_id = jk_write_tx::try_stage_write_request(
                  jk_write_tx::g_register_write_request_mailbox, key.c_str(), value, now,
                  jk_write_tx::g_register_write_next_request_id, jk_write_tx::g_register_write_pending_request_id);
              if (request_id == 0) {
                request->send(409, "application/json",
                               "{\"ok\":false,\"error\":\"pending\",\"reason\":\"a write request is already staged and "
                               "not yet consumed by the main loop\"}");
                jk_diag::mark_write_crash_stage(jk_diag::STAGE_IDLE);
                return;
              }
              jk_diag::mark_write_crash_stage(jk_diag::STAGE_HANDOFF_QUEUED);

              // Honest accepted/request_id contract -- NEVER a tx_id
              // here: the real jk_write_tx transaction does not exist
              // yet. The client must poll GET .../status?request_id=N
              // (below) until the main-loop consumer resolves it, then
              // switch to the existing write_tx_snapshot-based
              // correlation using the real tx_id it receives from there.
              char body[128];
              snprintf(body, sizeof(body), "{\"ok\":true,\"status\":\"accepted\",\"key\":\"%s\",\"request_id\":%u}",
                       key.c_str(), unsigned(request_id));
              request->send(200, "application/json", body);
              // Deliberately NOT reset to STAGE_IDLE here -- the marker
              // must keep reading HANDOFF_QUEUED until the main-loop
              // consumer itself advances it, so a reboot between this
              // response and the main loop ever consuming the mailbox is
              // still visible next boot as "handed off but never
              // consumed."
            }
          };
          id(web_server_base_id)->add_handler(new RegisterWriteHandler());

          // GET status poll for the accepted/request_id contract above.
          // Read-only, safe from any task (jk_write_tx::try_read_write_
          // result() is lock-free and never blocks). Never queues
          // anything, never mutates any BMS/transaction state.
          class RegisterWriteStatusHandler : public AsyncWebHandler {
           public:
            bool canHandle(AsyncWebServerRequest *request) const override {
              if (request->method() != HTTP_GET) return false;
              char url_buf[AsyncWebServerRequest::URL_BUF_SIZE];
              return request->url_to(url_buf) == "/settings/register-write/status";
            }
            void handleRequest(AsyncWebServerRequest *request) override {
              const std::string request_id_raw = request->arg("request_id");
              char *end = nullptr;
              const unsigned long requested_id = std::strtoul(request_id_raw.c_str(), &end, 10);
              if (request_id_raw.empty() || end == request_id_raw.c_str() || *end != '\0' || requested_id == 0) {
                request->send(400, "application/json", "{\"resolved\":false,\"error\":\"missing or invalid request_id\"}");
                return;
              }
              const uint32_t now = millis();
              // Bounded, request_id-keyed result table (2026-09-21, second
              // corrective pass -- see jk_write_tx_core.h's own module
              // comment for why the previous single-slot mailbox was a
              // genuine C++ data race, not merely a design smell). This
              // handler's JSON `status` field is the frontend contract:
              // "pending" (still staged/being processed -- keep polling),
              // "accepted" (a real tx_id now exists -- switch to tx_id-
              // based snapshot correlation), "rejected" (main-loop
              // consumer refused it -- real reason string, terminal),
              // "expired" (was resolved, but this poll arrived after the
              // result's TTL -- terminal, outcome unknown to the client),
              // "unknown" (this request_id was never issued this boot, or
              // its result-table slot was since reused by other requests
              // before this client ever polled it -- terminal, fail-
              // closed, never presented as if still pending).
              const auto lookup = jk_write_tx::lookup_write_result(
                  jk_write_tx::g_register_write_result_table, jk_write_tx::g_register_write_pending_request_id,
                  uint32_t(requested_id), now);
              std::string json;
              json.reserve(192);
              switch (lookup.status) {
                case jk_write_tx::ResultLookupStatus::PENDING:
                  json += "{\"status\":\"pending\",\"request_id\":"; json += std::to_string(requested_id); json += "}";
                  break;
                case jk_write_tx::ResultLookupStatus::RESOLVED:
                  if (lookup.accepted) {
                    json += "{\"status\":\"accepted\",\"request_id\":"; json += std::to_string(requested_id);
                    json += ",\"tx_id\":"; json += std::to_string(lookup.tx_id); json += "}";
                  } else if (lookup.reason == jk_write_tx::RejectReason::NO_CHANGE) {
                    // Terminal and NOT a failure: the register already held
                    // the value, so no Modbus command was ever created.
                    json += "{\"status\":\"no_change\",\"request_id\":"; json += std::to_string(requested_id); json += "}";
                  } else {
                    json += "{\"status\":\"rejected\",\"request_id\":"; json += std::to_string(requested_id);
                    json += ",\"reason\":\"";
                    for (const char *p = jk_write_tx::reject_reason_text(lookup.reason); *p != '\0'; ++p) {
                      if (*p == '"' || *p == '\\') json += '\\';
                      json += *p;
                    }
                    json += "\"}";
                  }
                  break;
                case jk_write_tx::ResultLookupStatus::EXPIRED:
                  json += "{\"status\":\"expired\",\"request_id\":"; json += std::to_string(requested_id); json += "}";
                  break;
                case jk_write_tx::ResultLookupStatus::UNKNOWN:
                default:
                  json += "{\"status\":\"unknown\",\"request_id\":"; json += std::to_string(requested_id); json += "}";
                  break;
              }
              request->send(200, "application/json", json.c_str());
            }
          };
          id(web_server_base_id)->add_handler(new RegisterWriteStatusHandler());

          // Stage 4 production-integration gap fix (2026-09-21, user-
          // directed): read-only preflight, sharing this handler's own
          // encode/merge code path with RegisterWriteHandler above (both
          // call jk_write_tx::encode_numeric_field/merge_field_into_raw
          // directly -- neither reimplements the other). NEVER queues a
          // Modbus command and NEVER mutates any BMS/transaction state --
          // it only reads the SAME physical block cache
          // (g_rp_last_raw_word/g_rp_last_success_ms, keyed via
          // jk_poll_scheduler::find_block_index_for_address, exactly like
          // begin_write_tx_rmw itself) that a real write would read, and
          // reports what a real write would do without doing it. A client
          // must still expect the real POST to reject even after a ready
          // preflight -- this is advisory, never a lock (see
          // RegisterWriteHandler's own "re-check RAW immediately before
          // queueing" comment).
          //
          // Query string, NOT a request body (GET): confirmed directly
          // against the real, pinned ESPHome 2026.8.2 web_server_idf.cpp
          // this project builds against -- AsyncWebServerRequest::arg()/
          // hasArg() both search the URL query string via
          // find_query_value_()/search_query_sources() (verified in the
          // vendored source itself, not assumed): /settings/register-write
          // /preflight?key=<registry key>&value=<candidate decoded value>.
          class RegisterWritePreflightHandler : public AsyncWebHandler {
           public:
            bool canHandle(AsyncWebServerRequest *request) const override {
              if (request->method() != HTTP_GET) return false;
              char url_buf[AsyncWebServerRequest::URL_BUF_SIZE];
              return request->url_to(url_buf) == "/settings/register-write/preflight";
            }
            void handleRequest(AsyncWebServerRequest *request) override {
              const std::string key = request->arg("key");
              const std::string value_raw = request->arg("value");
              if (key.empty()) {
                request->send(400, "application/json", "{\"ready\":false,\"reject_reason\":\"missing key\"}");
                return;
              }
              const int idx = jk_write_registry::find_entry_index(key.c_str());
              if (idx < 0) {
                request->send(404, "application/json", "{\"ready\":false,\"reject_reason\":\"unknown key\"}");
                return;
              }
              const auto &e = jk_write_registry::kEntries[idx];
              const bool is_credential = std::strcmp(e.write_safety_class, "credential") == 0;
              const char *policy_str =
                  e.submit_policy == jk_write_registry::SubmitPolicy::LIVE ? "live" : "authorization_required";

              // Width-aware register-container semantics (2026-09-21
              // hardware-acceptance corrective pass -- see
              // jk_write_tx_core.h's own module comment on this section
              // for the full root-cause writeup): every generic write-
              // registry entry's mask/preservation_mask must be bounded
              // to the register's REAL physical width (word_count=1 -> a
              // real 16-bit Modbus holding register, word_count=2 -> a
              // real 32-bit pair) -- never the unbounded 32-bit
              // container a raw `~mask` implicitly assumed before this
              // pass, which is what produced a nonsensical, truncated
              // "0xFFFFF" for a genuinely 16-bit register's preservation
              // mask on real hardware.
              const auto width = jk_write_tx::container_mask_for_word_count(e.word_count);
              const auto geom = width.status == jk_write_tx::ContainerWidthStatus::OK
                                     ? jk_write_tx::validate_field_geometry(e.mask, e.shift, width.container_mask)
                                     : jk_write_tx::FieldGeometryResult{};
              const bool geometry_ok =
                  width.status == jk_write_tx::ContainerWidthStatus::OK && geom.status == jk_write_tx::FieldGeometryStatus::OK;

              // Second corrective pass (2026-09-21): reads ONLY the main-
              // loop-published atomic snapshot (jk_preflight_snapshot_core.h),
              // never id(g_rp_last_success_ms)/id(g_rp_last_raw_word)/
              // id(g_rp_revision) directly -- those are plain, non-atomic
              // globals the main loop owns; reading them straight from this
              // httpd-task handler was a genuine C++ data race (see that
              // header's own module comment for the full writeup).
              const int block_idx = jk_poll_scheduler::find_block_index_for_address(jk_read_plan::kBlocks, e.address);
              const uint32_t now = millis();
              uint32_t last_success = 0;
              uint32_t old_raw = 0;
              uint32_t generation = 0;
              bool fresh = false;
              if (block_idx >= 0) {
                const auto snap = jk_write_tx::read_read_plan_block_snapshot(
                    jk_write_tx::g_read_plan_block_snapshot_table, size_t(block_idx));
                // An invalid snapshot (out of bounds, or every retry
                // observed a torn read under extreme contention) fails
                // closed to "not fresh", never to a fabricated zero
                // treated as real data.
                if (snap.valid) {
                  last_success = snap.last_success_ms;
                  old_raw = snap.last_raw_word;
                  generation = snap.revision;
                  fresh = jk_write_tx::raw_is_fresh(last_success, now, e.freshness_budget_ms);
                }
              }
              const uint32_t raw_age_ms = (block_idx >= 0 && last_success != 0 && now >= last_success)
                                               ? (now - last_success) : 0xFFFFFFFFu;

              bool has_value = !value_raw.empty();
              jk_write_tx::EncodeResult enc;
              if (has_value) {
                char *value_end = nullptr;
                const double value = std::strtod(value_raw.c_str(), &value_end);
                if (value_end == value_raw.c_str() || *value_end != '\0' || !std::isfinite(value)) {
                  has_value = false;
                } else {
                  enc = jk_write_tx::encode_numeric_field(value, e.is_signed, e.scale, e.offset, e.minimum,
                                                            e.maximum, e.field_width_bits);
                }
              }

              std::string reject_reason;
              // Geometry is a structural property of the registry entry
              // itself (never request-dependent) -- checked first, fail
              // closed, before any of the request/freshness-specific
              // reasons below even matter.
              if (width.status != jk_write_tx::ContainerWidthStatus::OK) reject_reason = "unsupported word_count";
              else if (geom.status == jk_write_tx::FieldGeometryStatus::ZERO_MASK) reject_reason = "invalid field mask (zero)";
              else if (geom.status == jk_write_tx::FieldGeometryStatus::MASK_EXCEEDS_CONTAINER) reject_reason = "field mask exceeds register width";
              else if (geom.status == jk_write_tx::FieldGeometryStatus::SHIFT_MASK_MISMATCH) reject_reason = "shift inconsistent with field mask";
              else if (block_idx < 0) reject_reason = "no read-plan block for this register";
              else if (!fresh) reject_reason = "raw snapshot unavailable or stale";
              else if (!has_value) reject_reason = "value missing or not a finite number";
              else if (enc.status != jk_write_tx::EncodeStatus::OK) reject_reason = "value rejected by encode/range check";
              else if (e.submit_policy != jk_write_registry::SubmitPolicy::LIVE) reject_reason = "authorization_required";

              // Same corrective pass: reads ONLY the main-loop-published
              // atomic snapshot table, never id(g_wtx_in_use)/
              // id(g_wtx_address) directly (see the block-freshness
              // snapshot's own comment above -- identical reasoning).
              const int active_tx_idx =
                  jk_write_tx::find_active_write_tx_snapshot_for_address(jk_write_tx::g_write_tx_snapshot_table, e.address);
              jk_write_tx::WriteTxSnapshot active_tx_snapshot;
              if (active_tx_idx >= 0) {
                active_tx_snapshot =
                    jk_write_tx::read_write_tx_snapshot_slot(jk_write_tx::g_write_tx_snapshot_table, size_t(active_tx_idx));
              }

              const bool ready = reject_reason.empty();
              // A merge preview only needs valid geometry + a valid encode
              // + a real, fresh raw snapshot to merge into -- independent
              // of submit_policy (an authorization_required field still
              // shows what a write WOULD merge, per the plan's own "show
              // risk explanation" requirement; only the final ready/
              // reject_reason gates the POST itself).
              const bool can_preview_merge =
                  geometry_ok && has_value && enc.status == jk_write_tx::EncodeStatus::OK && block_idx >= 0 && fresh;
              const uint32_t merged_raw =
                  can_preview_merge
                      ? (jk_write_tx::merge_field_into_raw(old_raw, geom.field_mask, e.shift, enc.encoded_raw) & width.container_mask)
                      : 0;
              const uint32_t encoded_target_bits = can_preview_merge ? ((enc.encoded_raw << e.shift) & geom.field_mask) : 0;
              // sibling_bits_before reflects the CURRENT physical state
              // (needs only geometry + a real cached raw word, no
              // requested value at all); sibling_bits_expected_after is
              // deliberately computed FROM merged_raw, never copied
              // directly from sibling_bits_before -- the entire point of
              // this field is to prove, via the SAME arithmetic a real
              // write performs, that the requested write does not
              // disturb any bit outside its own mask (this project's own
              // "проверь real preservation from the real merge, not a
              // trivially-true self-comparison" requirement).
              const bool show_preservation = geometry_ok && !is_credential && block_idx >= 0;
              const uint32_t sibling_bits_before = show_preservation ? (old_raw & geom.preservation_mask) : 0;
              const uint32_t sibling_bits_expected_after =
                  can_preview_merge ? (merged_raw & geom.preservation_mask) : 0;

              std::string json;
              json.reserve(768);
              json += "{";
              json += "\"key\":\""; json += key; json += "\",";
              json += "\"write_safety_class\":\""; json += e.write_safety_class; json += "\",";
              json += "\"submit_policy\":\""; json += policy_str; json += "\",";
              // Address is always a real 16-bit Modbus register address in
              // this protocol -- always exactly 4 hex digits, independent
              // of word_count (word_count describes how many CONSECUTIVE
              // 16-bit registers the write spans, starting at this
              // address, not this field's own width).
              char hexbuf[12];  // "0xFFFFFFFF" + NUL = 11 bytes minimum; 12 for margin.
              jk_write_tx::format_hex_fixed_width(hexbuf, sizeof(hexbuf), e.address, 4);
              json += "\"address\":\""; json += hexbuf; json += "\",";
              json += "\"write_function\":\"write_multiple_registers_fc16\",";
              json += "\"word_count\":"; json += std::to_string(e.word_count); json += ",";
              if (is_credential) {
                json += "\"current_raw\":null,";
              } else if (block_idx >= 0) {
                json += "\"current_raw\":"; json += std::to_string(old_raw); json += ",";
              } else {
                json += "\"current_raw\":null,";
              }
              json += "\"raw_age_ms\":";
              json += raw_age_ms == 0xFFFFFFFFu ? std::string("null") : std::to_string(raw_age_ms);
              json += ",";
              json += "\"generation\":"; json += std::to_string(generation); json += ",";
              // mask/preservation_mask/encoded_target_bits are all bounded
              // by this field's own real container width: 4 hex digits
              // for word_count=1 (a real 16-bit register), 8 for
              // word_count=2 (a real 32-bit pair) -- see
              // hex_digits_for_word_count()'s own comment. An unsupported
              // word_count (already rejected above) falls back to 4
              // digits here purely for a non-crashing diagnostic display,
              // never presented as ready.
              const int hex_digits = jk_write_tx::hex_digits_for_word_count(e.word_count);
              json += "\"mask\":\""; jk_write_tx::format_hex_fixed_width(hexbuf, sizeof(hexbuf), e.mask, hex_digits); json += hexbuf; json += "\",";
              json += "\"shift\":"; json += std::to_string(e.shift); json += ",";
              if (can_preview_merge && !is_credential) {
                json += "\"encoded_target_bits\":\""; jk_write_tx::format_hex_fixed_width(hexbuf, sizeof(hexbuf), encoded_target_bits, hex_digits); json += hexbuf; json += "\",";
                json += "\"merged_raw\":"; json += std::to_string(merged_raw); json += ",";
              } else {
                json += "\"encoded_target_bits\":null,\"merged_raw\":null,";
              }
              if (show_preservation) {
                json += "\"preservation_mask\":\""; jk_write_tx::format_hex_fixed_width(hexbuf, sizeof(hexbuf), geom.preservation_mask, hex_digits); json += hexbuf; json += "\",";
                json += "\"sibling_bits_before\":"; json += std::to_string(sibling_bits_before); json += ",";
              } else {
                json += "\"preservation_mask\":null,\"sibling_bits_before\":null,";
              }
              if (can_preview_merge && !is_credential) {
                json += "\"sibling_bits_expected_after\":"; json += std::to_string(sibling_bits_expected_after); json += ",";
              } else {
                json += "\"sibling_bits_expected_after\":null,";
              }
              json += "\"ready\":"; json += (ready ? "true" : "false"); json += ",";
              json += "\"reject_reason\":"; json += (reject_reason.empty() ? std::string("null") : ("\"" + reject_reason + "\"")); json += ",";
              if (active_tx_idx >= 0 && active_tx_snapshot.valid) {
                json += "\"active_transaction\":{\"tx_id\":"; json += std::to_string(active_tx_snapshot.tx_id);
                json += ",\"status\":"; json += std::to_string(active_tx_snapshot.status); json += "}";
              } else {
                json += "\"active_transaction\":null";
              }
              json += "}";
              request->send(200, "application/json", json.c_str());
            }
          };
          id(web_server_base_id)->add_handler(new RegisterWritePreflightHandler());
          // One read-only bootstrap snapshot; subsequent successes arrive on
          // the existing /events connection via read_plan_success below.
          // The atomic table is already maintained for write preflight, so
          // this neither reads the Modbus bus nor touches main-loop globals.
          class ReadPlanFreshnessHandler : public AsyncWebHandler {
           public:
            bool canHandle(AsyncWebServerRequest *request) const override {
              if (request->method() != HTTP_GET) return false;
              char url_buf[AsyncWebServerRequest::URL_BUF_SIZE];
              return request->url_to(url_buf) == "/settings/read-freshness";
            }
            void handleRequest(AsyncWebServerRequest *request) override {
              const uint32_t now = millis();
              std::string json;
              json.reserve(4000);
              json += "{\"blocks\":[";
              for (size_t i = 0; i < jk_read_plan::kBlockCount; ++i) {
                if (i) json += ',';
                const auto snap = jk_write_tx::read_read_plan_block_snapshot(
                    jk_write_tx::g_read_plan_block_snapshot_table, i);
                json += '[';
                json += std::to_string(jk_read_plan::kBlocks[i].address);
                json += ',';
                if (snap.valid && snap.last_success_ms != 0) json += std::to_string(uint32_t(now - snap.last_success_ms));
                else json += "null";
                json += ',';
                json += std::to_string(snap.valid ? snap.revision : 0);
                json += ']';
              }
              // Clustered read path (plan M5): per cluster, from the main-loop
              // published atomic snapshot -- mode (cluster/fallback), active
              // lease, cadence and freshness budget in force, age, revision
              // and the global success sequence of its last read.
              json += "],\"clusters\":[";
              for (std::size_t c = 0; c < jk_read_clusters::kClusterCount; ++c) {
                if (c) json += ',';
                const auto &cl = jk_read_clusters::kClusters[c];
                const auto cs = jk_cluster_runtime::read_cluster_snapshot(jk_cluster_runtime::g_cluster_snapshot_table, c);
                const bool active = cs.valid && cs.active;
                json += "{\"id\":\""; json += cl.id;
                json += "\",\"start\":"; json += std::to_string(cl.start);
                json += ",\"registers\":"; json += std::to_string(cl.register_count);
                json += ",\"mode\":\""; json += (cs.valid && cs.fallback) ? "fallback" : "cluster";
                json += "\",\"lease\":"; json += active ? "1" : "0";
                json += ",\"cadence_ms\":"; json += std::to_string(active ? cl.active_cadence_ms : cl.cadence_ms);
                json += ",\"budget_ms\":"; json += std::to_string(active ? cl.active_freshness_budget_ms : cl.freshness_budget_ms);
                // The strict budget a write must meet under the lease (plan
                // M7), stated even while the lease is off; null = this
                // cluster has no active mode.
                const bool has_active = cl.active_cadence_ms != jk_read_clusters::kNoCadence;
                json += ",\"active_cadence_ms\":"; json += has_active ? std::to_string(cl.active_cadence_ms) : std::string("null");
                json += ",\"active_budget_ms\":"; json += has_active ? std::to_string(cl.active_freshness_budget_ms) : std::string("null");
                json += ",\"age_ms\":";
                if (cs.valid && cs.last_success_ms != 0 && !cs.fallback) json += std::to_string(uint32_t(now - cs.last_success_ms));
                else json += "null";
                json += ",\"revision\":"; json += std::to_string(cs.valid ? cs.revision : 0);
                json += ",\"sequence\":"; json += std::to_string(cs.valid ? cs.sequence : 0);
                json += '}';
              }
              json += "]}";
              request->send(200, "application/json", json.c_str());
            }
          };
          id(web_server_base_id)->add_handler(new ReadPlanFreshnessHandler());
      # Diagnostic instrumentation (2026-09-18, user-directed): publish
      # NOT_ATTEMPTED explicitly at boot, before the CellConWireRes0-31
      # interval's own startup_delay (10s) ever fires -- otherwise this
      # entity would simply be unpublished ("--") until the first attempt,
      # indistinguishable from "not yet initialized". A separate, tiny
      # lambda action (not folded into the large one above) to keep this
      # one-line addition trivially reviewable on its own.
      - lambda: |-
          id(cell_connection_wire_resistance_last_outcome)->publish_state(
              std::string(jk_capability::ATTEMPT_OUTCOME_NAMES[jk_capability::ATTEMPT_NOT_ATTEMPTED]));

esp32:
  board: esp32dev
  framework:
    type: esp-idf

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  min_auth_mode: WPA2
  ap:
    ssid: "JK-BMS Fallback"
    # Was a hardcoded, checked-in placeholder ("change-this-password") --
    # a real security gap per ESPHome's own security_best_practices guide
    # ("ALWAYS SET THIS" for the fallback AP). Now a per-device secret;
    # see secrets.yaml.example. Add the real value to your own
    # (gitignored) secrets.yaml before flashing.
    password: !secret jk_bms_ap_password
  # This can help if you experience wifi connection issues and see errors like
  # bssid=12:34:56:78:9A:CB[redacted] reason=‘Auth Expired’
  # output_power: "8.5dB"

ota:
  - platform: esphome
    # Was unset (any unauthenticated device on the network could push
    # firmware). Per ESPHome's own security_best_practices guide, never
    # reuse this across devices.
    password: !secret jk_bms_ota_password

captive_portal:

logger:
  # NOTE: In production this should be INFO or lower to reduce execution time and remove warnings like:
  # [W][component:239]: Component modbus_controller took a long time for an operation (107 ms).
  # [W][component:240]: Components should block for at most 30 ms.
  level: INFO  # DEBUG

# If you use Home Assistant please remove this `mqtt` section and uncomment the `api` component!
# The native API has many advantages over MQTT: https://esphome.io/components/api.html#advantages-over-mqtt
api:
  encryption:
    key: !secret jk_bms_api_key
  # Project requirement: this device must poll the BMS and serve the web UI
  # autonomously, without requiring a connected Home Assistant (or any other
  # native API client). ESPHome's api: component defaults reboot_timeout to
  # 15min -- "the amount of time to wait before rebooting when no client
  # connects to the API" (confirmed against ESPHome's own documentation for
  # the pinned 2026.8.2 toolchain, esphome.io/components/api.html) -- a
  # condition this device's own web_server/SSE traffic does nothing to
  # satisfy, since the native API (this component, TCP/protobuf) and the
  # HTTP web_server (a completely separate component/port) are unrelated:
  # a healthy browser/SSE connection is not a native API client connecting.
  # Investigated as the leading hypothesis for unexplained ESP reboots
  # observed during hardware retests with no HA instance attached
  # (2026-09-18) -- disabled explicitly rather than left to the 15min
  # default, which would otherwise reboot this device on a fixed cadence
  # whenever no HA happens to be present. Encryption above stays enabled;
  # this only removes the timeout, not the native API itself.
  reboot_timeout: 0s

# Declared explicitly (rather than left to web_server: to create implicitly)
# so on_boot below can reach the same AsyncWebServer instance via its id and
# register the /history.json handler on it.
web_server_base:
  id: web_server_base_id

web_server:
  web_server_base_id: web_server_base_id
  port: 80
  version: 2
  # ESPHome 2026.6.5's web_server CONF_AUTH schema had no `type:` key at
  # all -- Basic was the only, implicit option. 2026.8.2 (verified by a
  # real compile against that exact version) added `type: basic|digest`;
  # Digest never puts the password on the wire in an easily-reversible
  # form the way Basic does, so it's the better default now that it's
  # available -- explicitly set rather than left to default (ESPHome
  # itself warns the *default* stays 'basic' until 2027.1.0). Still NOT
  # encryption -- HTTP stays plaintext; this only authenticates, and the
  # threat model this device is designed for remains trusted LAN/VPN, not
  # direct internet exposure. WebServerBase::add_handler()
  # (web_server_base.cpp) wraps every handler registered through it --
  # including this project's own HistoryHandler/ChargeHistoryHandler
  # below, which both call id(web_server_base_id)->add_handler(...) -- in
  # AuthMiddlewareHandler whenever credentials are set, so both custom
  # endpoints are covered by this block automatically; a live 401 test
  # against them is still the way to confirm this on real hardware, not
  # just this source read.
  auth:
    type: digest
    username: !secret jk_bms_web_username
    password: !secret jk_bms_web_password
  # jk_bms.js/jk_bms.css now live at the project root, not in a jk_bms_ui/
  # subfolder — the paths below were pointing at a folder that doesn't
  # exist here.
  js_include: "./jk_bms.js"
  css_include: "./jk_bms.css"
  # ESPHome v2 loads js_include as a module. Load the same asset once as a
  # classic script too; jk_bms.js contains a guard against a second start.
  js_url: "/0.js"
  css_url: ""

# On-device history ring buffer for the UI's per-metric trend charts
# (Voltage, Current, Power, Balance current, the four temperature probes).
# 60 points x 30s apart = a real 30-minute window (the frontend derives its
# "Last N minutes" label from interval_s x sample count in the JSON below,
# not a hardcoded string, so this and the label can never drift apart
# again the way "20 minutes" quietly did after this buffer was first
# sized at 40 points). Sized for ESP32 RAM (9 series x 60 floats = 2.1KB)
# rather than flash — history does not survive a reboot, which matches
# "recent trend," not "logged history" (see the separate 60-hour charge-
# cycle buffer for that).
uart:
  - id: uart_0
    baud_rate: 115200
    rx_buffer_size: 384
    tx_pin: ${tx_pin}
    rx_pin: ${rx_pin}

modbus:
  - id: modbus0
    uart_id: uart_0
    flow_control_pin: ${flow_control_pin}
    # command_throttle used to live on modbus_controller: (below) but a
    # real 2026.8.2 compile warned it "no longer has any effect... use
    # 'turnaround_time' there instead" -- moved here, same 50ms value, to
    # keep actually spacing commands rather than silently doing nothing.
    turnaround_time: 50ms

modbus_controller:
  - id: bms0
    # Dip switch configuration of a single pack setup / address 0x01
    #  1    2    4    5
    #  on, off, off, off (0x01)
    #
    # Don't turn off all dip switches / don't use device address 0x00.
    # This is the Modbus Master mode. You must select a device address
    # between 0x01 and 0x0f so the BMS acts as Modbus Slave.
    address: ${device_addr}
    modbus_id: modbus0
    setup_priority: -10
    update_interval: ${modbus_controller_update_interval}

# Critical-path cache: each Modbus response is decoded once; template entities
# only publish already-computed scalar values.
globals:
  # Stage 1 hardware acceptance corrective pass: minimum-interval rate limit
  # for ActiveGroupHandler (below) -- 0 means "no request processed yet",
  # so the very first request is never itself rate-limited.
  - id: g_active_group_last_request_ms
    type: uint32_t
    restore_value: false
    initial_value: "0"
  # Stage 4 production-integration gap fix (2026-09-21): minimum-interval
  # rate limit for RegisterWriteHandler's POST /settings/register-write
  # (below) -- same 100ms convention as g_active_group_last_request_ms
  # above, well under the browser's own debounce, cheap insurance against a
  # scripted client flooding this endpoint. The read-only preflight GET
  # deliberately has no rate limit (it never queues a write or mutates BMS
  # state -- see RegisterWritePreflightHandler's own comment).
  - id: g_register_write_last_request_ms
    type: uint32_t
    restore_value: false
    initial_value: "0"
  - id: g_max_cell_v
    type: float
    restore_value: false
    initial_value: "NAN"
  - id: g_min_cell_v
    type: float
    restore_value: false
    initial_value: "NAN"
  - id: g_max_cell_idx
    type: uint8_t
    restore_value: false
    initial_value: "0"
  - id: g_min_cell_idx
    type: uint8_t
    restore_value: false
    initial_value: "0"
  - id: g_total_voltage_v
    type: float
    restore_value: false
    initial_value: "NAN"
  - id: g_current_a
    type: float
    restore_value: false
    initial_value: "NAN"
  - id: g_power_w
    type: float
    restore_value: false
    initial_value: "NAN"
  - id: g_charging_power_w
    type: float
    restore_value: false
    initial_value: "NAN"
  - id: g_discharging_power_w
    type: float
    restore_value: false
    initial_value: "NAN"
  # Clustered read path (plan M5): the cell, CellWireRes16-31 and
  # CellConWireRes0-31 values now come from the A1/C1/C2 clusters
  # (cluster_stored script). The capability states keep their entities:
  # SUPPORTED once the owning cluster has been read and decoded.
  - id: g_cellwireres_ext_capability
    type: uint8_t
    restore_value: false
    initial_value: "0"   # jk_capability::STATE_UNKNOWN
  - id: g_cellconwireres_capability
    type: uint8_t
    restore_value: false
    initial_value: "0"   # jk_capability::STATE_UNKNOWN
  - id: g_cellconwireres_queued_count
    type: uint32_t
    restore_value: false
    initial_value: "0"
  - id: g_cellconwireres_callback_count
    type: uint32_t
    restore_value: false
    initial_value: "0"
  # V2 — BMS communication health, distinct from browser<->ESP32 network
  # health. Updated only at the point below where a cell-poll response has
  # actually been decoded as valid (right length AND at least one plausible
  # cell voltage) — not merely "a response of the right size arrived".
  # bms_health (text_sensor, further down) turns the elapsed time since
  # this timestamp into LIVE/DEGRADED/STALE/OFFLINE.
  - id: g_last_bms_response_ms
    type: uint32_t
    restore_value: false
    initial_value: "0"

  # Stage 3 cell-channel batch (user-directed, 2026-09-17): the bit-exact
  # raw cell_connected_mask value, set alongside every decode of that
  # field (the generic 15s poll AND the CellCount topology write-driver's
  # 2 one-shot re-reads, below) -- resolve_topology reads THIS, never
  # id(cell_connected_mask).state (a float, which loses precision on the
  # LOW bits too once any high bit like bit31 is set -- float's ULP scales
  # with magnitude). g_cell_connected_mask_valid distinguishes "never
  # decoded yet since boot" (both start false/0) from "genuinely decoded
  # as zero" -- the same distinction the old code got for free from a
  # float sensor's own NaN-until-first-publish default, which a raw
  # uint32_t global (defaulting to 0, indistinguishable from a real
  # all-disconnected mask) does not provide on its own.
  - id: g_cell_connected_mask_raw
    type: uint32_t
    restore_value: false
    initial_value: "0"
  - id: g_cell_connected_mask_valid
    type: bool
    restore_value: false
    initial_value: "false"

  # V2.1 — when the current charge_phase (none/bulk/absorption/float) last
  # CHANGED, in millis(). charge_status_time_elapsed (below) measures
  # something different — time since the `charging` output last turned
  # on — so the Overview "Timer" field was silently reusing the wrong
  # clock: it read as a per-phase timer but never reset at a Bulk-to-
  # Absorption transition, only at Charge-off/on. charge_phase_elapsed
  # (sensor, near charge_status) turns this into the real thing.
  # V2.2 semantic refactor: this now tracks charge_phase specifically
  # (Charge Cycle's own concept), NOT battery_state — see
  # g_battery_state_started_ms below for the main operating-state clock.
  # The two coincide at every bulk/absorption/float transition (both
  # concepts change together there) and diverge only when the pack
  # leaves the charging path entirely (discharging/idle/offline all
  # collapse to charge_phase="none", so this clock stops moving while
  # battery_state keeps its own).
  - id: g_charge_phase_started_ms
    type: uint32_t
    restore_value: false
    initial_value: "0"

  # V2.2 — when battery_state (idle/charging/discharging/absorption/
  # float/offline/unknown) last CHANGED. This is the PUBLIC/HA-facing
  # operating-state clock — separate from charge_phase's clock above,
  # since the two concepts now live at different abstraction levels
  # (see the charge_status resolver's own comment for the full model).
  - id: g_battery_state_started_ms
    type: uint32_t
    restore_value: false
    initial_value: "0"

  # V2.2 — the resolver's own charge_phase result (0=none, 1=bulk,
  # 2=absorption, 3=float), written once by charge_status's lambda and
  # read by the separate charge_phase text_sensor below — one canonical
  # computation, two thin presentation-layer entities reading its output,
  # never two independent classifiers.
  - id: g_charge_phase_code
    type: uint8_t
    restore_value: false
    initial_value: "0"

  # V2.2 — timestamp of the most recent GENUINELY FRESH current sample
  # (set in electrical_metrics_scan's own lambda, not here) — lets the
  # battery_state resolver require actual new telemetry before confirming
  # a transition, not just wall-clock time elapsing with no real new
  # sample (Modbus polls roughly every 15s; a 15-30s wall-clock dwell
  # alone could theoretically elapse from timer jitter without a fresh
  # decode ever landing).
  - id: g_last_current_sample_ms
    type: uint32_t
    restore_value: false
    initial_value: "0"

  # V2.2 hardening pass — resolver internals mirrored into globals purely
  # so the diagnostic text_sensors/sensors further down can read them
  # without re-deriving anything: the `charge_status` lambda remains the
  # ONE place that actually decides these values every tick.
  # Direction codes throughout: 0=neutral, 1=charge, 2=discharge.
  - id: g_current_direction_code
    type: uint8_t
    restore_value: false
    initial_value: "0"
  - id: g_candidate_direction_code
    type: uint8_t
    restore_value: false
    initial_value: "0"
  - id: g_candidate_fresh_samples_g
    type: uint8_t
    restore_value: false
    initial_value: "0"
  - id: g_candidate_since_ms_g
    type: uint32_t
    restore_value: false
    initial_value: "0"
  # unknown_reason: 0=n/a (not currently unknown), 1=no valid telemetry
  # yet since boot, 2=just reconnected, awaiting a fresh sample before
  # trusting the resolved state again.
  - id: g_unknown_reason_code
    type: uint8_t
    restore_value: false
    initial_value: "0"
  # battery_state/charge_phase codes for diagnostics decoding, and their
  # LAST KNOWN (pre-offline) values — Diagnostics-only, per §10: these
  # must never be exposed as the CURRENT live state (charge_status/
  # charge_phase already correctly report offline/none during an outage;
  # these two exist only so a technician can see "what was it doing
  # before it went dark" without that ever being mistaken for live data).
  # battery_state codes: 0=unknown,1=idle,2=charging,3=discharging,
  # 4=absorption,5=float,6=offline.
  - id: g_battery_state_code
    type: uint8_t
    restore_value: false
    initial_value: "0"
  - id: g_last_known_battery_state_code
    type: uint8_t
    restore_value: false
    initial_value: "0"
  - id: g_last_known_charge_phase_code
    type: uint8_t
    restore_value: false
    initial_value: "0"

  # ---- Topology Resolver state (resolve_topology script, in scripts:
  # below) — the single source of truth for whether CellCount can be
  # trusted as the pack's real physical topology. state_code:
  #   0=LOADING 1=CONFIRMED 2=MISMATCH 3=INVALID 4=WRITE_UNCERTAIN
  #   5=OFFLINE 6=PENDING
  # effective_cell_count/last_confirmed_cell_count mirror their published
  # sensors as globals too so C++ code (the cell-poll callback, the
  # transaction driver) never has to read them back through a
  # Sensor::state float round-trip just to decide e.g. the inactive-
  # channel blanking range or what to show while PENDING.
  - id: g_topology_state_code
    type: uint8_t
    restore_value: false
    initial_value: "0"
  - id: g_topology_reason_code
    type: uint8_t
    restore_value: false
    initial_value: "1"  # AWAITING_SNAPSHOT
  - id: g_effective_cell_count
    type: uint8_t
    restore_value: false
    initial_value: "16"
  # The last count the resolver actually reached CONFIRMED for. Distinct
  # from effective_cell_count (which is 16 — "trust nothing" — in every
  # non-CONFIRMED state): while PENDING this is what the UI keeps
  # rendering, so a write in flight never causes a visible, unconfirmed
  # jump to either the old OR the requested topology (spec: "UI не
  # повинен частково перейти на нову кількість комірок раніше, ніж
  # resolver сформував остаточний узгоджений snapshot").
  - id: g_last_confirmed_cell_count
    type: uint8_t
    restore_value: false
    initial_value: "0"  # 0 == "never confirmed since boot"
  # Monotonic — bumped on every resolve_topology publish AND on every
  # transaction-driven state override (PENDING/WRITE_UNCERTAIN), so a
  # client can tell "this is a strictly newer determination" apart from
  # "this looks the same as what I already rendered" without relying on
  # wall-clock time.
  - id: g_topology_revision
    type: uint32_t
    restore_value: false
    initial_value: "0"
  - id: g_topology_last_publish_ms
    type: uint32_t
    restore_value: false
    initial_value: "0"
  # Sticky uncertainty flag: set the instant a CellCount write's ACK or
  # forced readback is lost (the write *may* have applied on the BMS
  # side), cleared ONLY when a freshly, independently re-read CellCount +
  # mask snapshot lands — never by the ordinary 1Hz resolver tick reusing
  # whatever stale register memory it already had cached. This is what
  # stops "readback timeout" from silently reporting the OLD CONFIRMED
  # topology as still trustworthy (spec §3: "не повертай старий стан
  # CONFIRMED як достовірний, доки нове авторитетне читання не визначить
  # фактичний стан").
  - id: g_topology_uncertain
    type: bool
    restore_value: false
    initial_value: "false"
  # Recovery probe (250ms interval, below) — while g_topology_uncertain is
  # set and no transaction is currently in flight, periodically forces a
  # fresh CellCount + mask read specifically to clear the uncertainty; a
  # value that merely happens to match the old one via the ordinary slow
  # poll is NOT proof of freshness, only a live round-trip completing here is.
  - id: g_topology_recovery_pending
    type: bool
    restore_value: false
    initial_value: "false"
  - id: g_topology_recovery_cellcount_done
    type: bool
    restore_value: false
    initial_value: "false"
  - id: g_topology_recovery_mask_done
    type: bool
    restore_value: false
    initial_value: "false"
  - id: g_topology_recovery_last_ms
    type: uint32_t
    restore_value: false
    initial_value: "0"

  # ---- CellCount write transaction (set_cell_count's set_action + the
  # dedicated 250ms interval below) — write -> wait for ACK -> forced
  # readback of CellCount + connected mask -> wait for a cell-block decode
  # newer than the write -> resolve_topology. No step is ever assumed to
  # have happened just because a fixed delay elapsed.
  - id: g_cellcount_tx_pending
    type: bool
    restore_value: false
    initial_value: "false"
  # Correlation id for the currently (or most recently) active CellCount
  # transaction — bumped once per set_action invocation, published
  # alongside every topology/transaction sensor so the frontend can tell
  # "this SSE event belongs to the transaction I'm watching" from a late
  # event belonging to an OLDER transaction (spec §5: transaction_id
  # correlation against the HTTP/SSE race).
  - id: g_cellcount_tx_id
    type: uint32_t
    restore_value: false
    initial_value: "0"
  - id: g_cellcount_tx_target
    type: uint8_t
    restore_value: false
    initial_value: "0"
  - id: g_cellcount_tx_started_ms
    type: uint32_t
    restore_value: false
    initial_value: "0"
  - id: g_cellcount_write_acked
    type: bool
    restore_value: false
    initial_value: "false"
  - id: g_cellcount_readback_started_ms
    type: uint32_t
    restore_value: false
    initial_value: "0"
  - id: g_cellcount_readback_cellcount_done
    type: bool
    restore_value: false
    initial_value: "false"
  - id: g_cellcount_readback_mask_done
    type: bool
    restore_value: false
    initial_value: "false"

  # ---- Generic write transaction manager (jk_write_tx_core.h) — EVERY RW
  # register except CellCount routes through this: write_bms_u32/u16 (the
  # ~25 numeric configuration registers), the packed-subfield template
  # numbers (heating thresholds, dry-contact sources/values), the
  # charging/discharging/balancing control selects, and the setup
  # passcode. 6 concurrent slots is enough headroom for the
  # concurrent-different-register test scenario without allowing unbounded
  # queuing — a write that arrives when every slot is busy is REJECTED
  # outright (jk_write_tx::begin() returns -1), never silently dropped or
  # interleaved with another register's in-flight transaction.
  #
  # ESPHome's globals codegen instantiates every `globals:` entry BEFORE
  # any `esphome: includes:` file is #included in the generated main.cpp
  # (verified by an actual failed compile: a std::array<CustomStruct, 6>
  # global tried to instantiate the struct type ~120 lines before its
  # #include), so the transaction slots cannot be a single global of the
  # jk_write_tx::Slot struct type — only plain scalar/array-of-POD globals
  # (already proven elsewhere in this file: hist_voltage's float[60],
  # cc_hist_voltage_cv's int16_t[3600]) are visible that early. The 14
  # parallel arrays below carry exactly Slot's fields; the YAML lambdas
  # that call jk_write_tx::begin()/tick() (which DO run after the
  # #include, well down in generated main.cpp) marshal a local
  # jk_write_tx::Slot to/from these arrays around each call, so the
  # actual state-machine LOGIC still lives in exactly one, unit-tested
  # place (jk_write_tx_core.h) — only the storage is split.
  - id: g_wtx_in_use          # 0/1
    type: uint8_t[6]
  - id: g_wtx_tx_id
    type: uint32_t[6]
  - id: g_wtx_address
    type: uint16_t[6]
  - id: g_wtx_word_count
    type: uint8_t[6]
  - id: g_wtx_requested_raw
    type: uint32_t[6]
  - id: g_wtx_readback_raw
    type: uint32_t[6]
  - id: g_wtx_compare_mask
    type: uint32_t[6]
  - id: g_wtx_status
    type: uint8_t[6]
  - id: g_wtx_started_ms
    type: uint32_t[6]
  - id: g_wtx_acked           # 0/1
    type: uint8_t[6]
  - id: g_wtx_readback_started_ms
    type: uint32_t[6]
  - id: g_wtx_readback_done   # 0/1
    type: uint8_t[6]
  - id: g_wtx_finished_ms
    type: uint32_t[6]
  - id: g_wtx_suppress_value  # 0/1
    type: uint8_t[6]
  # Third critical audit (2026-09-10, item 6): bumped every time a slot
  # index is reused for a new transaction (mirrors jk_write_tx::Slot's own
  # generation field, marshalled the same parallel-array way as every
  # other Slot member). The ACK and forced-readback command callbacks
  # below capture {idx, tx_id, address, generation} at issue time and
  # verify ALL FOUR still match before writing anything back, so a late
  # callback belonging to a transaction this slot has since moved past
  # can never corrupt the slot's now-current transaction.
  - id: g_wtx_generation
    type: uint32_t[6]
  # Third critical audit (2026-09-10, item 7): a slot the servicer has
  # reclassified into jk_write_tx::WRITE_UNCERTAIN (after ACK_TIMEOUT/
  # READBACK_TIMEOUT) is NOT freed -- it stays in_use while an independent
  # recovery readback runs, mirroring the pattern CellCount's own bespoke
  # uncertainty-recovery probe already uses. g_wtx_recovery_pending marks
  # a slot that still needs its recovery probe (re)issued;
  # g_wtx_recovery_next_ms is the earliest millis() the servicer may issue
  # (or re-issue, if a prior probe never got a response) that read.
  - id: g_wtx_recovery_pending  # 0/1
    type: uint8_t[6]
  - id: g_wtx_recovery_next_ms
    type: uint32_t[6]
  - id: g_write_tx_next_id
    type: uint32_t
    restore_value: false
    initial_value: "0"
  # A write rejected by begin_write_tx (single-flight collision, or every
  # slot busy) never gets a real Slot -- jk_write_tx::begin() returns -1
  # before allocating one. Previously that meant NO terminal signal was
  # ever published for it: the ESPHome set_action still returned HTTP 200
  # (the action ran to completion; refusing to queue a command is not an
  # error from ESPHome's own point of view), and the frontend's only way
  # to learn the write never started was its own client-side timeout --
  # exactly the "REJECTED is masked as a timeout" defect this addendum
  # exists to close.
  #
  # Third critical audit (2026-09-10, item 4): a single set of "last
  # rejected" scalars can only ever remember ONE rejection at a time -- a
  # second, different-address rejection within the same publish window
  # would silently overwrite the first's record before any client ever
  # observed it. This is a real 4-slot ring buffer instead (independent of
  # the 6-slot g_wtx_* pool, which only ever tracks ACCEPTED transactions)
  # so up to 4 concurrent/near-simultaneous rejections each keep their own
  # tx_id/address/timestamp. publish_write_tx_snapshot() (below) surfaces
  # every entry still inside its own 3s grace period as a real, short-
  # lived REJECTED(9) snapshot row, keyed by its own transaction id, using
  # the SAME grace-period convention as a real terminal slot.
  - id: g_wtx_rejected_addr
    type: uint16_t[4]
  - id: g_wtx_rejected_tx_id
    type: uint32_t[4]
  - id: g_wtx_rejected_ms
    type: uint32_t[4]
  - id: g_wtx_rejected_next_slot
    type: uint8_t
    restore_value: false
    initial_value: "0"

  # ---- Setup passcode transaction (setup_passcode's set_action, below,
  # + a dedicated servicer in the generic write-tx interval) — kept
  # separate from jk_write_tx_core.h's slot pool because the passcode is
  # an 8-word (16-byte) packed ASCII payload, wider than any other RW
  # register here (which are all 1-2 words); the comparison logic is
  # otherwise identical (write -> ACK -> forced readback -> compare), and
  # publishes the SAME status-code vocabulary
  # (setup_passcode_tx_status_code, sensor below) so the frontend handles
  # it uniformly. Only ACK/readback SUCCESS is ever published — the
  # actual bytes never leave this device (setup_passcode's own read
  # lambda already always returns a masked "****************").
  - id: g_passcode_tx_pending
    type: bool
    restore_value: false
    initial_value: "false"
  - id: g_passcode_tx_id
    type: uint32_t
    restore_value: false
    initial_value: "0"
  - id: g_passcode_tx_started_ms
    type: uint32_t
    restore_value: false
    initial_value: "0"
  - id: g_passcode_write_acked
    type: bool
    restore_value: false
    initial_value: "false"
  - id: g_passcode_readback_started_ms
    type: uint32_t
    restore_value: false
    initial_value: "0"
  - id: g_passcode_readback_done
    type: bool
    restore_value: false
    initial_value: "false"
  - id: g_passcode_expected_words
    type: uint16_t[8]
  - id: g_passcode_readback_words
    type: uint16_t[8]

  # On-device history ring buffer for the UI's per-metric trend charts
  # (Voltage, Current, Power, Balance current, the four temperature probes).
  # 60 points x 30s apart = a real 30-minute window (see the fuller comment
  # by the /history.json handler in on_boot above — this file used to say
  # "20 minutes" here for a buffer that had already grown past that,
  # exactly the drift the frontend's now-computed label avoids repeating).
  - id: hist_index
    type: int
    restore_value: false
    initial_value: '0'
  - id: hist_count
    type: int
    restore_value: false
    initial_value: '0'
  - id: hist_voltage
    type: float[60]
  - id: hist_current
    type: float[60]
  - id: hist_power
    type: float[60]
  - id: hist_balance
    type: float[60]
  - id: hist_mosfet_temp
    type: float[60]
  - id: hist_temp1
    type: float[60]
  - id: hist_temp2
    type: float[60]
  - id: hist_temp4
    type: float[60]
  - id: hist_temp5
    type: float[60]

  # V2.1 — the real 60-hour Charge Cycle buffer, replacing the old
  # synthetic reference-profile curve entirely. 1 sample/min x 60h = 3600
  # samples. Voltage/current are fixed-point int16 (centivolts / centiamps)
  # rather than float — half the RAM per sample for range/precision this
  # buffer actually needs (+/-327.67 V or A, 0.01 resolution), not
  # "whatever a float happens to cost". SOC and stage are single bytes;
  # no PSRAM is assumed anywhere in this design.
  #
  # ACTUAL memory footprint, verified against the real declarations below
  # (four separate globals, NOT a struct — so there is no compiler-padding
  # question to ask; a plain array of a fixed-width POD type has zero
  # padding between elements by definition):
  #   cc_hist_voltage_cv  int16_t[3600]  = 2 x 3600 = 7200 bytes
  #   cc_hist_current_ca  int16_t[3600]  = 2 x 3600 = 7200 bytes
  #   cc_hist_soc         uint8_t[3600]  = 1 x 3600 = 3600 bytes
  #   cc_hist_stage       uint8_t[3600]  = 1 x 3600 = 3600 bytes
  #   cc_hist_index       int            = 4 bytes  (ESP32: 32-bit int)
  #   cc_hist_count       int            = 4 bytes
  #   TOTAL                              = 21,608 bytes (~21.1 KiB)
  # Comfortably inside the ~320 KiB DRAM an ESP32 has for globals/heap
  # alongside WiFi/TLS/ESPHome's own footprint — no PSRAM required.
  - id: cc_hist_index
    type: int
    restore_value: false
    initial_value: '0'
  - id: cc_hist_count
    type: int
    restore_value: false
    initial_value: '0'
  - id: cc_hist_voltage_cv    # centivolts (V x 100), INT16_MIN = no sample
    type: int16_t[3600]
  - id: cc_hist_current_ca    # centiamps (A x 100), INT16_MIN = no sample
    type: int16_t[3600]
  - id: cc_hist_soc           # percent 0-100, 255 = no sample
    type: uint8_t[3600]
  - id: cc_hist_stage         # 0 idle, 1 bulk, 2 absorption, 3 float, 4 discharging, 5 offline
    type: uint8_t[3600]       # (still 1 byte/sample — 5 is just another value of the same uint8_t)

# Cell voltages/resistances (1-32), CellWireRes16-31 and CellConWireRes0-31
# are decoded from the A1/C1/C2 clusters by the cluster_stored script (plan
# M5); no dedicated reader polls them any more.
interval:
  # ---- HA entity writes waiting for their one tracked pre-read (plan M5):
  # re-decided every 100 ms by entity_write_step until queued, NO_CHANGE or
  # rejected (refused / deadline) for good. At most one per register.
  - interval: 100ms
    then:
      - lambda: |-
          for (const auto &req : jk_cluster_runtime::g_entity_write_requests) {
            if (req.active()) { id(entity_write_step)->execute(); break; }
          }

  # ---- CellCount write transaction driver (jk_topology) — advances the
  # state armed by set_cell_count's set_action, above, through:
  #   1. wait for the write to be ACKed (g_cellcount_write_acked, set by
  #      the write command's own on_data_func) — 3s timeout;
  #   2. force one-shot re-reads of CellCount (0x106C) and the connected
  #      mask (0x1240) the instant the ACK lands, instead of waiting for
  #      their normal ~5-minute / 15s poll cadences;
  #   3. wait for BOTH of those AND a fresh cell-block decode (a
  #      g_last_bms_response_ms newer than the write) — 4s timeout;
  #   4. resolve_topology, using the now-corroborated snapshot, then a
  #      strict terminal check: success requires readback_raw_value ==
  #      requested_raw_value AND topology_state == CONFIRMED AND
  #      effective_cell_count == requested_raw_value, ALL THREE — matching
  #      exactly a plausible-but-different value the BMS silently clamped
  #      to is never reported as success just because that OTHER value
  #      happens to resolve cleanly.
  # No step is ever assumed to have happened just because a fixed delay
  # elapsed. An ACK or readback timeout does NOT restore the old CONFIRMED
  # state as if nothing happened — the BMS may well have applied the write
  # and only the confirmation was lost — so it sets g_topology_uncertain
  # and the resolver reports WRITE_UNCERTAIN until the separate recovery
  # probe below (run only when no transaction is in flight) gets a
  # genuinely fresh, independently re-verified snapshot.
  - interval: 250ms
    then:
      - lambda: |-
          const uint32_t now = millis();

          if (id(g_cellcount_tx_pending)) {
            if (!id(g_cellcount_write_acked)) {
              id(cellcount_tx_status_code)->publish_state(2.0f);  // ack_wait
              if (now - id(g_cellcount_tx_started_ms) > 3000U) {
                ESP_LOGW("jk_topology", "CellCount write not acknowledged within 3s (tx_id=%u target=%d) -- WRITE_UNCERTAIN",
                         unsigned(id(g_cellcount_tx_id)), int(id(g_cellcount_tx_target)));
                id(g_cellcount_tx_pending) = false;
                id(g_topology_uncertain) = true;
                id(cellcount_tx_status_code)->publish_state(7.0f);  // ack_timeout
                id(resolve_topology)->execute();
              }
              return;
            }

            if (id(g_cellcount_readback_started_ms) == 0U) {
              id(g_cellcount_readback_started_ms) = now;
              id(cellcount_tx_status_code)->publish_state(3.0f);  // readback_wait

              // Register-count unit fix (2026-09-18, user-directed):
              // cell_count (0x106C) is word_count=2 in
              // protocol/registers.canonical.json -- 2 registers, 4 bytes
              // -- matching exactly what this decode reads. The prior
              // literal "8" was REGISTERS (16 bytes on the wire), 4x the
              // real block.
              constexpr uint16_t cellcount_register_count = 2;
              constexpr size_t cellcount_expected_payload_bytes = size_t(cellcount_register_count) * 2U;
              auto cc_cmd = esphome::modbus_controller::ModbusCommandItem::create_read_command(
                  id(bms0), esphome::modbus::EntityType::HOLDING, 0x106C, cellcount_register_count,
                  [](esphome::modbus::EntityType, uint16_t, std::span<const uint8_t> data) {
                    if (data.size() == cellcount_expected_payload_bytes) {
                      const uint32_t v = (uint32_t(data[0]) << 24) | (uint32_t(data[1]) << 16) |
                                          (uint32_t(data[2]) << 8) | uint32_t(data[3]);
                      id(cell_count)->publish_state(float(v));
                    }
                    id(g_cellcount_readback_cellcount_done) = true;
                  });
              id(bms0)->queue_command(std::move(cc_cmd));

              // cell_connected_mask (0x1240) is also word_count=2 -- same
              // 2-register/4-byte contract as cell_count above. The prior
              // literal "4" here was REGISTERS (8 bytes on the wire), 2x
              // the real block.
              constexpr uint16_t mask_register_count = 2;
              constexpr size_t mask_expected_payload_bytes = size_t(mask_register_count) * 2U;
              auto mask_cmd = esphome::modbus_controller::ModbusCommandItem::create_read_command(
                  id(bms0), esphome::modbus::EntityType::HOLDING, 0x1240, mask_register_count,
                  [](esphome::modbus::EntityType, uint16_t, std::span<const uint8_t> data) {
                    if (data.size() == mask_expected_payload_bytes) {
                      const uint32_t v = (uint32_t(data[0]) << 24) | (uint32_t(data[1]) << 16) |
                                          (uint32_t(data[2]) << 8) | uint32_t(data[3]);
                      id(cell_connected_mask)->publish_state(float(v));
                      id(cell_connected_mask_exact)->publish_state(std::to_string(v));
                      id(g_cell_connected_mask_raw) = v;
                      id(g_cell_connected_mask_valid) = true;
                    }
                    id(g_cellcount_readback_mask_done) = true;
                  });
              id(bms0)->queue_command(std::move(mask_cmd));
              return;
            }

            const bool have_fresh_cells = id(g_last_bms_response_ms) > id(g_cellcount_tx_started_ms);
            if (id(g_cellcount_readback_cellcount_done) && id(g_cellcount_readback_mask_done) && have_fresh_cells) {
              id(g_cellcount_tx_pending) = false;
              id(resolve_topology)->execute();
              const uint8_t target = id(g_cellcount_tx_target);
              const float readback_raw = id(cell_count).state;
              const bool readback_matches = !isnan(readback_raw) && uint8_t(lroundf(readback_raw)) == target;
              const bool topo_confirmed = id(g_topology_state_code) == 1;
              const bool effective_matches = id(g_effective_cell_count) == target;
              if (readback_matches && topo_confirmed && effective_matches) {
                id(cellcount_tx_status_code)->publish_state(4.0f);  // confirmed
                ESP_LOGI("jk_topology", "CellCount transaction CONFIRMED (tx_id=%u target=%d)",
                         unsigned(id(g_cellcount_tx_id)), int(target));
              } else {
                id(cellcount_tx_status_code)->publish_state(5.0f);  // mismatch
                ESP_LOGW("jk_topology",
                         "CellCount transaction MISMATCH (tx_id=%u target=%d readback=%.0f topology_state=%d effective=%d)",
                         unsigned(id(g_cellcount_tx_id)), int(target), readback_raw, int(id(g_topology_state_code)),
                         int(id(g_effective_cell_count)));
              }
              return;
            }
            if (now - id(g_cellcount_readback_started_ms) > 4000U) {
              ESP_LOGW("jk_topology", "CellCount readback incomplete after 4s (tx_id=%u cellcount=%d mask=%d fresh_cells=%d) -- WRITE_UNCERTAIN",
                       unsigned(id(g_cellcount_tx_id)), int(id(g_cellcount_readback_cellcount_done)),
                       int(id(g_cellcount_readback_mask_done)), int(have_fresh_cells));
              id(g_cellcount_tx_pending) = false;
              id(g_topology_uncertain) = true;
              id(cellcount_tx_status_code)->publish_state(8.0f);  // readback_timeout
              id(resolve_topology)->execute();
            }
            return;
          }

          // ---- Uncertainty recovery probe — only runs when no
          // transaction is in flight. A value that merely happens to
          // match the old one via the ordinary slow poll is not proof of
          // freshness; only a live round-trip completing here clears
          // g_topology_uncertain. Retries every 5s, indefinitely, until
          // it succeeds (a lost ACK/readback is a communication problem,
          // not something a client-side timeout can wait out once). ----
          if (!id(g_topology_uncertain)) return;

          if (id(g_topology_recovery_pending)) {
            if (id(g_topology_recovery_cellcount_done) && id(g_topology_recovery_mask_done)) {
              id(g_topology_recovery_pending) = false;
              id(g_topology_uncertain) = false;
              ESP_LOGI("jk_topology", "Uncertainty recovery probe succeeded -- re-resolving topology");
              id(resolve_topology)->execute();
            } else if (now - id(g_topology_recovery_last_ms) > 4000U) {
              // This probe attempt stalled; fall through to the throttle
              // below and simply try again.
              id(g_topology_recovery_pending) = false;
            }
            return;
          }

          // Plan M8.1: the probe is two more reads -- never while a write
          // intent drains the hub or any transaction owns the bus, so it can
          // never land between a write's ACK and its forced readback.
          if (!jk_write_tx::recovery_probe_allowed(jk_write_tx::bus_owner(
                  id(g_wtx_in_use), id(g_wtx_status), 6, id(g_cellcount_tx_pending), id(g_topology_recovery_pending),
                  id(g_passcode_tx_pending), jk_cluster_runtime::g_write_intent.active))) return;
          if (now - id(g_topology_recovery_last_ms) < 5000U) return;
          id(g_topology_recovery_last_ms) = now;
          id(g_topology_recovery_pending) = true;
          id(g_topology_recovery_cellcount_done) = false;
          id(g_topology_recovery_mask_done) = false;

          // Register-count unit fix (2026-09-18, user-directed): same
          // contract as the initial readback above -- cell_count (0x106C)
          // and cell_connected_mask (0x1240) are both word_count=2 (2
          // registers, 4 bytes each).
          constexpr uint16_t cellcount_register_count = 2;
          constexpr size_t cellcount_expected_payload_bytes = size_t(cellcount_register_count) * 2U;
          auto rec_cc_cmd = esphome::modbus_controller::ModbusCommandItem::create_read_command(
              id(bms0), esphome::modbus::EntityType::HOLDING, 0x106C, cellcount_register_count,
              [](esphome::modbus::EntityType, uint16_t, std::span<const uint8_t> data) {
                if (data.size() == cellcount_expected_payload_bytes) {
                  const uint32_t v = (uint32_t(data[0]) << 24) | (uint32_t(data[1]) << 16) |
                                      (uint32_t(data[2]) << 8) | uint32_t(data[3]);
                  id(cell_count)->publish_state(float(v));
                }
                id(g_topology_recovery_cellcount_done) = true;
              });
          id(bms0)->queue_command(std::move(rec_cc_cmd));

          constexpr uint16_t mask_register_count = 2;
          constexpr size_t mask_expected_payload_bytes = size_t(mask_register_count) * 2U;
          auto rec_mask_cmd = esphome::modbus_controller::ModbusCommandItem::create_read_command(
              id(bms0), esphome::modbus::EntityType::HOLDING, 0x1240, mask_register_count,
              [](esphome::modbus::EntityType, uint16_t, std::span<const uint8_t> data) {
                if (data.size() == mask_expected_payload_bytes) {
                  const uint32_t v = (uint32_t(data[0]) << 24) | (uint32_t(data[1]) << 16) |
                                      (uint32_t(data[2]) << 8) | uint32_t(data[3]);
                  id(cell_connected_mask)->publish_state(float(v));
                  id(cell_connected_mask_exact)->publish_state(std::to_string(v));
                  id(g_cell_connected_mask_raw) = v;
                  id(g_cell_connected_mask_valid) = true;
                }
                id(g_topology_recovery_mask_done) = true;
              });
          id(bms0)->queue_command(std::move(rec_mask_cmd));

  # ---- Generic write transaction servicer (jk_write_tx) — drives EVERY
  # in-use slot in g_write_tx_slots through ACK_WAIT -> READBACK_WAIT ->
  # CONFIRMED/MISMATCH/ACK_TIMEOUT/READBACK_TIMEOUT via
  # jk_write_tx::tick() (pure logic, unit-tested in
  # test/jk_write_tx/test_jk_write_tx_core.cpp). The ONLY hardware-facing
  # work here is: issuing the forced one-shot readback the instant tick()
  # first asks for one, and freeing a terminal slot ~3s later so a later
  # write to a different register can reuse the capacity.
  # CORRECTED (2026-09-18, user-directed): create_read_command()'s count
  # parameter is Modbus REGISTERS, confirmed against the real esphome
  # 2026.9.0 source (send() forwards it verbatim into
  # create_client_pdu(function_code, start_address, register_count, ...),
  # the literal FC03 quantity-of-registers field -- unchanged from
  # 2026.8.2, independently re-verified against 2026.9.0 specifically
  # since that is the actual HA build in use). s.word_count is ALREADY a
  # register count (1 for a 16-bit register, 2 for a packed 32-bit pair
  # -- see begin_write_tx's own word_count parameter and
  # protocol/registers.canonical.json's word_count field), so it is used
  # directly as register_count below -- the prior "JK-PB expects the
  # register count in bytes" comment this replaces was never true of this
  # framework call and doubled every readback/recovery-probe request
  # (word_count*2 registers instead of word_count registers), exactly the
  # same class of bug fixed in the CellConWireRes0-31 read (see
  # jk_capability_core.h's AttemptOutcome module comment). Currently only
  # word_count=2 (32-bit) is exercised in production (write_bms_u32, the
  # only invoked generic-write entry point -- write_bms_u16 is defined but
  # never called), so word_count=1 stays desktop-test-verified only until
  # a real 16-bit RW field is write-enabled.
  - interval: 250ms
    then:
      - lambda: |-
          const uint32_t now = millis();
          bool changed = false;
          for (size_t i = 0; i < 6; i++) {
            if (!id(g_wtx_in_use)[i]) continue;

            // Load -> tick() (the one, unit-tested state machine) -> store.
            jk_write_tx::Slot s;
            s.in_use = true;
            s.tx_id = id(g_wtx_tx_id)[i];
            s.address = id(g_wtx_address)[i];
            s.word_count = id(g_wtx_word_count)[i];
            s.requested_raw = id(g_wtx_requested_raw)[i];
            s.readback_raw = id(g_wtx_readback_raw)[i];
            s.compare_mask = id(g_wtx_compare_mask)[i];
            s.status = id(g_wtx_status)[i];
            s.started_ms = id(g_wtx_started_ms)[i];
            s.acked = id(g_wtx_acked)[i] != 0;
            s.readback_started_ms = id(g_wtx_readback_started_ms)[i];
            s.readback_done = id(g_wtx_readback_done)[i] != 0;
            s.finished_ms = id(g_wtx_finished_ms)[i];
            s.generation = id(g_wtx_generation)[i];

            const uint8_t prev_status = s.status;
            const auto result = jk_write_tx::tick(s, now);
            bool terminal = result.terminal;

            // Third critical audit (2026-09-10, item 7): an ACK/readback
            // timeout is never reported as a plain completed error for
            // the generic manager -- the write may have silently taken
            // effect. Reclassify into jk_write_tx::WRITE_UNCERTAIN right
            // here (NOT terminal yet), which also blocks a new write to
            // this same address via jk_write_tx::is_pending(), and arm an
            // immediate recovery-readback probe below -- mirroring the
            // pattern CellCount's own bespoke uncertainty-recovery probe
            // already uses (resolve_topology / g_topology_recovery_*).
            if (terminal && (s.status == jk_write_tx::ACK_TIMEOUT || s.status == jk_write_tx::READBACK_TIMEOUT)) {
              ESP_LOGW("jk_write_tx", "tx_id=%u addr=0x%04X ack/readback timeout (status=%u) -- entering WRITE_UNCERTAIN, launching recovery probe",
                       unsigned(s.tx_id), unsigned(s.address), unsigned(s.status));
              s.status = jk_write_tx::WRITE_UNCERTAIN;
              id(g_wtx_recovery_pending)[i] = 1;
              id(g_wtx_recovery_next_ms)[i] = now;
              terminal = false;
            }

            id(g_wtx_status)[i] = s.status;
            id(g_wtx_readback_started_ms)[i] = s.readback_started_ms;
            if (s.status != prev_status) changed = true;

            // Uncertainty recovery probe -- only runs while WRITE_UNCERTAIN
            // and no probe is already in flight for this slot; re-issued
            // every 2s if a prior probe never got a response (mirrors the
            // real ack/readback timeouts this same manager already uses).
            // The callback captures the SAME immutable {idx, tx_id,
            // address, generation} quadruple as the ACK/readback
            // callbacks above and additionally re-checks the slot is
            // still WRITE_UNCERTAIN -- a stale or superseded probe result
            // must never mutate a transaction it no longer belongs to.
            // Plan M8.1: the probe is one more read, so it is issued only
            // once no write intent drains the hub and no transaction owns
            // the bus (this slot itself, WRITE_UNCERTAIN, does not) -- it can
            // never land between another write's ACK and its readback.
            if (s.status == jk_write_tx::WRITE_UNCERTAIN && id(g_wtx_recovery_pending)[i] &&
                now >= id(g_wtx_recovery_next_ms)[i] &&
                jk_write_tx::recovery_probe_allowed(jk_write_tx::bus_owner(
                    id(g_wtx_in_use), id(g_wtx_status), 6, id(g_cellcount_tx_pending), id(g_topology_recovery_pending),
                    id(g_passcode_tx_pending), jk_cluster_runtime::g_write_intent.active))) {
              id(g_wtx_recovery_next_ms)[i] = now + 2000U;
              const uint16_t addr = s.address;
              // register_count is Modbus REGISTERS (word_count itself --
              // see this interval's own module comment above);
              // expected_payload_bytes is the separate, explicit BYTE
              // budget used only for response-length validation/decode,
              // never re-inlined into the wire request.
              const uint16_t register_count = uint16_t(s.word_count);
              const size_t expected_payload_bytes = size_t(register_count) * 2U;
              const uint32_t recovery_tx_id = s.tx_id;
              const uint16_t recovery_addr = s.address;
              const uint32_t recovery_generation = s.generation;
              auto recovery_cmd = esphome::modbus_controller::ModbusCommandItem::create_read_command(
                  id(bms0), esphome::modbus::EntityType::HOLDING, addr, register_count,
                  [i, recovery_tx_id, recovery_addr, recovery_generation, expected_payload_bytes](esphome::modbus::EntityType, uint16_t,
                      std::span<const uint8_t> data) {
                    if (id(g_wtx_generation)[i] != recovery_generation || id(g_wtx_tx_id)[i] != recovery_tx_id ||
                        id(g_wtx_address)[i] != recovery_addr || id(g_wtx_status)[i] != jk_write_tx::WRITE_UNCERTAIN) {
                      ESP_LOGW("jk_write_tx", "Stale recovery-probe response for tx_id=%u addr=0x%04X ignored (slot %d no longer WRITE_UNCERTAIN on this generation)",
                               unsigned(recovery_tx_id), unsigned(recovery_addr), int(i));
                      return;
                    }
                    // EXACT match, not a floor (user-directed: "коротка/
                    // зайва відповідь не підтверджує запис") -- a
                    // fixed-register_count FC03 read has a deterministic
                    // response size; anything else (short OR long) is a
                    // real anomaly, never silently accepted as a valid
                    // readback.
                    if (data.size() != expected_payload_bytes) {
                      ESP_LOGW("jk_write_tx", "Recovery-probe readback length mismatch for tx_id=%u addr=0x%04X (%u/%u bytes)",
                               unsigned(recovery_tx_id), unsigned(recovery_addr), unsigned(data.size()), unsigned(expected_payload_bytes));
                      return;
                    }
                    uint32_t v = 0;
                    for (size_t b = 0; b < expected_payload_bytes; b++) v = (v << 8) | uint32_t(data[b]);
                    id(g_wtx_readback_raw)[i] = v;
                    const bool matches = jk_write_tx::compare_masked(id(g_wtx_requested_raw)[i], v, id(g_wtx_compare_mask)[i]);
                    id(g_wtx_status)[i] = matches ? jk_write_tx::RECOVERED_CONFIRMED : jk_write_tx::RECOVERED_MISMATCH;
                    id(g_wtx_recovery_pending)[i] = 0;
                    id(g_wtx_finished_ms)[i] = millis();
                    ESP_LOGI("jk_write_tx", "Recovery probe resolved tx_id=%u addr=0x%04X -> status=%u (requested=%u recovered=%u)",
                             unsigned(recovery_tx_id), unsigned(recovery_addr), unsigned(id(g_wtx_status)[i]),
                             unsigned(id(g_wtx_requested_raw)[i]), unsigned(v));
                    id(publish_write_tx_snapshot)->execute();
                  });
              id(bms0)->queue_command(std::move(recovery_cmd));
            }

            if (result.issue_readback) {
              const uint16_t addr = s.address;
              // register_count is Modbus REGISTERS (word_count itself);
              // expected_payload_bytes is the separate BYTE budget for
              // response-length validation/decode only -- same split as
              // the recovery-probe read above and the CellConWireRes0-31
              // fix this pattern is modeled on.
              const uint16_t register_count = uint16_t(s.word_count);
              const size_t expected_payload_bytes = size_t(register_count) * 2U;
              // Third critical audit (2026-09-10, item 6): same immutable-
              // quadruple capture-and-verify as the ACK callback above — a
              // late readback response for a transaction this slot has
              // since moved past must never write into the NEW
              // transaction's readback_raw/readback_done, nor republish a
              // stale value into the display entity below.
              const uint32_t readback_tx_id = s.tx_id;
              const uint16_t readback_addr = s.address;
              const uint32_t readback_generation = s.generation;
              auto read_cmd = esphome::modbus_controller::ModbusCommandItem::create_read_command(
                  id(bms0), esphome::modbus::EntityType::HOLDING, addr, register_count,
                  [i, readback_tx_id, readback_addr, readback_generation, expected_payload_bytes](esphome::modbus::EntityType, uint16_t,
                      std::span<const uint8_t> data) {
                    if (id(g_wtx_generation)[i] != readback_generation || id(g_wtx_tx_id)[i] != readback_tx_id ||
                        id(g_wtx_address)[i] != readback_addr) {
                      ESP_LOGW("jk_write_tx", "Stale readback for tx_id=%u addr=0x%04X ignored (slot %d now on a newer transaction)",
                               unsigned(readback_tx_id), unsigned(readback_addr), int(i));
                      return;
                    }
                    // EXACT match, not a floor -- same reasoning as the
                    // recovery-probe read above: a short OR an excess
                    // response must never confirm a write.
                    if (data.size() != expected_payload_bytes) {
                      ESP_LOGW("jk_write_tx", "Readback length mismatch for tx_id=%u addr=0x%04X (%u/%u bytes)",
                               unsigned(id(g_wtx_tx_id)[i]), unsigned(id(g_wtx_address)[i]),
                               unsigned(data.size()), unsigned(expected_payload_bytes));
                      return;
                    }
                    uint32_t v = 0;
                    for (size_t b = 0; b < expected_payload_bytes; b++) v = (v << 8) | uint32_t(data[b]);
                    id(g_wtx_readback_raw)[i] = v;
                    id(g_wtx_readback_done)[i] = 1;
                    // BUG FIX: a CONFIRMED transaction only ever proved the
                    // register itself changed -- it never told the entity
                    // the REST of the UI actually displays that value from
                    // (a separate sensor with its own slow, independent
                    // poll cycle, e.g. cell_ovp or charging_control_raw).
                    // That display entity kept its stale pre-write value
                    // until its own next poll happened to land, and a
                    // template select/number re-evaluates and republishes
                    // on ITS OWN timer too -- so a confirmed write could
                    // visibly "revert" seconds later when that timer fired
                    // before the underlying sensor's own poll caught up
                    // (reported live: turning Заряд дозволено off, seeing
                    // it confirm, then watching it flip back on). Publish
                    // the just-verified readback directly into the display
                    // entity here, for every simple (non-packed) generic
                    // register, so there is no window where the display can
                    // show anything other than what was just confirmed.
                    // Packed sub-field registers (rcv/rfv time, lcd buzzer
                    // trigger + dry contact 1 source sharing 0x14E4, heating
                    // activation/deactivation sharing 0x111C, dry contact 2
                    // source at 0x14E6) are NOT covered here yet -- each
                    // needs its own byte/shift extraction matching its own
                    // display sensor's read lambda; left as a follow-up.
                    const uint16_t a = id(g_wtx_address)[i];
                    if (a == 0x1070) { id(charging_control_raw)->publish_state(float(v)); }
                    else if (a == 0x1074) { id(discharging_control_raw)->publish_state(float(v)); }
                    else if (a == 0x1078) { id(balancing_control_raw)->publish_state(float(v)); }
                    else if (a == 0x107C) { id(battery_capacity)->publish_state(float(v) / 1000.0f); }
                    else if (a == 0x1014) { id(start_balance_trigger)->publish_state(float(v) / 1000.0f); }
                    else if (a == 0x1084) { id(start_balance)->publish_state(float(v) / 1000.0f); }
                    else if (a == 0x1048) { id(max_balance_current)->publish_state(float(v) / 1000.0f); }
                    else if (a == 0x100C) { id(cell_ovp)->publish_state(float(v) / 1000.0f); }
                    else if (a == 0x1020) { id(cell_rcv)->publish_state(float(v) / 1000.0f); }
                    else if (a == 0x1018) { id(soc_100)->publish_state(float(v) / 1000.0f); }
                    else if (a == 0x1010) { id(cell_ovpr)->publish_state(float(v) / 1000.0f); }
                    else if (a == 0x1008) { id(cell_uvpr)->publish_state(float(v) / 1000.0f); }
                    else if (a == 0x101C) { id(soc_0)->publish_state(float(v) / 1000.0f); }
                    else if (a == 0x1004) { id(cell_uvp)->publish_state(float(v) / 1000.0f); }
                    else if (a == 0x1028) { id(system_power_off)->publish_state(float(v) / 1000.0f); }
                    else if (a == 0x1024) { id(cell_rfv)->publish_state(float(v) / 1000.0f); }
                    else if (a == 0x1000) { id(smart_sleep)->publish_state(float(v) / 1000.0f); }
                    else if (a == 0x102C) { id(continued_charge_current)->publish_state(float(v) / 1000.0f); }
                    else if (a == 0x1030) { id(charge_ocp_delay)->publish_state(float(v)); }
                    else if (a == 0x1034) { id(charge_ocpr_time)->publish_state(float(v)); }
                    else if (a == 0x1038) { id(continued_discharge_current)->publish_state(float(v) / 1000.0f); }
                    else if (a == 0x103C) { id(discharge_ocp_delay)->publish_state(float(v)); }
                    else if (a == 0x1040) { id(discharge_ocpr_time)->publish_state(float(v)); }
                    else if (a == 0x1044) { id(scpr_time)->publish_state(float(v)); }
                    else if (a == 0x1080) { id(scp_delay)->publish_state(float(v)); }
                    else if (a == 0x1054) { id(discharge_otp)->publish_state(float(int32_t(v)) / 10.0f); }
                    else if (a == 0x1058) { id(discharge_otpr)->publish_state(float(int32_t(v)) / 10.0f); }
                    else if (a == 0x104C) { id(charge_otp)->publish_state(float(int32_t(v)) / 10.0f); }
                    else if (a == 0x1050) { id(charge_otpr)->publish_state(float(int32_t(v)) / 10.0f); }
                    else if (a == 0x1060) { id(charge_utpr)->publish_state(float(int32_t(v)) / 10.0f); }
                    else if (a == 0x105C) { id(charge_utp)->publish_state(float(int32_t(v)) / 10.0f); }
                    else if (a == 0x1064) { id(mos_otp)->publish_state(float(int32_t(v)) / 10.0f); }
                    else if (a == 0x1068) { id(mos_otpr)->publish_state(float(int32_t(v)) / 10.0f); }
                    else if (a == 0x14F0) { id(dry_contact_1_trigger_value)->publish_state(float(int32_t(v))); }
                    else if (a == 0x14F4) { id(dry_contact_1_recovery_value)->publish_state(float(int32_t(v))); }
                    else if (a == 0x14F8) { id(dry_contact_2_trigger_value)->publish_state(float(int32_t(v))); }
                    else if (a == 0x14FC) { id(dry_contact_2_recovery_value)->publish_state(float(int32_t(v))); }
                    else if (a == 0x111C) {
                      id(heating_activation_temperature)->publish_state(float(int8_t(uint8_t((v >> 8) & 0xFF))));
                      id(heating_deactivation_temperature)->publish_state(float(int8_t(uint8_t(v & 0xFF))));
                    }
                    else if (a == 0x14E4) {
                      id(lcd_buzzer_trigger)->publish_state(float((v >> 8) & 0xFF));
                      id(dry_contact_1_trigger_source)->publish_state(float(v & 0xFF));
                    }
                    else if (a == 0x14E6) { id(dry_contact_2_trigger_source)->publish_state(float((v >> 8) & 0xFF)); }
                  });
              id(bms0)->queue_command(std::move(read_cmd));
            }

            if (terminal) {
              id(g_wtx_finished_ms)[i] = now;
              ESP_LOGI("jk_write_tx", "Transaction tx_id=%u addr=0x%04X terminal status=%u (requested=%u readback=%u)",
                       unsigned(s.tx_id), unsigned(s.address), unsigned(s.status),
                       unsigned(s.requested_raw), unsigned(id(g_wtx_readback_raw)[i]));
            }

            const bool still_pending = s.status == jk_write_tx::SENDING || s.status == jk_write_tx::ACK_WAIT ||
                                        s.status == jk_write_tx::READBACK_WAIT;
            const uint32_t finished_ms = id(g_wtx_finished_ms)[i];
            if (!still_pending && finished_ms != 0 && now - finished_ms > 3000U) {
              id(g_wtx_in_use)[i] = 0;
              changed = true;
            }
          }
          if (changed) id(publish_write_tx_snapshot)->execute();

          // Second corrective pass (2026-09-21): this project supports up
          // to 6 CONCURRENT write-tx slots, but the crash-stage marker is
          // a single, RTC-backed global -- per Task 6's explicit
          // requirement, a lone global must never paint a false picture
          // when more than one transaction can be in flight. Rather than
          // add 6 separate RTC-backed per-slot markers (real complexity
          // for a diagnostic-only value), this publishes the conservative
          // AGGREGATE the spec explicitly allows: STAGE_TRANSACTION_PENDING
          // means "at least one write is genuinely still outstanding
          // somewhere" (never a specific slot's identity), and the marker
          // only returns to STAGE_IDLE once EVERY slot has left the
          // pending set. This also fixes the main-loop consumer's own
          // premature-IDLE bug on its success path (jk_write_tx_core.h's
          // own module comment / batterylifepo4.yaml's write-registry
          // consumer, above): that consumer used to reset straight to
          // IDLE the instant a transaction was accepted, even though the
          // real ACK/readback was still outstanding -- this tick,
          // running every 250ms, is what now keeps the marker honestly at
          // TRANSACTION_PENDING for that entire outstanding window and
          // only clears it once every slot the way THIS project's own
          // is_pending() would define it) has genuinely finished.
          bool any_pending = false;
          for (size_t i = 0; i < 6; i++) {
            if (id(g_wtx_in_use)[i] && jk_write_tx::is_pending(id(g_wtx_status)[i])) any_pending = true;
            // Same corrective pass: publishes the active-transaction
            // atomic snapshot RegisterWritePreflightHandler now reads
            // (jk_preflight_snapshot_core.h), instead of that HTTP-task
            // handler scanning id(g_wtx_in_use)/id(g_wtx_address)/
            // id(g_wtx_tx_id)/id(g_wtx_status) directly. This copy is
            // safe for the identical reason the aggregate check above is:
            // it runs entirely on the main loop, which already
            // exclusively owns every one of these plain globals. (No
            // early `break` here, unlike a plain existence check, since
            // every slot must still be visited to publish its own
            // snapshot regardless of any earlier slot's pending state.)
            jk_write_tx::publish_write_tx_snapshot_slot(jk_write_tx::g_write_tx_snapshot_table, i,
                                                          id(g_wtx_in_use)[i] != 0, id(g_wtx_address)[i],
                                                          id(g_wtx_tx_id)[i], id(g_wtx_status)[i]);
          }
          jk_diag::mark_write_crash_stage(any_pending ? jk_diag::STAGE_TRANSACTION_PENDING : jk_diag::STAGE_IDLE);

      # Setup passcode transaction (see g_passcode_tx_pending's comment,
      # globals) -- same write -> ACK -> forced-readback shape as the
      # generic manager above, kept separate only because it's an 8-word
      # payload; shares this interval's 250ms cadence.
      - lambda: |-
          if (!id(g_passcode_tx_pending)) return;
          const uint32_t now = millis();

          if (!id(g_passcode_write_acked)) {
            if (now - id(g_passcode_tx_started_ms) > 3000U) {
              ESP_LOGW("jk_passcode", "Passcode write not acknowledged within 3s -- WRITE_UNCERTAIN");
              id(g_passcode_tx_pending) = false;
              id(setup_passcode_tx_status_code)->publish_state(7.0f);  // ack_timeout
            }
            return;
          }

          if (id(g_passcode_readback_started_ms) == 0U) {
            id(g_passcode_readback_started_ms) = now;
            id(setup_passcode_tx_status_code)->publish_state(3.0f);  // readback_wait
            const uint32_t tx_id = id(g_passcode_tx_id);
            // Register-count unit fix (2026-09-18, user-directed):
            // setup_passcode (0x1470) is word_count=8 in
            // protocol/registers.canonical.json (128-bit / 8x 16-bit
            // registers) -- 8 registers, 16 bytes -- matching exactly
            // what the decode below reads (8 words). The prior literal
            // "16" was REGISTERS (32 bytes on the wire), double the real
            // block.
            constexpr uint16_t register_count = 8;
            constexpr size_t expected_payload_bytes = size_t(register_count) * 2U;
            auto read_cmd = esphome::modbus_controller::ModbusCommandItem::create_read_command(
                id(bms0), esphome::modbus::EntityType::HOLDING, 0x1470, register_count,
                [tx_id](esphome::modbus::EntityType, uint16_t,
                        std::span<const uint8_t> data) {
                  // EXACT match, not a floor.
                  if (id(g_passcode_tx_id) != tx_id || data.size() != expected_payload_bytes) return;
                  for (size_t i = 0; i < 8; i++) {
                    id(g_passcode_readback_words)[i] = (uint16_t(data[i * 2]) << 8) | uint16_t(data[i * 2 + 1]);
                  }
                  id(g_passcode_readback_done) = true;
                });
            id(bms0)->queue_command(std::move(read_cmd));
            return;
          }

          if (id(g_passcode_readback_done)) {
            id(g_passcode_tx_pending) = false;
            bool matches = true;
            for (size_t i = 0; i < 8; i++) {
              if (id(g_passcode_readback_words)[i] != id(g_passcode_expected_words)[i]) { matches = false; break; }
            }
            id(setup_passcode_tx_status_code)->publish_state(matches ? 4.0f : 5.0f);  // confirmed / mismatch
            ESP_LOGI("jk_passcode", "Passcode transaction terminal: %s", matches ? "CONFIRMED" : "MISMATCH");
            return;
          }

          if (now - id(g_passcode_readback_started_ms) > 4000U) {
            ESP_LOGW("jk_passcode", "Passcode readback incomplete after 4s -- WRITE_UNCERTAIN");
            id(g_passcode_tx_pending) = false;
            id(setup_passcode_tx_status_code)->publish_state(8.0f);  // readback_timeout
          }

  # Stage 4 fail-closed rearchitecture (2026-09-21, post-reboot hardware-
  # acceptance audit): the ONLY place a write-registry HTTP request
  # actually reaches begin_write_tx_rmw/write_bms_u32/write_bms_u16 (which
  # in turn reach modbus_controller::queue_command()) -- safe here
  # because this lambda runs on the main loop, the SAME task every other
  # ESPHome/Modbus component call in this file already assumes, unlike
  # RegisterWriteHandler's own handleRequest() (the ESP-IDF httpd
  # server's own FreeRTOS task -- confirmed via this project's own real-
  # source audit, see jk_write_tx_core.h's "HTTP-task-to-main-loop
  # handoff mailboxes" module comment for the full root-cause writeup).
  # 100ms cadence: fast enough that a client polling GET .../status sees
  # a result within roughly one polling round-trip, without adding
  # meaningful main-loop overhead (this body is a no-op early return on
  # every tick with nothing staged, which is the overwhelming majority of
  # ticks).
  - interval: 100ms
    then:
      - lambda: |-
          // A request whose RMW bytes are being pre-read waits here (plan M5:
          // strict 3.5 s gate, one tracked pre-read -- cluster, or the narrow
          // block in a latched fallback). Its one result is not published
          // yet, so the producer keeps refusing new requests; the request
          // ends queued or rejected, never both, never later.
          static bool deferred = false;
          static uint32_t deferred_request_id = 0;
          static char deferred_key[jk_write_tx::kRegisterWriteKeyMaxLen] = {0};
          static double deferred_value = 0.0;
          static uint32_t deferred_submitted_at_ms = 0;
          jk_write_tx::RegisterWriteRequestMailbox req;
          if (deferred) {
            req.request_id = deferred_request_id;
            jk_write_tx::copy_bounded_cstr(req.key, sizeof(req.key), deferred_key);
            req.value = deferred_value;
            req.submitted_at_ms = deferred_submitted_at_ms;
          } else if (!jk_write_tx::try_take_write_request(jk_write_tx::g_register_write_request_mailbox, req)) {
            return;
          }

          jk_diag::mark_write_crash_stage(jk_diag::STAGE_MAIN_LOOP_EXECUTION_STARTED);
          const uint32_t now = millis();

          // Full, independent re-validation -- this consumer trusts
          // NOTHING the HTTP handler already checked (that check ran on a
          // different task, at a possibly-meaningfully-earlier instant
          // given this interval's own 100ms cadence and normal scheduling
          // jitter): registry key, submit_policy=live, topology/BMS
          // health prerequisites (NEW -- the previous handler never
          // checked these at all), value encoding/range, and fresh RAW/
          // read-plan-block geometry. "Current generation" is handled
          // structurally, not by comparing a client-supplied snapshot:
          // jk_write_tx::raw_is_fresh() below is evaluated AT THIS EXACT
          // CONSUMPTION INSTANT against the read-plan block's real,
          // live g_rp_last_success_ms -- strictly more conservative than
          // trusting whatever generation the client last saw in its own
          // preflight, which could itself be stale by the time this runs.
          // "Reboot invalidates a pending request" needs no extra code at
          // all: the mailbox is pure RAM (deliberately never RTC/flash-
          // persisted), so a reboot always resets it to EMPTY -- there is
          // structurally no such thing as a request surviving a reboot to
          // be wrongly resumed.
          jk_write_tx::RejectReason reject_reason = jk_write_tx::RejectReason::NONE;
          const int idx = jk_write_registry::find_entry_index(req.key);
          const jk_write_registry::Entry *e_ptr = nullptr;
          if (idx < 0) {
            reject_reason = jk_write_tx::RejectReason::UNKNOWN_KEY;
          } else {
            e_ptr = &jk_write_registry::kEntries[idx];
            if (e_ptr->submit_policy != jk_write_registry::SubmitPolicy::LIVE)
              reject_reason = jk_write_tx::RejectReason::AUTHORIZATION_REQUIRED;
          }
          if (reject_reason == jk_write_tx::RejectReason::NONE && id(bms_health).state != "LIVE")
            reject_reason = jk_write_tx::RejectReason::BMS_NOT_LIVE;
          if (reject_reason == jk_write_tx::RejectReason::NONE && id(topology_state).state != "CONFIRMED")
            reject_reason = jk_write_tx::RejectReason::TOPOLOGY_NOT_CONFIRMED;

          jk_write_tx::EncodeResult enc;
          if (reject_reason == jk_write_tx::RejectReason::NONE) {
            enc = jk_write_tx::encode_numeric_field(req.value, e_ptr->is_signed, e_ptr->scale, e_ptr->offset,
                                                     e_ptr->minimum, e_ptr->maximum, e_ptr->field_width_bits);
            if (enc.status != jk_write_tx::EncodeStatus::OK) reject_reason = jk_write_tx::RejectReason::VALUE_REJECTED;
          }

          // ONE tracked gate for this request (jk_cluster_runtime::
          // RmwRequest), for every write -- a packed field (RMW) or a
          // full-width 16/32-bit register: each tick is a single decision
          // against a single lookup of the current raw. The merged raw of the
          // QUEUE decision is exactly what is written below -- nothing
          // re-gates it (no second millis(), no parked copy that could run
          // after a result is published). NO_CHANGE: the register already
          // holds the value -- no Modbus command, no write slot, no readback
          // (clustered-read plan M5, owner decision 2026-09-29).
          auto &rmw_req = jk_cluster_runtime::g_register_write_rmw;
          jk_cluster_runtime::RmwStepResult rmw_queued;
          bool no_change = false;
          jk_cluster_runtime::RmwWrite w;
          if (e_ptr != nullptr) {
            w.address = uint16_t(e_ptr->address);
            w.word_count = uint8_t(e_ptr->word_count);
            w.mask = uint32_t(e_ptr->mask);
            w.shift = uint8_t(e_ptr->shift);
            w.encoded = uint32_t(enc.encoded_raw);
            w.full_width = !e_ptr->uses_rmw;
          }
          if (reject_reason == jk_write_tx::RejectReason::NONE) {
            if (!deferred) {
              rmw_req.cancel();  // nothing may survive from an earlier request
              rmw_req.arm(w, now);
            }
            const auto narrow = jk_cluster_runtime::make_narrow_view(jk_read_plan::kBlocks, jk_read_plan::kBlockCount, uint16_t(e_ptr->address),
                                                                     id(g_rp_last_success_ms), id(g_rp_last_raw_word), id(g_rp_pending_index));
            const auto st = rmw_req.step(jk_cluster_runtime::g_runtime, now, narrow);
            if (st.step == jk_cluster_runtime::RmwStep::WAIT) {
              if (!deferred) {
                deferred = true;
                deferred_request_id = req.request_id;
                jk_write_tx::copy_bounded_cstr(deferred_key, sizeof(deferred_key), req.key);
                deferred_value = req.value;
                deferred_submitted_at_ms = req.submitted_at_ms;
              }
              jk_diag::mark_write_crash_stage(jk_diag::STAGE_IDLE);
              return;  // no result yet: re-decided next tick
            }
            if (st.step == jk_cluster_runtime::RmwStep::QUEUE) {
              rmw_queued = st;
            } else if (st.step == jk_cluster_runtime::RmwStep::NO_CHANGE) {
              no_change = true;
            } else {
              reject_reason = st.reason == jk_cluster_cache::Lookup::UNKNOWN ? jk_write_tx::RejectReason::NO_READ_PLAN_BLOCK
                                                                           : jk_write_tx::RejectReason::STALE_RAW;
            }
          }
          // Terminal from here on: the tracked gate can never decide again.
          rmw_req.cancel();
          deferred = false;

          if (no_change) {
            // One final, observable result -- and no write of any kind.
            ESP_LOGI("jk_write_tx", "register-write request_id=%u key=%s: no change -- 0x%04X already holds the value, no Modbus command",
                     unsigned(req.request_id), req.key, unsigned(w.address));
            jk_write_tx::publish_write_result(jk_write_tx::g_register_write_result_table,
                                               jk_write_tx::g_register_write_pending_request_id, req.request_id,
                                               false, 0, jk_write_tx::RejectReason::NO_CHANGE, now);
            jk_diag::mark_write_crash_stage(jk_diag::STAGE_IDLE);
            return;
          }

          if (reject_reason != jk_write_tx::RejectReason::NONE) {
            ESP_LOGW("jk_write_tx", "register-write request_id=%u key=%s rejected by main-loop consumer: %s",
                     unsigned(req.request_id), req.key, jk_write_tx::reject_reason_text(reject_reason));
            jk_write_tx::publish_write_result(jk_write_tx::g_register_write_result_table,
                                               jk_write_tx::g_register_write_pending_request_id, req.request_id,
                                               false, 0, reject_reason, now);
            // Genuinely IDLE here -- this request never allocated a real
            // transaction slot, so there is nothing left in flight for
            // THIS request (a DIFFERENT slot could still be pending from
            // an earlier request; the 250ms tick loop's own aggregate
            // check, below, is what stays authoritative for that -- this
            // call is only ever a best-effort early signal, immediately
            // superseded by that loop's next tick either way).
            jk_diag::mark_write_crash_stage(jk_diag::STAGE_IDLE);
            return;
          }

          // Plan M8.1: the QUEUE decision becomes the one write intent -- no
          // Modbus write yet. From here bus_owner() reports a register write
          // (no new read is issued, read_pause_reason shows it, every OK is
          // disabled) and write_barrier_step queues the write only once the
          // hub has drained, re-validating everything first. Refused at once
          // while another intent drains or any transaction owns the bus.
          const auto owner = jk_write_tx::bus_owner(id(g_wtx_in_use), id(g_wtx_status), 6, id(g_cellcount_tx_pending),
                                                    id(g_topology_recovery_pending), id(g_passcode_tx_pending), false);
          auto &intent = jk_cluster_runtime::g_write_intent;
          if (!jk_cluster_runtime::accept_write_intent(intent, jk_cluster_runtime::IntentSource::REGISTER_REQUEST, w, rmw_queued, now, owner)) {
            ESP_LOGW("jk_write_tx", "register-write request_id=%u key=%s refused: another write is draining the bus or owns it",
                     unsigned(req.request_id), req.key);
            jk_write_tx::publish_write_result(jk_write_tx::g_register_write_result_table,
                                               jk_write_tx::g_register_write_pending_request_id, req.request_id,
                                               false, 0, jk_write_tx::RejectReason::TRANSACTION_UNAVAILABLE, now);
            jk_diag::mark_write_crash_stage(jk_diag::STAGE_IDLE);
            return;
          }
          intent.request_id = req.request_id;
          intent.registry_index = idx;
          intent.value = req.value;
          // No result yet -- write_barrier_step publishes it (queued or refused).
          jk_diag::mark_write_crash_stage(jk_diag::STAGE_IDLE);
          id(publish_read_pause_reason)->execute();
          id(write_barrier_step)->execute();  // an already idle hub: the write is queued right now

  # Pre-write quiescence barrier (plan M8.1): re-decides the one write
  # intent every 20 ms (the read servicer's cadence) -- queue the write once
  # the hub has drained, or refuse it at kQuiesceTimeoutMs. A no-op return
  # when no intent is draining.
  - interval: 20ms
    then:
      - script.execute: write_barrier_step

  # Second corrective pass (2026-09-21): publishes the read-plan block
  # freshness/raw/generation snapshot RegisterWritePreflightHandler now
  # reads (jk_preflight_snapshot_core.h), instead of that HTTP-task
  # handler reading id(g_rp_last_success_ms)/id(g_rp_last_raw_word)/
  # id(g_rp_revision) directly (a genuine cross-task data race -- see
  # that header's own module comment). This copy itself is always safe:
  # it runs entirely on the main loop, the SAME task that already
  # exclusively owns those three plain globals (the read-plan scheduler's
  # own decode callbacks are the only writers, and they too run on the
  # main loop, within ESPHome's own Modbus response dispatch). 100ms
  # cadence matches the write-registry consumer above -- frequent enough
  # that a preflight request sees data at most one tick stale, negligible
  # main-loop cost (jk_read_plan::kBlockCount plain array reads + atomic
  # publishes, no I/O).
  - interval: 100ms
    then:
      - lambda: |-
          static_assert(jk_read_plan::kBlockCount <= jk_write_tx::kMaxReadPlanBlocksForPreflightSnapshot,
                         "jk_preflight_snapshot_core.h's fixed cap must be raised to cover every real read-plan block");
          for (std::size_t i = 0; i < jk_read_plan::kBlockCount; i++) {
            jk_write_tx::publish_read_plan_block_snapshot(
                jk_write_tx::g_read_plan_block_snapshot_table, i,
                id(g_rp_last_success_ms)[i], id(g_rp_last_raw_word)[i], id(g_rp_revision)[i]);
          }
          // Clustered read path (plan M5): the cluster freshness snapshot for
          // GET /settings/read-freshness (httpd task) and the mode entity.
          const uint32_t snap_now = millis();
          const bool lease = jk_cluster_runtime::settings_lease_active(jk_cluster_runtime::g_settings_lease, snap_now);
          jk_cluster_runtime::publish_cluster_snapshot(jk_cluster_runtime::g_cluster_snapshot_table, jk_cluster_runtime::g_runtime, lease);
          char mode[64];
          jk_cluster_runtime::g_runtime.format_mode(mode, sizeof(mode));
          if (id(read_cluster_mode).state != mode) id(read_cluster_mode).publish_state(mode);
          // Write coordination (plan M8): who owns the bus -- published on
          // change by publish_read_pause_reason (also run the instant a write
          // intent is accepted or ends, plan M8.1).
          id(publish_read_pause_reason)->execute();

  - interval: 30s
    then:
      - lambda: |-
          const int idx = id(hist_index);
          id(hist_voltage)[idx] = id(total_voltage).state;
          id(hist_current)[idx] = id(current).state;
          id(hist_power)[idx] = id(power).state;
          id(hist_balance)[idx] = id(balance_current).state;
          id(hist_mosfet_temp)[idx] = id(mosfet_temperature).state;
          id(hist_temp1)[idx] = id(temperature_sensor_1).state;
          id(hist_temp2)[idx] = id(temperature_sensor_2).state;
          id(hist_temp4)[idx] = id(temperature_sensor_4).state;
          id(hist_temp5)[idx] = id(temperature_sensor_5).state;
          id(hist_index) = (idx + 1) % 60;
          if (id(hist_count) < 60) id(hist_count) = id(hist_count) + 1;

  # The real 60-hour Charge Cycle sampler — see cc_hist_* in globals for
  # the memory reasoning. This buffer's own stage_code (0-4) is a
  # deliberate VISUALIZATION-ONLY encoding, distinct from the strict
  # battery_state/charge_phase split used everywhere else: it reads
  # charge_phase (bulk/absorption/float/none) for codes 1-3, and layers
  # in battery_state's "discharging" as code 4 so the chart can still
  # show discharge periods — a real, previously-validated feature — WITHOUT
  # a second history byte. That second-byte alternative was costed
  # (§15 of the directive that requested this pass) at +1 byte/sample x
  # 3600 samples = +3600 bytes (~3.6KB, before struct padding — these are
  # four separate arrays, not a packed struct, so no padding applies) for
  # zero additional information over what this single 5-value byte
  # already encodes — not worth the RAM for a purely presentational
  # buffer. Not reclassified here: stage_code is fully determined by
  # reading charge_phase/charge_status's already-computed state, so there
  # remains exactly one place that decides what the pack is actually doing.
  #
  # code 5 (offline) added for the Charge Cycle timeline rework: still
  # zero RAM cost (uint8_t already had headroom to 255, this just uses
  # one more of the values it always could hold) and lets the history
  # state strip distinguish "communication was down" from "confirmed
  # neutral" instead of collapsing both into one idle-looking segment.
  - interval: 60s
    then:
      - lambda: |-
          const int idx = id(cc_hist_index);
          const float v = id(total_voltage).state;
          const float a = id(current).state;
          const float s = id(state_of_charge).state;
          id(cc_hist_voltage_cv)[idx] = isnan(v) ? INT16_MIN : int16_t(roundf(v * 100.0f));
          id(cc_hist_current_ca)[idx] = isnan(a) ? INT16_MIN : int16_t(roundf(a * 100.0f));
          id(cc_hist_soc)[idx] = isnan(s) ? uint8_t(255) : uint8_t(roundf(s));
          const std::string &status = id(charge_status).state;
          const std::string &phase = id(charge_phase).state;
          uint8_t stage_code = 0; // 0 = idle/unrecognized
          if (status == "offline") stage_code = 5;
          else if (phase == "bulk") stage_code = 1;
          else if (phase == "absorption") stage_code = 2;
          else if (phase == "float") stage_code = 3;
          else if (status == "discharging") stage_code = 4;
          id(cc_hist_stage)[idx] = stage_code;
          id(cc_hist_index) = (idx + 1) % 3600;
          if (id(cc_hist_count) < 3600) id(cc_hist_count) = id(cc_hist_count) + 1;

# charging, discharging, and balancing binary_sensors made as the template sensors
# to optimize number of modbus requests
binary_sensor:
  - platform: template
    id: charging
    name: "charging"
    lambda: |-
      return id(charging_raw).state == 1;

  - platform: template
    id: discharging
    name: "discharging"
    lambda: |-
      return id(discharging_raw).state == 1;

  - platform: template
    id: balancing
    name: "balancing"
    lambda: |-
      // Separate live BalanStatus from register 0x12A6. Values 1 and 2
      // indicate active energy transfer in opposite directions; 0 is idle.
      // This is intentionally independent of the enable switch at 0x1078.
      if (isnan(id(balancing_raw).state)) return {};
      return id(balancing_raw).state > 0.0f;

  # Read-only views of the three output-permission registers. The writer
  # Select entities are internal safety stubs while write evidence is blocked.
  - platform: template
    id: charging_allowed
    name: "charging allowed"
    lambda: |-
      if (isnan(id(charging_control_raw).state)) return {};
      return uint32_t(id(charging_control_raw).state) != 0;

  - platform: template
    id: discharging_allowed
    name: "discharging allowed"
    lambda: |-
      if (isnan(id(discharging_control_raw).state)) return {};
      return uint32_t(id(discharging_control_raw).state) != 0;

  - platform: template
    id: balancing_allowed
    name: "balancing allowed"
    lambda: |-
      if (isnan(id(balancing_control_raw).state)) return {};
      return uint32_t(id(balancing_control_raw).state) != 0;

