  # Reset/crash observability (2026-09-21, post-reboot hardware-
  # acceptance audit) -- a RESETS-SINCE-POWER-ON counter, published once
  # at boot by jk_diag::read_and_reset_boot_diagnostics(). NOT a true
  # persistent-across-power-cycles boot count: it lives entirely in RTC
  # (slow) memory, which does not survive a genuine power-on/brownout
  # (see jk_diag::reset_reason_preserves_rtc_memory()'s own comment) --
  # by design, so this costs zero flash writes/wear. Resets to 1 whenever
  # power was actually lost; increments across any SW/PANIC/watchdog/
  # deep-sleep reset within the same power session.
  - platform: template
