    set_action:
      - lambda: |-
          ESP_LOGE("jk_write_block", "Write to select_balancing (0x1078) rejected: "
                   "reverted to fail-closed pending write-contract verification "
                   "(disruptive/unverified) -- no Modbus command was queued.");

text:
  # `bms_display_name` (text_sensor, elsewhere in this file) is a compile-
  # time substitution — genuinely renaming the pack from the web UI needs
  # an entity ESPHome itself persists across reboots. `optimistic: true` +
  # `restore_value: true` on a template text is exactly that: no custom
  # lambda/preferences code, ESPHome stores and restores it in flash on its
  # own. Empty means "no override" — the UI falls back to bms_display_name.
  - platform: template
    id: device_name_override
    name: "device name override"
    icon: "mdi:rename-box"
    mode: text
    min_length: 0
    max_length: 32
    optimistic: true
    restore_value: true

  - platform: template
    id: setup_passcode
    internal: true
    name: "setup passcode"
    icon: "mdi:form-textbox-password"
    mode: password
    min_length: 1
    max_length: 16
    update_interval: 60s
    # Never publish the secret returned by 0x1470 to API/web clients.
    lambda: return std::string("****************");
    # Reverted to fail-closed (2026-09-10, second critical audit) pending
    # independent write-contract verification (see docs/adr/0001-protocol-
    # catalog.md's sixth-pass addendum): credential-class write, and the
    # prior pass's own encoding was never independently reviewed (URL-
    # query transport, no strict-ASCII validation). The write -> ACK ->
    # forced-readback-and-compare transaction machinery below is untouched
    # and stays fully intact — only this trigger is stubbed.
    set_action:
      - lambda: |-
          ESP_LOGE("jk_passcode", "Passcode write rejected: reverted to "
                   "fail-closed pending write-contract verification "
                   "(credential class) — no Modbus command was queued.");

text_sensor:
  - platform: wifi_info
    ip_address:
      id: wifi_ip_address
      name: "wifi ip address"

  # V2 — BMS communication health: ESP32<->JK BMS (Modbus/RS485), NOT
  # browser<->ESP32 (that's EventSource/SSE, tracked entirely client-side —
  # RECONNECTING only ever describes that link, never this one). Four
  # states driven by g_last_bms_response_ms (set only on a validly-decoded
  # cell-poll response, above). The cell poll runs at 1s with a 15s
  # stuck-request guard, so: LIVE tolerates normal 1s-cadence jitter,
  # DELAYED is "missed a few consecutive poll cycles", STALE is "something
  # is wrong but the ESP32 itself is still running and serving the last
  # known values", OFFLINE is "no confirmed BMS response since boot, or
  # none in the last 30s".
  - platform: template
    id: bms_health
    name: "bms health"
    update_interval: 2s
    lambda: |-
      if (id(g_last_bms_response_ms) == 0) return std::string("OFFLINE");
      const uint32_t elapsed_ms = millis() - id(g_last_bms_response_ms);
      if (elapsed_ms < 3000U) return std::string("LIVE");
      if (elapsed_ms < 10000U) return std::string("DELAYED");
      if (elapsed_ms < 30000U) return std::string("STALE");
      return std::string("OFFLINE");

  # Topology Resolver outputs — published by resolve_topology for
  # LOADING/CONFIRMED/MISMATCH/INVALID/WRITE_UNCERTAIN/OFFLINE, and
  # directly by set_cell_count's set_action for PENDING (the one state
  # the resolver itself never emits — see that script's own comment) — a
  # stable English state/reason code pair (jk_bms.js owns bilingual
  # presentation of both, exactly like it already does for bms_health's
  # LIVE/DELAYED/STALE/OFFLINE). Read resolve_topology's own comment for
  # what each reason code means.
  - platform: template
    id: topology_state
    name: "topology state"
    update_interval: never

  - platform: template
    id: topology_reason
    name: "topology reason"
    update_interval: never

  # Atomic snapshot of every currently-tracked generic write transaction
  # (jk_write_tx_core.h) as a JSON array, e.g.:
  #   [{"addr":4108,"tx_id":17,"status":4,"req":6000,"rb":6000},...]
  # Republished as a whole (never a partial/incremental update) any time a
  # slot changes state — one consistent read always reflects one
  # consistent set of transactions, so the frontend never observes a
  # torn mix of two different revisions. "req"/"rb" are omitted for a
  # slot with suppress_value set (the setup passcode: ACK/readback are
  # still tracked, the actual bytes are never published). Correlation
  # against a specific browser-initiated write is by "addr" (the
  # register's own Modbus address, which the frontend's register catalog
  # already knows) plus "tx_id" being newer than a client-recorded
  # baseline — the same synchronous-revision-check pattern jk_bms.js
  # already uses for CellCount (see writeTransaction()'s RACE FIX comment).
  - platform: template
    id: write_tx_snapshot
    name: "write transaction snapshot"
    update_interval: never

  # Stable UI title. Change only this substitution if the BMS is renamed in
  # the JK mobile application; the editable BLE name is absent from Modbus.
  - platform: template
    id: bms_display_name
    name: "bms display name"
    update_interval: 60s
    lambda: |-
      return std::string("${bms_display_name}");

  # JK-PB device information block: hardware model, not the editable name.
  - platform: modbus_controller
    id: manufacturer_device_id
    name: "manufacturer device id"
    modbus_controller_id: bms0
    register_type: holding
    address: 0x1400
    register_count: 8
    response_size: 16
    raw_encode: ANSI

  - platform: modbus_controller
    id: setup_passcode_readback
    internal: true
    modbus_controller_id: bms0
    register_type: holding
    address: 0x1470  # 0x1400 base + 0x0070 offset
    register_count: 8
    response_size: 16
    raw_encode: ANSI

  - platform: template
    name: "total runtime formatted"
    update_interval: 60s
    lambda: |-
      std::string value = "Unknown";
      if (id(total_runtime) && !isnan(id(total_runtime).state)) {
        uint32_t seconds = (uint32_t) id(total_runtime).state;
        uint32_t years = seconds / (24 * 3600 * 365);
        seconds = seconds % (24 * 3600 * 365);
        uint32_t days = seconds / (24 * 3600);
        seconds = seconds % (24 * 3600);
        uint32_t hours = seconds / 3600;
        value = (years ? to_string(years) + "y " : "") + (days ? to_string(days) + "d " : "") +
                (hours ? to_string(hours) + "h" : "");
      }
      return value;

  - platform: template
    id: alarms
    name: "alarms"
    update_interval: never
    lambda: |-
      static const uint8_t alarms_size = 22;
      static const char *const alarms[alarms_size] = {
        "Wire resistance",
        "MOS OTP",
        "Cell quantity",
        "Current sensor error",
        "Cell OVP",
        "Battery OVP",
        "Charge OCP",
        "Charge SCP",
        "Charge OTP",
        "Charge UTP",
        "CPU Aux comm error",
        "Cell UVP",
        "Batt UVP",
        "Discharge OCP",
        "Discharge SCP",
        "Discharge OTP",
        "Charge MOS",
        "Discharge MOS",
        "GPS Disconnected",
        "Modify PWD. in time",
        "Discharge On Failed",
        "Battery Over Temp Alarm"
      };
      std::string values = "";
      uint32_t mask = id(alarms_bitmask)->state;
      if (mask) {
        for (int i = 0; i < alarms_size; i++) {
          if (mask & (1 << i)) {
            values.append(alarms[i]);
            values.append("; ");
          }
        }
        if (!values.empty()) {
          values.pop_back();
        }
      }
      return values;

  # ============================================================
  # CANONICAL BATTERY STATE + CHARGE PHASE — one resolver computing TWO
  # semantically distinct concepts, each with its own consumer:
  #
  #   battery_state — WHAT THE PACK IS DOING. Public, HA-facing, drives
  #     Web UI main status + its own elapsed timer. Values: idle /
  #     charging / discharging / absorption / float / offline / unknown.
  #     "bulk" is NEVER a battery_state — plain constant-current charging
  #     reports as "charging" here (see charge_phase for the bulk/
  #     absorption/float distinction). This is this text_sensor's own
  #     returned/exposed state (id/name unchanged from earlier — no HA
  #     entity_id churn — only its vocabulary changed).
  #
  #   charge_phase — WHICH PART OF THE CHARGE CURVE, if any. Internal/
  #     diagnostic, drives the Charge Cycle graph + its own elapsed timer.
  #     Values: none / bulk / absorption / float. Computed here, stored in
  #     g_charge_phase_code, read by the separate charge_phase
  #     text_sensor below — ONE computation, two thin presentation
  #     entities, never two independent classifiers.
  #
  # These coincide at every bulk<->absorption<->float transition (both
  # change together) and diverge only once the pack leaves the charging
  # path: charge_phase collapses to "none" for discharging/idle/offline,
  # while battery_state keeps distinguishing those three.
  #
  # SOURCE AUDIT (esphome-jk-bms / this device's Modbus map, checked
  # against the full register list in this file, not assumed):
  #   - No native Bulk/Absorption/Idle/Discharging register exists.
  #   - `charging_float_mode` (0x1114, bitmask 0x0200) IS a real protocol
  #     bit (SOURCE: PROTOCOL) — the one authoritative raw signal here.
  #   - `charging` / `discharging` (0x12C0, upper/lower byte) are Charge-
  #     MOS-enabled / Discharge-MOS-enabled PERMISSION flags, not "current
  #     is presently flowing that direction" — confirmed by this file's
  #     own translated source comment ("Charge (1:open;0:closed) /
  #     Discharge (1:open;0:closed)"). The pre-refactor version of this
  #     lambda gated its entire classification on the charging-enabled
  #     flag alone, which meant "Discharging" was never a reachable
  #     output — actively delivering current to a load and genuinely
  #     sitting idle were both reported identically. That is the bug the
  #     first pass of this resolver fixed.
  #   - `current` (0x1298, signed, verified sign convention: positive =
  #     charging, negative = discharging — see electrical_metrics_scan's
  #     own audit comment above) is the real signal for charge/discharge/
  #     idle direction (SOURCE: DERIVED FROM CURRENT), not the enable
  #     flags.
  #   - Absorption (SOURCE: DERIVED HEURISTIC, NOT protocol-verified) is
  #     classified from total_voltage's own rolling slope — no register
  #     exists for it, and this device offers no way to confirm the JK
  #     app's own internal absorption logic matches this heuristic.
  #
  # PRIORITY (highest first) — see §23/§24 of the directive that requested
  # this: a real, hysteresis-CONFIRMED discharge current is trusted over
  # the Float bit / Absorption heuristic, not the other way around. This
  # is the DERIVED, documented safety choice (not independently verified
  # against real JK firmware behavior under load — no hardware available
  # to confirm how the float bit itself behaves once a load appears; if
  # real-device testing later shows the float bit reliably clears the
  # instant a load starts, this override becomes redundant but still
  # harmless):
  #   1. stale/offline communication -> "offline" (charge_phase "none")
  #   2. hysteresis-CONFIRMED discharge direction -> "discharging"
  #      (overrides Float/Absorption; charge_phase "none")
  #   3. protocol Float bit (only reachable once #2 doesn't apply) ->
  #      "float" (never demoted to idle by near-zero float current)
  #   4. confirmed charge direction -> Bulk/Absorption voltage-slope
  #      classifies charge_phase; battery_state = "charging" (bulk) or
  #      "absorption"
  #   5. confirmed neutral -> "idle"
  #   6. (structurally unreachable given 1-5 are exhaustive, kept as a
  #      defensive net) -> "unknown"
  #
  # DEADBAND / DWELL / FRESH-SAMPLE CONFIRMATION — chosen from this
  # device's real cadence, not a guessed constant: `current` only
  # receives a fresh sample roughly every modbus_controller_update_interval
  # (15s, see the top of this file). A transition requires BOTH the wall-
  # clock dwell to elapse AND at least one genuinely fresh sample to have
  # landed in that window (g_last_current_sample_ms, stamped only inside
  # electrical_metrics_scan's own decode) — wall-clock time elapsing alone,
  # with no real new decode, never confirms a transition on its own.
  #   CURRENT_ENTER_A = 0.5A, CURRENT_EXIT_A = 0.2A: CALIBRATION REQUIRED,
  #     not independently verified against this sensor's real measured
  #     zero-current noise floor (no live hardware access in this
  #     environment to sample it). Chosen as an engineering default
  #     comfortably above typical shunt/quantization noise for a pack in
  #     this class (16S, tens-of-amps typical range) — revisit once real
  #     idle-current noise data is available.
  #   ACTIVE_CONFIRM_MS = 15000 (~1 real poll) / FRESH_SAMPLES_ENTER = 1:
  #     confirms a fresh onset from Idle quickly.
  #   NEUTRAL_DWELL_MS = 30000 (~2 real polls) / FRESH_SAMPLES_EXIT = 2:
  #     Charging/Discharging -> Idle requires two fresh neutral samples,
  #     so one transient near-zero reading never bounces the state.
  #   A direction REVERSAL (charge <-> discharge, both already past ENTER)
  #     still requires its own dwell + fresh-sample count, but with no
  #     forced Idle stop in between — matches how a real load/charge-
  #     source swap actually behaves (§22).
  - platform: template
    id: charge_status
    name: "charge status"
    update_interval: 5s
    lambda: |-
      // ============================================================
      // CENTRALIZED RESOLVER CONSTANTS — the only place any of these are
      // defined; nothing below duplicates a magic number.
      // ============================================================
      // COMM_STALE_MS: matches bms_health's own OFFLINE threshold —
      // communication itself is considered lost past this age.
      static const uint32_t COMM_STALE_MS = 30000;
      // CURRENT_ENTER_A / CURRENT_EXIT_A: INITIAL ENGINEERING DEFAULTS.
      // Tune using real zero-current noise from hardware — not
      // independently verified against this sensor's actual measured
      // noise floor (no live hardware access in this environment). See
      // current_sample_age / the resolver diagnostics text_sensors below
      // for the lightweight rolling observation this needs before
      // recalibrating.
      static const float CURRENT_ENTER_A = 0.5f;
      static const float CURRENT_EXIT_A = 0.2f;
      // STRONG_CURRENT_THRESHOLD_A: INITIAL ENGINEERING DEFAULT. Above
      // this, a single fresh sample is unambiguous enough to confirm a
      // transition immediately; between ENTER and this, noise near the
      // threshold gets a second confirming sample before being trusted.
      static const float STRONG_CURRENT_THRESHOLD_A = 2.5f;
      static const uint32_t ACTIVE_CONFIRM_MS = 15000;   // Idle -> Charging/Discharging dwell
      static const uint32_t NEUTRAL_DWELL_MS = 30000;    // Charging/Discharging -> Idle dwell
      static const int FRESH_SAMPLES_STRONG = 1;         // |current| >= STRONG_CURRENT_THRESHOLD_A
      static const int FRESH_SAMPLES_NEAR_THRESHOLD = 2; // ENTER <= |current| < STRONG_CURRENT_THRESHOLD_A
      static const int FRESH_SAMPLES_EXIT = 2;           // exiting to neutral/Idle

      static float last_voltage = NAN;
      static uint32_t last_sample_ms = 0;
      static uint32_t flat_since_ms = 0;

      // "neutral" | "charge" | "discharge" — confirmed is what's actually
      // used to derive battery_state; candidate is what recent sample(s)
      // suggest, promoted to confirmed only once ITS OWN dwell AND fresh-
      // sample count are both satisfied.
      static std::string confirmed_dir = "neutral";
      static std::string candidate_dir = "neutral";
      static uint32_t candidate_since_ms = 0;
      static int candidate_fresh_samples = 0;
      static uint32_t last_seen_sample_ms = 0; // for detecting a genuinely new decode, not just a re-run of this 5s lambda

      // §29 boot behavior: never report a live-looking Idle before this
      // device has actually decoded at least one real current sample.
      static bool has_valid_data = false;
      // §11 offline-recovery: on reconnect, don't trust the very first
      // (possibly still-stale) post-reconnect tick — require one
      // genuinely fresh sample first, same discipline as a cold boot.
      static bool was_offline = false;

      static std::string last_battery_state = "";
      static std::string last_phase = "";
      std::string battery_state;
      std::string phase; // "none" | "bulk" | "absorption" | "float"
      uint8_t unknown_reason = 0;

      const uint32_t now = millis();
      const uint32_t age_ms = (id(g_last_bms_response_ms) == 0)
          ? UINT32_MAX : (now - id(g_last_bms_response_ms));
      const bool is_offline_now = (age_ms >= COMM_STALE_MS);

      // A fresh current decode landed since we last checked?
      const uint32_t sample_ms = id(g_last_current_sample_ms);
      const bool fresh_sample_arrived = (sample_ms != 0) && (sample_ms != last_seen_sample_ms);
      if (fresh_sample_arrived) {
        last_seen_sample_ms = sample_ms;
        has_valid_data = true;
      }

      if (is_offline_now) {
        // Communication itself is stale/lost — never keep reporting a
        // live-looking operating state over data that isn't live.
        // §10: last known values are preserved in their OWN globals
        // (below, only when we HAD a real state) — never re-published as
        // the current state while offline.
        battery_state = "offline";
        phase = "none";
        was_offline = true;
      } else if (was_offline && !fresh_sample_arrived) {
        // §11: just reconnected (comm age dropped back under threshold)
        // but no genuinely fresh current sample has landed yet this
        // reconnect — resolve as unknown rather than trusting whatever
        // stale value happened to be sitting in `current` the instant
        // communication was declared alive again.
        battery_state = "unknown";
        phase = "none";
        unknown_reason = 2; // post-reconnect, awaiting fresh sample
      } else if (!has_valid_data) {
        // §29: cold boot, no valid current sample decoded yet — never
        // default to Idle before real telemetry exists.
        battery_state = "unknown";
        phase = "none";
        unknown_reason = 1; // no valid telemetry yet since boot
      } else {
        was_offline = false;
        // Direction confirmation runs UNCONDITIONALLY every tick — even
        // while Float/Absorption looks active — so a real load appearing
        // is tracked continuously and can override them once confirmed
        // (priority below), not just when this branch happens to run.
        const float amps = id(current).state;
        if (!isnan(amps)) {
          std::string sample_dir;
          if (amps > CURRENT_ENTER_A) sample_dir = "charge";
          else if (amps < -CURRENT_ENTER_A) sample_dir = "discharge";
          else if (fabsf(amps) < CURRENT_EXIT_A) sample_dir = "neutral";
          else sample_dir = candidate_dir; // inside the hysteresis gap — keep leaning whichever way we already were

          if (sample_dir != candidate_dir) {
            candidate_dir = sample_dir;
            candidate_since_ms = now;
            candidate_fresh_samples = 0;
          }
          if (fresh_sample_arrived) candidate_fresh_samples += 1;

          const uint32_t dwell_needed =
              (confirmed_dir == "neutral") ? ACTIVE_CONFIRM_MS :
              (candidate_dir == "neutral") ? NEUTRAL_DWELL_MS :
              0; // charge<->discharge reversal — confirm without a forced Idle stop
          // Adaptive fresh-sample requirement (§4): an obviously strong
          // current confirms off a single fresh sample; anything closer
          // to the raw ENTER threshold needs a second one, since that's
          // exactly the zone real sensor noise could bounce through.
          const int samples_needed =
              (candidate_dir == "neutral") ? FRESH_SAMPLES_EXIT :
              (fabsf(amps) >= STRONG_CURRENT_THRESHOLD_A) ? FRESH_SAMPLES_STRONG :
              FRESH_SAMPLES_NEAR_THRESHOLD;
          if (candidate_dir != confirmed_dir
              && (now - candidate_since_ms) >= dwell_needed
              && candidate_fresh_samples >= samples_needed) {
            confirmed_dir = candidate_dir;
          }
        }
        // isnan(amps): hold the last confirmed_dir rather than resetting —
        // a single missed decode shouldn't bounce the state.

        // PRECEDENCE (explicit, not an accident of branch order): a
        // hysteresis-CONFIRMED real discharge current always overrides
        // both the protocol Float bit and the derived Absorption
        // heuristic for battery_state — "Protocol Float/Absorption
        // indicate a charging-side mode, but confirmed real energy flow
        // in the discharge direction takes precedence, because it is the
        // more direct, harder-to-fake signal of the two." This is a
        // DERIVED safety choice (§23 of the original directive), not
        // independently verified against real JK firmware behavior under
        // load — no hardware available to confirm how the float bit
        // itself behaves once a load appears.
        if (confirmed_dir == "discharge") {
          last_voltage = NAN;
          flat_since_ms = 0;
          battery_state = "discharging";
          phase = "none";
        } else if (id(charging).state && id(charging_float_mode).state) {
          // Float — real protocol bit, only reached once a confirmed
          // discharge isn't already overriding it above. Authoritative
          // regardless of momentary near-zero current. §9 Float recovery:
          // this check runs on EVERY tick with no separate "returning
          // from discharge" special-case needed — the instant confirmed_dir
          // stops being "discharge" and this bit is still set, Float
          // resolves again immediately, with no forced Idle in between.
          battery_state = "float";
          phase = "float";
        } else if (confirmed_dir == "neutral") {
          last_voltage = NAN;
          flat_since_ms = 0;
          battery_state = "idle";
          phase = "none";
        } else {
          // confirmed_dir == "charge": Bulk vs. Absorption — unchanged
          // voltage-slope heuristic (the only available signal; no
          // native register exists). While still climbing meaningfully,
          // that's Bulk; once the climb has flattened and *stays* flat
          // for a sustained stretch, that's Absorption. The 2-minute
          // flat-hold requirement keeps a momentary lull (a cloud over
          // solar input, a brief load draw) from being misread as
          // Absorption.
          const float voltage = id(total_voltage).state;
          std::string sub_phase;
          if (isnan(voltage)) {
            sub_phase = "bulk";
          } else if (isnan(last_voltage)) {
            last_voltage = voltage;
            last_sample_ms = now;
            flat_since_ms = 0;
            sub_phase = "bulk";
          } else {
            const float elapsed_min = float(now - last_sample_ms) / 60000.0f;
            if (elapsed_min >= 0.5f) {
              const float slope_per_min = (voltage - last_voltage) / elapsed_min;
              last_voltage = voltage;
              last_sample_ms = now;
              if (slope_per_min > 0.02f) {
                flat_since_ms = 0;
              } else if (flat_since_ms == 0) {
                flat_since_ms = now;
              }
            }
            sub_phase = (flat_since_ms != 0 && (now - flat_since_ms) >= 120000) ? "absorption" : "bulk";
          }
          phase = sub_phase;
          // battery_state deliberately says "charging", not "bulk" —
          // bulk/absorption is a charge_phase concept, not a public
          // battery_state value.
          battery_state = (sub_phase == "absorption") ? "absorption" : "charging";
        }
      }

      if (battery_state != last_battery_state) {
        last_battery_state = battery_state;
        id(g_battery_state_started_ms) = now;
      }
      if (phase != last_phase) {
        last_phase = phase;
        id(g_charge_phase_started_ms) = now;
      }
      const uint8_t phase_code = (phase == "bulk") ? 1 : (phase == "absorption") ? 2 : (phase == "float") ? 3 : 0;
      id(g_charge_phase_code) = phase_code;

      // Diagnostics mirrors — written every tick, read-only from every
      // other consumer (see §18/§19 diagnostic entities further down).
      uint8_t bs_code = 0; // 0=unknown
      if (battery_state == "idle") bs_code = 1;
      else if (battery_state == "charging") bs_code = 2;
      else if (battery_state == "discharging") bs_code = 3;
      else if (battery_state == "absorption") bs_code = 4;
      else if (battery_state == "float") bs_code = 5;
      else if (battery_state == "offline") bs_code = 6;
      id(g_battery_state_code) = bs_code;
      // Last-known preservation (§10): only overwritten when we actually
      // HAVE a real (non-offline, non-unknown) state — so it always
      // reflects "what was it doing before it went dark/unresolvable",
      // never overwritten BY offline/unknown themselves.
      if (bs_code != 0 && bs_code != 6) {
        id(g_last_known_battery_state_code) = bs_code;
        id(g_last_known_charge_phase_code) = phase_code;
      }
      id(g_current_direction_code) = (confirmed_dir == "charge") ? 1 : (confirmed_dir == "discharge") ? 2 : 0;
      id(g_candidate_direction_code) = (candidate_dir == "charge") ? 1 : (candidate_dir == "discharge") ? 2 : 0;
      id(g_candidate_fresh_samples_g) = uint8_t(candidate_fresh_samples > 255 ? 255 : candidate_fresh_samples);
      id(g_candidate_since_ms_g) = candidate_since_ms;
      id(g_unknown_reason_code) = unknown_reason;

      return battery_state;

  # V2.2 — thin presentation entity for charge_phase (none/bulk/
  # absorption/float): reads g_charge_phase_code, written once by
  # charge_status's own resolver above. No independent classification
  # logic lives here — this exists so Charge Cycle / diagnostics can
  # reference charge_phase without re-deriving it or reading battery_state
  # and trying to reverse-map "charging" back into "bulk".
  - platform: template
    id: charge_phase
    name: "charge phase"
    update_interval: 5s
    lambda: |-
      switch (id(g_charge_phase_code)) {
        case 1: return std::string("bulk");
        case 2: return std::string("absorption");
        case 3: return std::string("float");
        default: return std::string("none");
      }

  # ============================================================
  # BATTERY STATE RESOLVER DIAGNOSTICS — V2.2 hardening pass. Technical/
  # debug entities, not Overview content: every value here is a read-only
  # mirror of something the charge_status resolver above already computed
  # for itself; nothing here re-derives anything independently.
  # ============================================================
  - platform: template
    id: battery_state_direction
    name: "battery state current direction"
    update_interval: 5s
    lambda: |-
      switch (id(g_current_direction_code)) {
        case 1: return std::string("charge");
        case 2: return std::string("discharge");
        default: return std::string("neutral");
      }

  - platform: template
    id: battery_state_candidate
    name: "battery state candidate direction"
    update_interval: 5s
    lambda: |-
      switch (id(g_candidate_direction_code)) {
        case 1: return std::string("charge");
        case 2: return std::string("discharge");
        default: return std::string("neutral");
      }

  - platform: template
    id: battery_state_unknown_reason
    name: "battery state unknown reason"
    update_interval: 5s
    lambda: |-
      switch (id(g_unknown_reason_code)) {
        case 1: return std::string("no_telemetry_since_boot");
        case 2: return std::string("post_reconnect_awaiting_sample");
        default: return std::string("n/a");
      }

  # §10/§27 — Diagnostics-only "what was it doing before it went dark".
  # Never mirrors the CURRENT live state (that stays offline/none while
  # actually offline) — only updates when the resolver has a real,
  # resolved (non-offline, non-unknown) state to report.
  - platform: template
    id: battery_state_last_known
    name: "battery state last known"
    update_interval: 5s
    lambda: |-
      switch (id(g_last_known_battery_state_code)) {
        case 1: return std::string("idle");
        case 2: return std::string("charging");
        case 3: return std::string("discharging");
        case 4: return std::string("absorption");
        case 5: return std::string("float");
        default: return std::string("unknown");
      }

  - platform: template
    id: charge_phase_last_known
    name: "charge phase last known"
    update_interval: 5s
    lambda: |-
      switch (id(g_last_known_charge_phase_code)) {
        case 1: return std::string("bulk");
        case 2: return std::string("absorption");
        case 3: return std::string("float");
        default: return std::string("none");
      }
