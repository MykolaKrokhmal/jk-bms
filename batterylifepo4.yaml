    accuracy_decimals: 0

  # The last count the resolver actually reached CONFIRMED for — mirrors
  # g_last_confirmed_cell_count. What the UI keeps rendering while
  # topology_state is PENDING (a write is in flight, outcome unknown yet)
  # so nothing "partially" jumps to either the old or the requested
  # topology before a new snapshot is fully confirmed.
  - platform: template
    id: last_confirmed_cell_count
    name: "last confirmed cell count"
    update_interval: never
    accuracy_decimals: 0

  # Monotonic — bumped on every resolver publish (including PENDING/
  # WRITE_UNCERTAIN transaction overrides). Lets a client tell a strictly
  # newer topology determination apart from a merely-identical-looking one.
  - platform: template
    id: topology_revision
    name: "topology revision"
    update_interval: never
    accuracy_decimals: 0

  # Seconds since the resolver last published ANY determination — the
  # "data_freshness" field of the topology model. A large value means the
  # resolver itself has stopped running (e.g. cell-poll wedged), which
  # is a stronger signal than bms_last_update_age alone (that one only
  # covers the raw Modbus link, not whether resolve_topology is actually
  # completing its own logic each cycle).
  - platform: template
    id: topology_data_freshness
    name: "topology data freshness"
    update_interval: 2s
    unit_of_measurement: "s"
    accuracy_decimals: 1
    lambda: |-
      if (id(g_topology_last_publish_ms) == 0) return NAN;
      return float(millis() - id(g_topology_last_publish_ms)) * 0.001f;

