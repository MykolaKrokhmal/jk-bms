  # on this sensor, and it only does so with the configured count once
  # every other cross-check has passed — everywhere else (loading/mismatch/
  # invalid, or simply "not yet resolved this boot") it publishes the full
  # protocol channel capacity (32). User-directed rework (THIRD pass,
  # 2026-09-17): this field's OWN meaning is deliberately UNCHANGED --
  # jk_bms.js's CellCount write-transaction driver still depends on it
  # specifically meaning "trust this count only once CONFIRMED" (see
  # jk_topology_core.h's own Outputs::effective_cell_count comment). The
  # UI's card/row/series/selector COUNT now comes from display_cell_count
  # (below) instead, which is NOT gated on confirmation.
  - platform: template
    id: effective_cell_count
    name: "effective cell count"
    update_interval: never
    accuracy_decimals: 0

  # How many channel cards/rows/series/selectors the UI should render
